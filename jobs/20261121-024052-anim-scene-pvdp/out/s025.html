<section class="vs-scene" id="s025" data-in="cut" data-section="PART 2 · COUNTER, NOT THE BOX" data-series="LETTER BOXES" lang="hi">
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-label="Counter receipt, then two apparent shortcuts">
  <rect width="1920" height="1080" fill="#fbf7ee"/>
  <g id="rule">
    <g id="letter-box">
      <use href="piece:letter-box-pillar" transform="translate(309 181) scale(1.8)"/>
    </g>
    <g id="box-cross" transform="translate(616 506)">

    </g>
    <path id="counter-arrow" d="M707 558h101m-22-22 22 22-22 22" fill="none" stroke="#9e1b1b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="counter">
      <use href="piece:posting-counter" transform="translate(835 496) scale(1.05)"/>
      <text x="1307.5" y="584" text-anchor="middle" font-family="Inter,sans-serif" font-size="55" font-weight="800" fill="#2b2622">Counter</text>
      <g id="counter-tick" transform="translate(1600 567)">

        <path id="tick-stroke" d="m-22 1 15 15 31-35" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <g id="wrong">

      <use href="piece:domestic-envelope" transform="translate(186 430) scale(.59)"/>
      <text id="handwritten" x="224" y="517" font-family="Caveat,cursive" font-size="60" font-weight="700" fill="#2b2622">Registered</text>

    <g id="extra-card">
      <rect x="710" y="300" width="500" height="520" rx="27" fill="#fff" stroke="#ead9a8" stroke-width="3" filter="url(#vs-shadow)"/>

        <g id="extra-stamp-3"><use href="piece:postage-stamp" transform="translate(1105 430) scale(.13)"/></g>

        <g id="extra-stamp-5"><use href="piece:postage-stamp" transform="translate(1087 485) scale(.13)"/></g>

<script type="text/scene">
{
  shots:[[0,'#rule'],[4.26,'#wrong']],
  on:[
    [2.58,'fade','#receipt-caption',{dur:.22}],
    [2.58,'move','#receipt-rise',{by:[0,-220],spring:'soft'}],
    [4.26,'pop','#registered-card',{from:.97,spring:'fast'}],
    [5.14,'write','#handwritten',{dur:.50}],
    [7.04,'pop','#extra-card',{from:.97,spring:'fast'}],
    [7.52,'fade','#extra-stamps-label',{dur:.21}],
    [7.04,'pop','#extra-stamp-1',{from:.84,spring:'fast'}],
    [7.12,'pop','#extra-stamp-2',{from:.84,spring:'fast'}],
    [7.20,'pop','#extra-stamp-3',{from:.84,spring:'fast'}],
    [7.28,'pop','#extra-stamp-4',{from:.84,spring:'fast'}],
    [7.36,'pop','#extra-stamp-5',{from:.84,spring:'fast'}]
  ],
  update(t,section,$) {
    $('#rule')[0].setAttribute('visibility',t<4.26?'visible':'hidden');
    $('#wrong')[0].setAttribute('visibility',t>=4.26?'visible':'hidden');
    $('#receipt-rise')[0].setAttribute('visibility',t>=2.58?'visible':'hidden');
  }
}
</script>
</section>
