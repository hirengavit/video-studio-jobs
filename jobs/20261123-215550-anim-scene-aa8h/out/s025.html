<section class="vs-scene" id="s025" data-in="cut" data-duration="9.78" lang="hi" data-section="PART 1 · LITERATURE FOR THE BLIND" data-series="POSTAL PRODUCTS">
<svg viewBox="0 0 1920 1080" aria-label="Prepaid reply mail: the sender or authorised person’s printed address must be in the country of posting or destination">
<rect width="1920" height="1080" fill="#fbf7ee"/>
<g id="reply">
  <text class="hi" x="120" y="228" font-family="'Noto Sans Devanagari',Inter,sans-serif" font-size="67" font-weight="850" fill="#17634a">छूट: वापसी डाक</text>
  <rect x="120" y="258" width="560" height="5" rx="2.5" fill="#2e7d4f"/>
  <g id="reply-card">
    <rect x="120" y="360" width="540" height="460" rx="26" fill="#fff" stroke="#e1cca5" stroke-width="3"/>
    <use href="piece:postcard-blank" transform="translate(270 440) scale(.6)"/>
    <rect x="177" y="709" width="426" height="77" rx="21" fill="#e3f1e8"/>
    <text x="390" y="761" text-anchor="middle" font-family="Inter,sans-serif" font-size="43" font-weight="820" fill="#17634a">prepaid card</text>
  </g>
  <g id="reply-envelope">
    <rect x="690" y="360" width="540" height="460" rx="26" fill="#fff" stroke="#e1cca5" stroke-width="3"/>
    <g id="reply-envelope-focus">
      <use href="piece:address-envelope" transform="translate(768 430) scale(.6)"/>
    </g>
    <g id="printed-address">
      <rect x="755" y="478" width="410" height="119" rx="16" fill="#fff" stroke="#ead9a8" stroke-width="3"/>
      <text class="hi" x="960" y="527" text-anchor="middle" font-family="'Noto Sans Devanagari',Inter,sans-serif" font-size="39" font-weight="780" fill="#2b2622">sender / authorised</text>
      <text class="hi" x="960" y="574" text-anchor="middle" font-family="'Noto Sans Devanagari',Inter,sans-serif" font-size="39" font-weight="780" fill="#2b2622">व्यक्ति का पता</text>
    </g>
    <g id="printed-chip">
      <rect x="837" y="614" width="246" height="65" rx="25" fill="#fde9a6"/>
      <text class="hi" x="960" y="659" text-anchor="middle" font-family="'Noto Sans Devanagari',Inter,sans-serif" font-size="39" font-weight="790" fill="#7b5200">छपा हुआ</text>
    </g>
    <rect x="747" y="709" width="426" height="77" rx="21" fill="#e3f1e8"/>
    <text x="960" y="761" text-anchor="middle" font-family="Inter,sans-serif" font-size="43" font-weight="820" fill="#17634a">prepaid envelope</text>
  </g>
  <g id="reply-wrapper">
    <rect x="1260" y="360" width="540" height="460" rx="26" fill="#fff" stroke="#e1cca5" stroke-width="3"/>
    <use href="piece:open-ended-wrapper" transform="translate(1374 464) scale(.6)"/>
    <rect x="1317" y="709" width="426" height="77" rx="21" fill="#e3f1e8"/>
    <text x="1530" y="761" text-anchor="middle" font-family="Inter,sans-serif" font-size="43" font-weight="820" fill="#17634a">prepaid wrapper</text>
  </g>
  <g id="posting-country">
    <rect x="405" y="850" width="442" height="76" rx="24" fill="#e3f1e8"/>
    <text class="hi" x="626" y="900" text-anchor="middle" font-family="'Noto Sans Devanagari',Inter,sans-serif" font-size="41" font-weight="790" fill="#17634a">posting वाले देश का</text>
  </g>
  <g id="destination-country">
    <rect x="869" y="850" width="533" height="76" rx="24" fill="#e3f1e8"/>
    <text class="hi" x="1135.5" y="900" text-anchor="middle" font-family="'Noto Sans Devanagari',Inter,sans-serif" font-size="41" font-weight="790" fill="#17634a">या destination देश का</text>
  </g>
</g>
</svg>

<script type="text/scene">
({
  camera:[[0,{zoom:1}]],
  on:[
    [0.52,"fade","#printed-address",{dur:.38}],
    [3.82,"fade","#printed-chip",{dur:.28}],
    [5.46,"fade","#posting-country",{dur:.28}],
    [8.04,"fade","#destination-country",{dur:.28}]
  ],
  update(t,section,$) {
    const focus=$('#reply-envelope-focus')[0];
    if (!focus) return;
    const f=Math.min(1,Math.max(0,(t-.52)/.55));
    const e=f*f*(3-2*f);
    focus.setAttribute('transform','translate('+(-115.2*e)+' '+(-85*e)+') scale('+(1+.12*e)+')');
  }
})
</script>
</section>
