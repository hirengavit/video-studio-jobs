<section class="vs-scene" id="s179" data-in="cut" data-section="PART 9 · COUNTER CHECKS &amp; DUES" data-series="PRODUCTS">
  <svg viewBox="0 0 1920 1080" font-family="Inter, sans-serif" fill="#2b2622">
    <rect width="1920" height="1080" fill="#fbf7ee"/>
    <g id="ex1">
      <text x="960" y="259" text-anchor="middle" font-family="'Noto Sans Devanagari',sans-serif" font-size="78" font-weight="790" fill="#9e1b1b">तीन उदाहरण</text>
      <g id="example-1">
        <rect x="120" y="320" width="540" height="645" rx="28" fill="#fffefa" stroke="#c58a09" stroke-width="4"/>
        <g id="example-heading-1">
          <rect x="145" y="343" width="490" height="79" rx="20" fill="#fde9a6"/>
          <text x="390" y="397" text-anchor="middle" font-size="51" font-weight="790">1 · Letter</text>
        </g>
      </g>
      <g id="example-2">
        <rect x="690" y="320" width="540" height="645" rx="28" fill="#fff" stroke="#ead9a8" stroke-width="4"/>
        <g id="example-heading-2">
          <rect x="715" y="343" width="490" height="79" rx="20" fill="#f3ead6"/>
          <text x="960" y="397" text-anchor="middle" font-size="51" font-weight="790">2 · Letter Card</text>
        </g>
      </g>
      <g id="example-3">
        <rect x="1260" y="320" width="540" height="645" rx="28" fill="#fff" stroke="#ead9a8" stroke-width="4"/>
        <g id="example-heading-3">
          <rect x="1285" y="343" width="490" height="79" rx="20" fill="#f3ead6"/>
          <text x="1530" y="397" text-anchor="middle" font-size="51" font-weight="790">3 · Postcard</text>
        </g>
      </g>
      <g id="example-letter-envelope">
        <use href="piece:domestic-envelope" transform="translate(200 451) scale(.50)"/>
      </g>
      <g id="example-letter-cross">
        <circle cx="522" cy="487" r="43" fill="#4b4f58" stroke="#fffefa" stroke-width="6"/>
        <path d="M506 471L538 503M538 471L506 503" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
      </g>

      <g id="letter-work" text-anchor="middle" fill="#2b2622" font-family="Georgia,'Noto Sans Devanagari',serif" font-size="52" font-weight="700">
        <text id="letter-postage" x="390" y="640">Postage ₹5</text>
        <text id="letter-paid" x="390" y="712">दिए ₹5</text>
        <text id="letter-double" x="390" y="784">₹5 × 2 = ₹10</text>
        <text id="letter-credit" x="390" y="856">− ₹5 credit</text>
      </g>
      <g id="letter-total">
        <rect x="166" y="879" width="448" height="75" rx="37.5" fill="#e3f1e8" stroke="#b8d5be" stroke-width="3"/>
        <text id="letter-total-value" x="390" y="928" text-anchor="middle" font-family="Georgia,'Noto Sans Devanagari',serif" font-size="52" font-weight="700" fill="#235a39">= ₹5 और</text>
      </g>

    </g>
  </svg>
  <script type="text/scene">
  ({
    dur:11.24,
    on:[
      [0,"type","#letter-postage",{cps:23}],
      [2.58,"fade","#letter-paid",{dur:.23}],
      [4.54,"type","#letter-double",{cps:27}],
      [5.40,"type","#letter-credit",{cps:18}],
      [8.58,"fade","#letter-total",{dur:.22}]
    ],
    update(t,section,$) {
      const p=Math.max(0,Math.min(1,t/.34)), u=p*p*(3-2*p);
      for(const target of ['#example-letter-envelope','#example-letter-cross'])
        for(const g of $(target)) g.setAttribute('transform','translate('+(78*u)+' '+(70*u)+') scale('+(1-.20*u)+')');
      for(const l of $('#letter-postage')) l.setAttribute('y',String(708-68*u));
    }
  })
  </script>
</section>
