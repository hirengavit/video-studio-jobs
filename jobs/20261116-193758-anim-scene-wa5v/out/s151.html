  <script type="text/scene">
    {
    update(t, section, $) {
      const v = Math.min(1, Math.max(0, (t - .04) / .75));
      const k = v * v * (3 - 2*v);
      const node = id => section.querySelector(id);
      const move = (ids, dy) => ids.forEach(id => node(id).setAttribute('transform', 'translate(0 ' + dy*k + ')'));
      node('#body-rules').setAttribute('d', [474-16*k,589-32*k,704-47*k,819-47*k].map(y => 'M108 '+y+'H1812').join(''));
      ['#r1-outline','#r2-outline','#r3-outline'].forEach((id,i) => node(id).setAttribute('height', [93,93,94][i]-16*k));
      move(['#r1','#circle-head','#tick-one'], -8);
      move(['#r2','#city','#town','#tick-two'], -24);
      move(['#r2-outline'], -16);
      move(['#r3','#hsg-count'], -32);
      move(['#r4','#licence-head','#copies','#pay-by','#tick-four','#r5'], -47);
      // Row three's labels stay centered in the compressed outline.
      for (const text of node('#r3').querySelectorAll('text')) text.setAttribute('transform', 'translate(0 '+(-8*k)+')');
      node('#r5-outline').setAttribute('height', 94+72*k);
      node('#r5-permission').setAttribute('transform','translate(0 '+(47*(1-k))+')');
    },
    on: [
      [0.00, 'fade', '#division-head', {dur: 0.22}],
      [1.34, 'fade', '#usual-postage', {dur: 0.22}],
      [4.02, 'fade', '#plus-rupee', {dur: 0.22}],
      [5.74, 'fade', '#renewal-march', {dur: 0.22}],
      [7.10, 'fade', '#deposit-before', {dur: 0.22}],
      [10.00, 'fade', '#deposit-empty', {dur: 0.22}]
    ]}
  </script>
