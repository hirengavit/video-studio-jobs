 </svg>
 <script type="text/scene">
 ({
   update(t, section, $) {
     const p = Math.max(0,Math.min(1,(t-5.50)/.36));
     const e = p*p*(3-2*p);
     for(const el of $("#news-class, #sorting-rack")) {
       el.style.opacity = String(1-.60*e);
       el.style.filter = "grayscale(" + e + ")";
     }
   },
   on: [
     [0,"fade","#sorting-treatment",{dur:.38}],
     [3.10,"pop","#airlift-plane",{from:.93}],
     [3.80,"pop","#no-free-airlift",{from:.96}],
     [5.50,"fade","#news-air-surcharge",{dur:.36}],
     [7.10,"highlight","#surcharge-word",{color:"#fde9a6",opacity:1,pad:6,dur:.32}]
   ]
 })
 </script>
</section>
