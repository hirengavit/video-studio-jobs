<section class="vs-scene" id="s162" data-in="cut" data-section="PART 9 · COUNTER CHECKS &amp; DUES" data-series="PRODUCTS">
  <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
    <rect width="1920" height="1080" fill="#fbf7ee"/>
    <g id="steps">
      <use id="counter" href="piece:post-counter-icon" transform="translate(120 260) scale(.7)"/>
      <text class="hi" x="123" y="592" font-size="61" font-weight="790" fill="#9e1b1b">Counter</text>
      <text class="hi" x="125" y="660" font-size="50" font-weight="690" fill="#675442">जाँच के 5 कदम</text>
      <path d="M624 270V910" fill="none" stroke="#ead7b5" stroke-width="9" stroke-linecap="round"/>
      <path id="step-divider" d="M688 355H1800M688 509H1800M688 669H1800M688 829H1800" fill="none" stroke="#e8d7b9" stroke-width="3" stroke-linecap="round"/>
      <rect id="step-one-background" x="560" y="188" width="1240" height="163" rx="27" fill="#fffdf8" stroke="#e5cfaa" stroke-width="3"/>
      <rect id="step-two-background" x="560" y="360" width="1240" height="140" rx="27" fill="#fffdf8" stroke="#e5cfaa" stroke-width="3"/>
      <g id="step-shell-1">
        <circle cx="624" cy="270" r="36" fill="#9e1b1b"/>
        <text x="624" y="286" font-size="45" font-weight="830" fill="#fffefa" text-anchor="middle">1</text>
      </g>
      <g id="step-shell-2">
        <circle cx="624" cy="430" r="36" fill="#9e1b1b"/>
        <text x="624" y="446" font-size="45" font-weight="830" fill="#fffefa" text-anchor="middle">2</text>
      </g>
      <g id="step-shell-3">
        <circle cx="624" cy="590" r="36" fill="#9e1b1b"/>
        <text x="624" y="606" font-size="45" font-weight="830" fill="#fffefa" text-anchor="middle">3</text>
      </g>
      <g id="step-shell-4">
        <circle cx="624" cy="750" r="36" fill="#9e1b1b"/>
        <text x="624" y="766" font-size="45" font-weight="830" fill="#fffefa" text-anchor="middle">4</text>
      </g>
      <g id="step-shell-5">
        <circle cx="624" cy="910" r="36" fill="#9e1b1b"/>
        <text x="624" y="926" font-size="45" font-weight="830" fill="#fffefa" text-anchor="middle">5</text>
      </g>
      <g id="step1">
        <text id="step-one-title" class="hi" x="699" y="291" font-size="56" font-weight="810" fill="#292421">Product पहचानिए</text>
        <use id="mini-forms" href="piece:three-forms-icons" transform="translate(1150 153) scale(.46)"/>
      </g>

      <g id="mini-labels" font-size="34" font-weight="700" text-anchor="middle" fill="#2b2622" font-family="'Noto Sans Devanagari',Inter,sans-serif">
        <text class="hi" id="form-letter" x="1257" y="338">बंद</text>
        <text class="hi" id="form-ilc" x="1472" y="338">मुड़ा</text>
        <text class="hi" id="form-postcard" x="1687" y="338">खुला</text>
      </g>
      <g id="step2">
        <text class="hi" x="699" y="451" font-size="61" font-weight="810" fill="#292421">वज़न और size की सीमा</text>
      </g>

    </g>
  </svg>
  <script type="text/scene">
  ({
    dur:10.74,
    on:[
      [0,"fade","#form-letter",{dur:.21}],
      [1.32,"fade","#form-ilc",{dur:.21}],
      [3.36,"fade","#form-postcard",{dur:.21}],
      [4.80,"fade","#step-two-background, #step2",{dur:.30}]
    ],
    update(t, section, $) {
      const p=(start)=>Math.max(0,Math.min(1,(t-start)/.30));
      const rgb=(a,b,q)=>'rgb('+a.map((n,i)=>Math.round(n+(b[i]-n)*q)).join(',')+')';
      const u=Math.min(1,Math.max(0,t/.30));
      const e=u*u*(3-2*u);
      const m=(a,b)=>a+(b-a)*e;
      for(const bg of $('#step-one-background')) {
        bg.setAttribute('y',String(m(200,188)));
        bg.setAttribute('height',String(m(140,163)));
      }
      for(const d of $('#step-divider')) {
        const y=m(349,355);
        d.setAttribute('d','M688 '+y+'H1800M688 509H1800M688 669H1800M688 829H1800');
      }
      const scale=m(.30,.46), x=m(1240,1150), y=m(183,153);
      for(const mini of $('#mini-forms')) mini.setAttribute('transform','translate('+x+' '+y+') scale('+scale+')');
      for(const [id,centre] of [['form-letter',233],['form-ilc',700],['form-postcard',1167]]) {
        for(const label of $('#'+id)) {
          label.setAttribute('x',String(x+centre*scale));
          label.setAttribute('y',String(m(319,338)));
        }
      }
      const ink=[43,38,34], grey=[111,106,99];
      for(const [k,cue] of [['letter',0],['ilc',1.32],['postcard',3.36]]) {
        const q=p(cue);
        const outlines=rgb(grey,ink,q);
        for(const body of $('#fill-'+k)) {
          body.style.fill=rgb([255,253,248],[243,234,214],q);
          body.style.stroke=outlines;
          body.style.strokeWidth=String(3/scale);
        }
        for(const g of $('#icon-'+k)) {
          g.style.stroke=outlines;
          for(const elt of g.querySelectorAll('[stroke]:not([stroke="none"])')) {
            if(elt!==$('#fill-'+k)[0]) elt.style.stroke=outlines;
          }
        }
      }
      for(const title of $('#step-one-title')) {
        title.style.fill=rgb([41,36,33],grey,p(4.8));
        title.setAttribute('font-size',String(m(61,56)));
      }
    }
  })
  </script>
</section>
