    if (mail && max) max.setAttribute('transform', 'translate(' + (426 + mail.getComputedTextLength() + 24 - 1090) + ' 0)');

    opacity('#recap-key',4.00);
    opacity('#recap-return',5.16);
    opacity('#recap-weight',11.04);
