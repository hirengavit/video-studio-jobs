<section class="vs-scene" id="s135" data-in="cut" data-section="PART 6 · DELIVERY" data-series="PRODUCTS">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <defs><filter id="pod-gray" color-interpolation-filters="sRGB"><feColorMatrix id="pod-saturate" type="saturate" values="1"/></filter></defs>
    <rect width="1920" height="1080" fill="#fbf7ee"/>
    <g id="receipts" font-family="Inter, sans-serif">
      <g id="original-receipt">
        <use href="piece:receipt-slip" transform="translate(140 280) scale(1.3)"/>
        <text x="510" y="371" font-size="50" font-weight="760" fill="#9e1b1b">Original receipt</text>
        <g id="attested-copy">
          <text x="510" y="490" font-size="50" font-weight="740" fill="#2b2622">attested copy</text>
          <text class="hi" x="510" y="553" font-size="42" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-weight="640" fill="#6f6a63">प्रमाणित प्रति</text>
        </g>
        <g id="left-fee">
          <rect x="510" y="640" width="300" height="80" rx="40" fill="#f3ead6"/>
          <text class="hi" x="660" y="691" text-anchor="middle" font-size="44" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-weight="730" fill="#2b2622">तय fee</text>
        </g>
      </g>
      <g id="registered-receipt">
        <path d="M950 278V770" stroke="#ead9a8" stroke-width="2"/>
        <use href="piece:receipt-slip" transform="translate(1000 280) scale(1.3)"/>
        <text x="1370" y="371" font-size="50" font-weight="760" fill="#9e1b1b">registered item</text>
        <g id="signed-receipt">
          <text x="1370" y="490" font-size="50" font-weight="740" fill="#2b2622">signed receipt</text>
          <text class="hi" x="1370" y="553" font-size="42" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-weight="640" fill="#6f6a63">हस्ताक्षरित रसीद</text>
        </g>
        <g id="right-fee">
          <rect x="1370" y="640" width="300" height="80" rx="40" fill="#f3ead6"/>
          <rect id="fee-mark" x="1440" y="651" width="160" height="58" rx="28" fill="#fde9a6"/>
          <text id="right-fee-text" x="1520" y="690" text-anchor="middle" font-size="30" font-weight="720" fill="#2b2622">scheduled fee: —</text>
          <text id="fee-rupees" x="1520" y="694" text-anchor="middle" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-size="48" font-weight="810" fill="#2b2622">₹2</text>
        </g>
      </g>
    </g>
    <g id="insured-pod">
      <use href="piece:insured-envelope-emblem" transform="translate(101 319) scale(0.88)"/>
      <text x="330" y="689" text-anchor="middle" font-family="Inter, sans-serif" font-size="44" font-weight="760" fill="#2b2622">Insured item · sender</text>
      <path id="pod-arrow" d="M558 454 H634 M614 435 L634 454 L614 473" fill="none" stroke="#9e1b1b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <g id="pod-original" filter="url(#pod-gray)">
        <use href="piece:pod-card" transform="translate(660 280)"/>
        <text x="920" y="332" text-anchor="middle" font-family="Inter, sans-serif" font-size="46" font-weight="810" fill="#fff">POD</text>
        <path d="M995 552 q19 -36 22 -19 q-10 31 10 14 l20 -18 q-12 31 6 21 l22 -13 q-8 15 16 3 l20 -4" fill="none" stroke="#2b2622" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <g id="free-pod">
        <rect x="772" y="652" width="296" height="80" rx="40" fill="#2e7d4f"/>
        <text x="920" y="704" text-anchor="middle" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-size="42" font-weight="790" fill="#fff">free · मुफ़्त</text>
      </g>
      <g id="pod-missing">
        <circle cx="920" cy="500" r="50" fill="#f3ead6" stroke="#4b4f58" stroke-width="4"/>
        <path d="M901 481 l38 38 m0 -38 l-38 38" stroke="#4b4f58" stroke-width="8" stroke-linecap="round" fill="none"/>
        <text x="920" y="796" text-anchor="middle" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-size="46" font-weight="770" fill="#4b4f58">न पहुँचे</text>
      </g>
      <path id="certificate-arrow" d="M1204 454 H1296 M1276 435 L1296 454 L1276 473" fill="none" stroke="#9e1b1b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <g id="certificate-card">
        <rect x="1320" y="260" width="480" height="400" rx="30" fill="#fff" stroke="#ead9a8" stroke-width="3" filter="url(#vs-shadow)"/>
        <path d="M1350 260 H1770 Q1800 260 1800 290 V367 H1320 V290 Q1320 260 1350 260Z" fill="#9e1b1b"/>
        <text x="1560" y="330" text-anchor="middle" font-family="Inter, sans-serif" font-size="42" font-weight="810" fill="#fff">delivery certificate</text>
        <text x="1560" y="453" text-anchor="middle" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-size="44" font-weight="760" fill="#2b2622">वितरण प्रमाणपत्र</text>
        <text x="1560" y="536" text-anchor="middle" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-size="40" font-weight="680" fill="#6f6a63">माँगने पर</text>
      </g>
    </g>
  </svg>
  <script type="text/scene">
  {
    shots: [[0, '#receipts'], [3.50, '#insured-pod']],
    on: [
      [0.00, 'swap', '#right-fee-text', {to: '#fee-rupees', dur: 0.32, dist: 18}],
      [0.12, 'fade', '#fee-mark', {dur: 0.24}],
      [3.60, 'draw', '#pod-arrow', {dur: 0.30}],
      [3.60, 'pop', '#pod-original', {from: 0.95, spring: 'soft'}],
      [4.42, 'pop', '#free-pod', {from: 0.93, spring: 'soft'}],
      [5.94, 'fade', '#pod-missing', {dur: 0.30}],
      [7.90, 'draw', '#certificate-arrow', {dur: 0.30}],
      [7.90, 'pop', '#certificate-card', {from: 0.96, spring: 'soft'}],
    ],
    update(t, section, $) {
      const matrix = $('#pod-saturate')[0];
      if (matrix) matrix.setAttribute('values', String(1 - Math.max(0, Math.min(1, (t - 5.94) / 0.30))));
    },
  }
  </script>
</section>
