<script type="text/scene">
({
 camera:[[0,{zoom:1}]],
 on:[
  [0,"fade","#tampering-row",{dur:.20}],
  [6.10,"slide","#receipt-row",{from:"left",dist:40,spring:"snap"}],
  [7.90,"fade","#receipt-focus",{dur:.26}]
 ],
 update(t,section,$){
  const linear=x=>Math.max(0,Math.min(1,x));
  for(const [id,cue] of [["postmaster-rule",1.50],["inventory-rule",3.96],["receipt-limit",6.78]])
   $("#"+id)[0].setAttribute("opacity",String(linear((t-cue)/.23)));
  for(const [id,cue] of [["delivery-pod-band",0],["tampering-band",6.10]]){
   const a=linear((t-cue)/.24);$("#"+id)[0].setAttribute("fill","rgb("+[253+Math.round(2*a),233+Math.round(17*a),166+Math.round(74*a)].join(",")+")");
  }
 }
})
</script>
</section>
