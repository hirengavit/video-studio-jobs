<script type="text/scene">
{
 on:[
  [0.0,'pop','#document-examples',{spring:'soft',from:.94}],
  [1.80,'fade','#letter',{dur:.28}],
  [3.36,'words','#letter-kinds',{gap:.34,dist:11}],
  [7.54,'fade','#packet',{dur:.28}],
  [8.84,'words','#free',{gap:.23,dist:11}],
  [11.56,'fade','#no-resale',{dur:.3}],
  [12.08,'highlight','#no-resale',{words:'resale value',color:'#f2b705',opacity:.36,dur:.32}],
 ],
 update(t, section, $) {
   const advance = id => $(id)[0].getComputedTextLength();
   const spaceProbe = $('#space-advance')[0];
   const space = spaceProbe.getSubStringLength(1, 1) || 12;
   const row1 = 277 + advance('#letter-prefix') + space;
   const row2 = 277 + advance('#packet-prefix') + space;
   const row2End = row2 + advance('#free') + space;
   $('#letter-kinds-position')[0].setAttribute('transform', 'translate(' + row1 + ' 0)');
   $('#free-position')[0].setAttribute('transform', 'translate(' + row2 + ' 0)');
   $('#no-resale-position')[0].setAttribute('transform', 'translate(' + row2End + ' 0)');
 }
}
</script>
