<script type="text/scene">
{
  shots:[[0,'#fm'],[1.72,'#claim-end'],[6.81,'#who']],
  on:[
    [0,'fade','#fm-no-comp',{dur:0.22}],
    [3.78,'fade','#packing-error',{dur:0.28}],
    [4.78,'fade','#claim-chip',{dur:0.22}],
    [7.33,'pop','#sender-en',{from:0.94,spring:'soft'}],
    [7.83,'fade','#sender-hi',{dur:0.27}]
  ],
  update(t,sec,$){
    if(t>=1.72)return;
    const el=$('#fm-def-2')[0],r=$('#fm-held-mark')[0],phrase='लागू शर्तों';
    if(!el||!r)return;
    const a=el.textContent.indexOf(phrase);
    let x=Infinity,y=Infinity,right=-Infinity,b=-Infinity;
    for(let i=a;i<a+phrase.length;i++){
      const q=el.getExtentOfChar(i);x=Math.min(x,q.x);y=Math.min(y,q.y);
      right=Math.max(right,q.x+q.width);b=Math.max(b,q.y+q.height);
    }
    if(Number.isFinite(x)){
      r.setAttribute('x',x-7);r.setAttribute('y',y-3.5);
      r.setAttribute('width',right-x+14);r.setAttribute('height',b-y+7);
    }
  }
}
</script>
