<section class="vs-scene" id="s128" data-in="cut" data-section="KEY POINTS" data-series="LETTER BOXES" lang="hi">
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-label="Key point two: what goes to the postal counter">
  <rect width="1920" height="1080" fill="#fbf7ee"/>
  <text id="key-heading" x="140" y="216" class="hi" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-size="61" font-weight="820" fill="#9e1b1b">सबसे ज़रूरी बातें</text>
  <g id="p2">
    <g id="p2-shell">
      <rect x="680" y="271" width="1100" height="700" rx="32" fill="#f3ead6"/>
      <rect x="680" y="260" width="1100" height="700" rx="32" fill="#fff" stroke="#ead9a8" stroke-width="3"/>
      <path id="p2-dividers" d="M726 435h1008m-1008 175h1008m-1008 175h1008" stroke="#eee4d3" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="p2-stamp">
      <rect x="140" y="271" width="460" height="700" rx="29" fill="#e4bc96"/>
      <rect x="140" y="260" width="460" height="700" rx="29" fill="#9e1b1b"/>
      <rect x="158" y="278" width="424" height="664" rx="19" fill="none" stroke="#fde9a6" stroke-opacity=".82" stroke-width="9" stroke-linecap="round" stroke-dasharray="0 22"/>
      <circle cx="370" cy="493" r="120" fill="#821515" stroke="#d9786e" stroke-width="2.5"/>
      <text id="p2-number" x="370" y="562" text-anchor="middle" font-family="Inter,sans-serif" font-size="185" font-weight="820" fill="#fff">2</text>
      <path d="M213 646h314" stroke="#e5a39a" stroke-width="2"/>
      <text id="p2-title" x="370" y="742" text-anchor="middle" class="hi" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-size="52" font-weight="820" fill="#fff">Counter पर क्या</text>
    </g>
    <g id="p2-row-1">
      <text id="counter-accountable" x="738" y="330" font-family="Inter,sans-serif" font-size="46" font-weight="820" fill="#2b2622">Accountable<tspan id="counter-cod"> · COD</tspan></text>
      <text id="counter-parcels" x="738" y="394" class="hi" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-size="47" font-weight="740" fill="#2b2622">सारे India Post Parcels</text>
      <g id="counter-receipt-pill">
        <rect x="1217" y="282" width="440" height="64" rx="32" fill="#fde9a6"/>
        <text x="1437" y="329" text-anchor="middle" font-family="Inter,sans-serif" font-size="44" font-weight="730" fill="#694700">counter<tspan id="counter-receipt"> + receipt</tspan></text>
      </g>
      <path id="p2-row-1-tick" d="m1678 350 17 17 33-40" fill="none" stroke="#2e7d4f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="p2-row-2">
      <text id="counter-franked" x="738" y="549" font-family="Inter,sans-serif" font-size="46" font-weight="820" fill="#2b2622">Franked<tspan id="counter-newspaper"> · Reg. newspaper</tspan></text>
      <text id="counter-periodical" x="738" y="613" font-family="Inter,sans-serif" font-size="47" font-weight="740" fill="#2b2622">Periodical post</text>
    </g>
  </g>
</svg>
<script type="text/scene">
{
 camera:[[0,{zoom:1}]],
 update(t, section, $) {
  const n = Math.max(0, Math.min(1, t / .40));
  const u = n * n * (3 - 2 * n);
  const stroke = $('#p2-dividers')[0];
  const ys = [435 + 44*u, 610 + 88*u, 785 + 44*u];
  if (stroke) stroke.setAttribute('d', ys.map(y => 'M726 ' + y + 'h1008').join(''));
  for (const [id, start, dur] of [['counter-cod',1.84,.22],['counter-receipt',7.28,.21],['counter-newspaper',9.92,.22]]) {
   const el = $('#' + id)[0];
   if (el) el.setAttribute('opacity', Math.max(0, Math.min(1, (t - start) / dur)));
  }
 },
 on:[
  [0,'fade','#counter-accountable',{dur:.22}],
  [3.98,'fade','#counter-parcels',{dur:.22}],
  [6.28,'fade','#counter-receipt-pill',{dur:.22}],
  [7.94,'draw','#p2-row-1-tick',{dur:.27}],
  [8.88,'fade','#counter-franked',{dur:.22}],
  [12.12,'fade','#counter-periodical',{dur:.22}]
 ]
}
</script>
</section>
