 <script type="text/scene">
 ({
  camera:[[0,{zoom:1}]],
  update(t, section, $){

   const u = Math.max(0,Math.min(1,(t-.10)/1.13));
   const v = u*u*(3-2*u), z = 1-.54*v;
   list.setAttribute("transform","translate("+(960*(1-z))+" "+(190*(1-z))+") scale("+z+")");
  },
  on:[
   [1.46,"fade","#parcel-arrow",{dur:.25}],
   [1.46,"fade","#parcel-term",{dur:.31}],
   [1.96,"fade","#parcel-hi",{dur:.27}],
