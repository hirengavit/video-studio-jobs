 update(t, section, $) {

   ['#weight', '#size', 'वजन,'],
   ['#booking', '#transmission', 'booking,'],
   ['#transmission', '#tracking', 'transmission'],
   ['#business', '#discount', 'business customers की सुविधाएँ']
  ]) {
   const a = $(previous)[0], b = $(next)[0];
   if (!a || !b || !a.parentNode) continue;
   const measure = a.cloneNode(false);
   measure.removeAttribute('id');
   measure.removeAttribute('transform');
   measure.setAttribute('visibility', 'hidden');
   measure.textContent = phrase;
   a.parentNode.appendChild(measure);
   const length = measure.getComputedTextLength();
   measure.remove();
   if (length > 0) b.setAttribute('x', Number(a.getAttribute('x')) + length + 14);
  }
 }
