 </svg>
 <script type="text/scene">
 ({
  camera:[[0,{zoom:1}]],
  update(t, section, $) {
    const ramp = (a,b) => { const k=Math.max(0,Math.min(1,(t-a)/(b-a))); return k*k*(3-2*k); };
    const lift=ramp(.06,.56);
    $("#issued-id-card").forEach(el=>el.setAttribute("transform","translate(0 "+(-44*lift)+")"));
    $("#application").forEach(el=>el.setAttribute("transform","translate(900 -60) translate(375 653) scale("+(1-.40*lift)+") translate(-375 -653)"));
    const dim=ramp(4.91,5.27);
    ["#sub-inquiry","#forward-application","#application"].forEach(id=>$(id).forEach(el=>{el.setAttribute("opacity",1-.60*dim);el.style.filter="grayscale("+dim+")";}));
    const words=$("#trap-line")[0], surface=$("#trap-surface")[0];
    if(words && surface){const w=words.getComputedTextLength()+64; if(w>64){surface.setAttribute("width",w);surface.setAttribute("x",960-w/2);}}
  },
  on:[
   [.57,"pop","#issuer-pill",{from:.96,spring:"soft"}],
   [3.39,"fade","#issuer-name-pill",{dur:.27}],
   [3.39,"highlight","#issuer-name",{color:"#f2b705",opacity:.38,pad:2,dur:.43}],
   [4.91,"fade","#exam-confusion",{dur:.3}],
   [8.50,"fade","#trap-option",{dur:.35}]
  ]
 })
 </script>
</section>
