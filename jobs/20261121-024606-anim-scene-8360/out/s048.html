<script type="text/scene">
{
  camera:[[0,{zoom:1}]],
  shots:[[0,'#linked-clocks'],[4.55,'#flow']],
  on:[
    [0,'fade','#delivery-gloss',{dur:.24}],
    [1.59,'draw','#clock-link-all',{dur:.54}],
    [5.47,'draw','#flow-arrows',{dur:.42}],
    [6.12,'fade','#on-time-chip',{dur:.24}],
    [6.99,'pop','#flow-office',{from:.94,spring:'soft'}],
    [6.99,'fade','#flow-clock',{dur:.24}]
  ],
  update(t,section,$) {
    $('#linked-clocks')[0].setAttribute('display',t<4.55?'inline':'none');
    $('#flow')[0].setAttribute('display',t<4.55?'none':'inline');
    const cues = [[0, -60, 0], [4.90, -30, 0], [8.44, 15, 180]];
    for (let i = 0; i < cues.length; i++) {
      const [start, h, m] = cues[i];
      const p = Math.max(0, Math.min(1, (t - start) / .37));
      const settle = 0;
      const g = $('#clock-' + (i + 1))[0];
      if (!g) continue;
      for (const [part, angle, length] of [['hour', h - 10 * settle, 39], ['minute', m - 23 * settle, 56]]) {
        const hand = g.querySelector('[id$="-' + part + '-hand"], [id="' + part + '-hand"]');
        if (!hand) continue;
        const r = angle * Math.PI / 180;
        hand.setAttribute('d', 'M130 130L' + (130 + length * Math.sin(r)).toFixed(3) + ' ' + (130 - length * Math.cos(r)).toFixed(3));
      }
    }
  }
}
</script>
