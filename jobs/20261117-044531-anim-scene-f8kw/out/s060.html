  update(t,section,$){

  },
  on:[
    [0,'highlight','#absorbent-phrase',{color:'#f2b705',opacity:.38,pad:6,dur:0.001}],
    [1.48,'fade','#absorbent-stain',{dur:.80}],

    [8.95,'type','#protect-mail',{cps:17}],
