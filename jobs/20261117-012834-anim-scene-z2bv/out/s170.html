<script type="text/scene">
{
  camera:[[0,{zoom:1}],[.54,{zoom:1}],[2.32,{zoom:1.05,x:0,y:23},'inOut']],
  update(t,section,$){
    const label=$('#insured-condition')[0], mark=$('#condition-sweep')[0], term='insured packing';
    const from=label.textContent.indexOf(term);
    const p=Math.min(1,Math.max(0,(t-3.98)/.29));
    if(from<0 || p===0){ mark.setAttribute('opacity',0); return; }
    const first=label.getExtentOfChar(from), last=label.getExtentOfChar(from+term.length-1);
    mark.setAttribute('x',first.x-6);
    mark.setAttribute('y',Math.min(first.y,last.y)-3);
    mark.setAttribute('width',(last.x+last.width-first.x+12)*p);
    mark.setAttribute('height',Math.max(first.height,last.height)+6);
    mark.setAttribute('opacity',1);
  },
  on:[
    [0,'fade','#insured-label-bg',{dur:.24}],
    [0,'fade','#insured-label',{dur:.26}],
    [2.34,'type','#insured-condition',{cps:28}]
  ]
}
</script>
