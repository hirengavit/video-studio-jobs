<script type="text/scene">
{
 camera: [[0,{zoom:1}]],
 on: [
  [2.32,'fade','#airtight-pill',{dur:.25}],
  [4.44,'draw','#p3-tick-3',{dur:.29}],
  [5.32,'fade','#r4-liquid',{dur:.24}],
  [6.50,'fade','#r4-perish',{dur:.24}],
  [8.16,'fade','#r4-fragile',{dur:.24}],
  [8.66,'fade','#r4-hi',{dur:.24}],
  [8.92,'fade','#insurance-pill',{dur:.25}],
  [10.50,'highlight','#loss-only',{words:'सिर्फ़ loss',color:'#f2b705',opacity:.42,pad:5,dur:.33}],
  [10.74,'draw','#p3-tick-4',{dur:.30}]
 ],
 update(t, section, $) {
   const smooth = x => x * x * (3 - 2 * x);
   $('#metal-case')[0].setAttribute('opacity',smooth(S.clamp((t - 3.74) / .23)));
   $('#recap-shell')[0].setAttribute('height',670 + 30 * smooth(S.clamp((t - 5.32) / .26)));
 }
}
