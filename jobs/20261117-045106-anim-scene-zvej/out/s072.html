  <script type="text/scene">

    update(t,section,$){
      const p=Math.max(0,Math.min(1,(t-.73)/.28)), k=p*p*(3-2*p);
      for(const [id,dy] of [["#divider-2",80],["#divider-3",38],["#row-name-3",61],["#goods-3-active",61],["#row-name-4",14]]) {
        const el=$(id)[0]; if(el) el.setAttribute("transform","translate(0 "+dy*k+")");

      const f=Math.max(0,Math.min(1,(t-9)/.30));
      const a=$("#goods-1-held")[0], b=$("#goods-2-active")[0];
      if(a) a.setAttribute("opacity",String(1-f)); if(b) b.setAttribute("opacity",String(.65*(1-f)));
    },
    on:[
      [1.04,'pop','#insured-note',{from:.98,spring:'soft'}],
      [4.90,'fade','#stricter-sealing',{dur:.25}],
      [6.40,'fade','#sealing-part',{dur:.28}],
