  <script type="text/scene">
  ({
    dur:10.63,
    on:[
      [0,"fade","#step-five-background, #step-four-dim, #step5",{dur:.29}],
      [2.61,"fade","#prepaid-forms",{dur:.29}],
      [6.92,"out","#mini-forms, #mini-labels, #letter-construction, #ilc-construction, #postcard-construction, #match-postage, #valid-stamp",{dur:.37,scale:1}],
      [7.68,"slide","#letter-box-photo-card",{from:"right",dist:86,spring:"fast"}]
    ],
    update(t, section, $) {
      const prog=Math.max(0,Math.min(1,(t-7.23)/.45));
      if (!prog) return;
      const s=prog*prog*(3-2*prog), right=1800-400*s;
      for (const name of ['one','two','three','four','five']) {
        const row=$('#step-'+name+'-background')[0], dim=$('#step-'+name+'-dim')[0];
        if(row) row.setAttribute('width',right-560);
        if(dim) dim.setAttribute('width',right-558);
      }
      const path=$('#step-dividers')[0];
      if(path) path.setAttribute('d',[349,509,669,829].map(y=>'M688 '+y+'H'+right).join(''));
      const sub=$('#prepaid-forms')[0];
      if(sub) {
        const ns=sub.namespaceURI;
        if (!sub.querySelector('tspan')) {
          sub.textContent='';
          for (const [txt,x,dy] of [['पूरे prepaid ordinary:',699,0],['letter, letter card, postcard',699,39]]) {
            const el=document.createElementNS(ns,'tspan');
            el.setAttribute('x',x);el.setAttribute('dy',dy);el.textContent=txt;sub.append(el);
          }
        }
        sub.setAttribute('y',930);
        sub.setAttribute('font-size',37);
        const title=$('#step5 > text')[0];
        if(title) {title.setAttribute('y',891);title.setAttribute('font-size',48);}
      }
    }
  })
  </script>
