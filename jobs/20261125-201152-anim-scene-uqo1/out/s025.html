 </g>
 <g id="fact">
  <rect x="240" y="560" width="1440" height="240" rx="29" fill="#fff" stroke="#afd7be" stroke-width="4"/>

<script type="text/scene">
({
 camera:[[0,{zoom:1}]],
 on:[
  [2.60,"fade","#insure-highlight",{dur:.24}],
  [3.50,"strike","#myth-line",{dur:.25,color:"#858b94",width:7,dim:.72}],
  [3.50,"pop","#wrong",{from:.92,spring:"snap"}],
  [3.90,"fade","#fact",{dur:.40}],
  [4.40,"stamp","#correct-postmark",{from:1.14,rot:-5,spring:"snap"}]
 ],
 update(t,section,$){
  const word=$("#insure-word")[0], highlight=$("#insure-highlight")[0];
  if(!word || !highlight) return;
  const box=word.getBBox();
  if(!box.width) return;
  highlight.setAttribute("x",box.x-9);
  highlight.setAttribute("width",box.width+18);
 }
})
</script>
</section>
