<section class="vs-scene" id="s025" data-in="cut" data-duration="9.78" lang="hi" data-section="PART 1 · LITERATURE FOR THE BLIND" data-series="POSTAL PRODUCTS">
<svg viewBox="0 0 1920 1080" aria-label="Prepaid reply mail: the sender or authorised person’s printed address must be in the country of posting or destination">
<rect width="1920" height="1080" fill="#fbf7ee"/>
<g id="reply">
  <text class="hi" x="120" y="228" font-family="'Noto Sans Devanagari',Inter,sans-serif" font-size="67" font-weight="850" fill="#17634a">छूट: वापसी डाक</text>
  <rect x="120" y="258" width="560" height="5" rx="2.5" fill="#2e7d4f"/>
  <g id="reply-card">
    <rect x="120" y="360" width="540" height="460" rx="26" fill="#fff" stroke="#e1cca5" stroke-width="3"/>
    <use href="piece:postcard-blank" transform="translate(270 440) scale(.6)"/>
    <rect x="177" y="709" width="426" height="77" rx="21" fill="#e3f1e8"/>
    <text x="390" y="761" text-anchor="middle" font-family="Inter,sans-serif" font-size="43" font-weight="820" fill="#17634a">prepaid card</text>
  </g>
  <g id="reply-envelope">
    <g id="reply-envelope-scale">
    <rect id="envelope-panel" x="690" y="360" width="540" height="460" rx="26" fill="#fff" stroke="#e1cca5" stroke-width="3"/>
    <g id="reply-envelope-focus">
      <use href="piece:address-envelope" transform="translate(768 430) scale(.6)"/>
    </g>
    <g id="printed-address">
      <rect x="708" y="467" width="504" height="140" rx="16" fill="#fff" stroke="#ead9a8" stroke-width="3"/>
      <text id="address-upper" class="hi" x="960" y="521" text-anchor="middle" font-family="'Noto Sans Devanagari',Inter,sans-serif" font-size="48" font-weight="780" fill="#2b2622">sender / authorised</text>
      <text id="address-lower" class="hi" x="960" y="583" text-anchor="middle" font-family="'Noto Sans Devanagari',Inter,sans-serif" font-size="48" font-weight="780" fill="#2b2622">व्यक्ति का पता</text>
    </g>
    <g id="printed-chip">
      <rect x="885" y="621" width="150" height="48" rx="25" fill="#fde9a6"/>
      <text class="hi" x="960" y="655" text-anchor="middle" font-family="'Noto Sans Devanagari',Inter,sans-serif" font-size="30" font-weight="790" fill="#7b5200">छपा हुआ</text>
    </g>
    <rect x="747" y="709" width="426" height="77" rx="21" fill="#e3f1e8"/>
    <text x="960" y="761" text-anchor="middle" font-family="Inter,sans-serif" font-size="43" font-weight="820" fill="#17634a">prepaid envelope</text>
  </g>
    </g>
  <g id="reply-wrapper">
    <rect x="1260" y="360" width="540" height="460" rx="26" fill="#fff" stroke="#e1cca5" stroke-width="3"/>
    <use href="piece:open-ended-wrapper" transform="translate(1374 464) scale(.6)"/>
    <rect x="1317" y="709" width="426" height="77" rx="21" fill="#e3f1e8"/>
    <text x="1530" y="761" text-anchor="middle" font-family="Inter,sans-serif" font-size="43" font-weight="820" fill="#17634a">prepaid wrapper</text>
  </g>
  <g id="posting-country">
    <rect x="430" y="923" width="466" height="72" rx="24" fill="#e3f1e8"/>
    <text class="hi" x="663" y="973" text-anchor="middle" font-family="'Noto Sans Devanagari',Inter,sans-serif" font-size="44" font-weight="790" fill="#17634a">posting वाले देश का</text>
  </g>
  <g id="destination-country">
    <rect x="920" y="923" width="570" height="72" rx="24" fill="#e3f1e8"/>
    <text class="hi" x="1205" y="973" text-anchor="middle" font-family="'Noto Sans Devanagari',Inter,sans-serif" font-size="44" font-weight="790" fill="#17634a">या destination देश का</text>
  </g>
</g>
</svg>

<script type="text/scene">
({
  camera:[[0,{zoom:1}]],
  on:[
    [0.52,"move","#reply-envelope",{by:[0,-20],spring:"soft"}],
    [0.52,"out","#reply-card",{dur:.35,scale:1}],
    [0.52,"out","#reply-wrapper",{dur:.35,scale:1}],
    [0.60,"fade","#printed-address",{dur:.17}],
    [0.60,"type","#address-upper",{cps:20}],
    [1.98,"type","#address-lower",{cps:17}],
    [3.82,"pop","#printed-chip",{from:.86}],
    [5.46,"fade","#posting-country",{dur:.28}],
    [8.04,"fade","#destination-country",{dur:.28}]
  ],
  update(t,section,$) {
    const focus=$('#reply-envelope-scale')[0];
    if (!focus) return;
    const f=Math.min(1,Math.max(0,(t-.52)/.55));
    const e=f*f*(3-2*f);
    const panel=$('#envelope-panel')[0];
    panel.setAttribute('y',360+60*e);
    panel.setAttribute('height',460-60*e);
    focus.setAttribute('transform','translate(960 640) scale('+(1+.5*e)+') translate(-960 -640)');
  }
})
</script>
</section>
