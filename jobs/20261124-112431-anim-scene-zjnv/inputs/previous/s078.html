<script type="text/scene">
({
 on:[[5.92,"fade","#law-qualifier",{dur:.28}]],
 update(t,section,$) {
  const ramp=(start,dur=.25)=>Math.min(1,Math.max(0,(t-start)/dur));
  const k=ramp(1.90,.34);
  for(const id of ["student-group-row-1","students-books","syllabus-qualifier","prescribed-by","boards-chip","universities-chip","gov-bodies-chip","government-footer"]){
   const el=$("#"+id)[0]; if(el){el.style.filter="grayscale("+k+")";el.style.opacity=1-.32*k;}
  }
  const mix=(a,b)=>"rgb("+a.map((v,i)=>Math.round(v+(b[i]-v)*k)).join(",")+")";
  for(const [id,a,b] of [["group-two-card",[251,247,238],[255,255,255]],["group-two-number",[243,234,214],[158,27,27]],["group-two-index",[111,106,99],[255,255,255]]]){
   const el=$("#"+id)[0]; if(el)el.setAttribute("fill",mix(a,b));
  }
  for(const [id,start] of [["social-word",2.94],["cultural-word",3.68],["religious-word",4.40],["literature-word",5.28]]){
   const el=$("#"+id)[0]; if(el)el.style.opacity=ramp(start,.21);
  }
 }
})
</script>
