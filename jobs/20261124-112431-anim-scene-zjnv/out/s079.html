<script type="text/scene">
({
 camera:[[0,{zoom:1}]],
 shots:[[0,"#groups"],[8.63,"#bookdef"]],
 on:[
  [0,"type","#competitive-title",{cps:15}],
  [4.94,"type","#competitive-textbooks",{cps:24}],
  [6.25,"fade","#book-key",{dur:.17}],
  [6.25,"pulse","#book-key",{amount:.05}],
  [8.63,"fade","#bookdef",{dur:.01}],
  [9.77,"fade","#definition-line-3",{dur:.21}],
  [10.07,"fade","#definition-line-4",{dur:.21}]
 ],
 update(t,section,$) {
  const k=Math.max(0,Math.min(1,t/.58)), ease=1-(1-k)*(1-k);
  for(const [id,attr,v,w] of [["group-three-card","y",812,660],["group-three-card","height",148,300],["group-three-number","y",840,707],["group-three-index","y",903,770]]){
   const node=$("#"+id)[0]; if(node)node.setAttribute(attr,v+(w-v)*ease);
  }
  const title=$("#competitive-position")[0], prefix=$("#competitive-title")[0], suffix=$("#competitive-textbooks")[0];
  if(title) title.setAttribute("transform","translate(0 "+(145*(1-ease))+")");
  if(prefix&&suffix&&t>=4.94) suffix.setAttribute("x",330+prefix.getComputedTextLength()+19);

  const mix=(a,b)=>"rgb("+a.map((v,i)=>Math.round(v+(b[i]-v)*k)).join(",")+")";
  for(const [id,a,b] of [["group-three-card",[251,247,238],[255,255,255]],["group-three-number",[243,234,214],[158,27,27]],["group-three-index",[111,106,99],[255,255,255]]]){
   const el=$("#"+id)[0]; if(el)el.setAttribute("fill",mix(a,b));
  }
 }
})
