 <script type="text/scene">
 ({
  camera:[[0,{zoom:1}]],
  on:[
   [4.00,"draw","#speed-registration-under",{dur:.20}],
   [4.40,"pop","#speed-scope",{spring:"soft",from:.91}]
  ],
  update(t,section,$){
   $("#speed-scope-gate")[0]?.setAttribute("visibility",t<4.40?"hidden":"visible");
   const clamp=n=>Math.max(0,Math.min(1,n));
   const a=clamp((t-4.18)/.22);
   const settle=(sel, from, to) => {
    const group=$(sel)[0]; if(!group)return;
    const y=from.map((v,i)=>v+(to[i]-v)*a);
    const rect=group.querySelector("rect");rect.setAttribute("y",y[0]);rect.setAttribute("height",y[1]);
    group.querySelectorAll("text").forEach((e,i)=>e.setAttribute("y",y[i+2]));
   };
   settle("#reg-line",[341,136,388,449],[394,116,432,490]);
   settle("#speed-line",[492,157,538,584,634],[520,144,559,605,653]);
   settle("#delivery-line",[660,119,709,756],[674,109,720,765]);
   $("#speed-registration-under")[0]?.setAttribute("transform","translate(0 "+(21*a)+")");
   const k=clamp((t-7.80)/.26);
   const mix=(a,b)=>"rgb("+a.map((v,i)=>Math.round(v+(b[i]-v)*k)).join(",")+")";
   for(const [id,attr,a,b] of [
    ["#firm-frame","fill",[247,244,236],[255,255,255]],
    ["#firm-frame","stroke",[199,195,185],[225,204,165]],
    ["#firm-header","fill",[233,230,223],[158,27,27]],
    ["#firm-header-copy","fill",[111,106,99],[255,255,255]]
   ]){const el=$(id)[0]; if(el)el.setAttribute(attr,mix(a,b));}
  }
 })
 </script>
