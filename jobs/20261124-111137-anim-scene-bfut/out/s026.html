</g>
<path id="letter-cross" d="M1116 452l62 62m0-62-62 62" fill="none" stroke="#5b6472" stroke-width="12" stroke-linecap="round"/>

 <rect x="120" y="940" width="1680" height="90" rx="22" fill="#f5e4b8"/>
 <text class="hi" x="960" y="1000" text-anchor="middle" font-family="'Noto Sans Devanagari',Inter,sans-serif" font-size="48" font-weight="800" fill="#4c3821">देश के अंदर वाली शर्तें भी पूरी होनी हैं</text>
</g>
</svg>
<script type="text/scene">
({
 camera:[[0,{zoom:1}]],
 on:[
  [2.16,"pop","#private-letter"],
  [2.66,"draw","#letter-cross",{dur:.27}],
  [3.88,"fade","#unrelated",{dur:.26}],
  [3.88,"draw","#unrelated-cross",{dur:.26}],
  [7.76,"fade","#inland",{dur:.34}]
 ],
 update(t,section,$) {
  const f=Math.max(0,Math.min(1,(t-2)/.3));
  const alpha=1-.6*f;
  for(const id of ["reply-card","reply-envelope","reply-wrapper","posting-country","destination-country"]) {
   const node=$("#"+id)[0];
   if(node) node.setAttribute("opacity",alpha);
  }
 }
})
</script>
