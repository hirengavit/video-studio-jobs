<script type="text/scene">
({
 update(t,section,$){
   const u=Math.min(1,Math.max(0,(t-1.36)/.46));

   for(const id of ['branch-one-arrow','branch-two-arrow','branch-one-action','branch-two-action']) {
     const el=$('#'+id)[0]; if(el) el.setAttribute('transform','translate(0 '+d+')');
   }
   for(const id of ['branch-one-condition-bg','branch-two-condition-bg','condition-slot-3']) {
     const el=$('#'+id)[0]; if(el) el.setAttribute('height',120+d);
   }
   const bg=$('#decision-bg')[0]; if(bg) bg.setAttribute('height',810+d);
 },
 on:[
   [1.70,'out','#condition-slot-3',{dur:.20,scale:false}],
   [.24,'draw','#branch-three-line',{dur:.43}],
   [1.86,'pop','#branch-three-condition',{from:.97,spring:'soft'}],
   [3.34,'fade','#strong-suspicion',{dur:.24}],
   [8.10,'fade','#potential-harm',{dur:.24}]
 ]
})
