<script type="text/scene">
{
 camera:[[0,{zoom:1}]],
 on:[
  [0,'fade','#mobile-office',{dur:.18}],
  [.30,'grow','#mobile-shutter',{axis:'y',origin:'top',spring:'fast'}],
  [1.68,'fade','#night-office',{dur:.24}],
  [4.02,'fade','#night-exempt',{dur:.24}],
  [5.30,'fade','#clearance-strip',{dur:.25}],
  [5.30,'words','#no-clearance',{gap:.12,dist:7}]
 ],
 update(t,section,$) {
  const q=S.clamp((t-.22)/1.34,0,1);
  const p=q*q*(3-2*q);
  const slide=(id,x,y,s)=>$(id).forEach(n=>n.setAttribute('transform',`translate(${x*p} ${y*p}) scale(${1+(s-1)*p})`));
  slide('#sunday-calendar',101.5398,202.5929,.76/1.13);
  slide('#holiday-calendar',163.8407,202.5929,.76/1.13);
  slide('#regular-office',213.3077,210.8462,.86/1.30);
  $('#mobile-office').forEach(n=>n.setAttribute('transform',`translate(${139*(1-p)} ${42*(1-p)})`));
  $('#closed-floor').forEach(n=>n.setAttribute('d',`M${86+54*p} ${747-42*p}h${1694-54*p}`));
 }
}
</script>
