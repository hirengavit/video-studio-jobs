<script type="text/scene">
{
  shots: [[0, '#sched'], [6.81, '#matrix']],
  on: [
    [1.49, 'highlight', '#date2', {color: '#f2b705', opacity: 0.34, dur: 0.32, pad: 7}],
    [3.76, 'highlight', '#date3', {color: '#f2b705', opacity: 0.34, dur: 0.32, pad: 7}],
    [3.96, 'highlight', '#date4', {color: '#f2b705', opacity: 0.34, dur: 0.32, pad: 7}],
    [4.16, 'highlight', '#date6', {color: '#f2b705', opacity: 0.34, dur: 0.32, pad: 7}],
    [9.41, 'fade', '#matrix-weight-fill', {dur: 0.30}],
    [9.41, 'fade', '#weight-corner', {dur: 0.28}],
  ],
  update(t, section, $) {
    if (t >= 6.81) return;
    const date = $('#date1')[0].getBBox(), rect = $('#date1-held')[0];
    rect.setAttribute('x', date.x - 7); rect.setAttribute('y', date.y - 3.5);
    rect.setAttribute('width', date.width + 14); rect.setAttribute('height', date.height + 7);
    const product = $('#product2')[0];
    for (const [phrase, id] of [['retail', '#retail-held'], ['contractual', '#contractual-held']]) {
      const at = product.textContent.indexOf(phrase);
      let l = Infinity, r = -Infinity, top = Infinity, bottom = -Infinity;
      for (let k = at; k < at + phrase.length; k++) {
        const b = product.getExtentOfChar(k);
        l = Math.min(l, b.x); r = Math.max(r, b.x + b.width); top = Math.min(top, b.y); bottom = Math.max(bottom, b.y + b.height);
      }
      const y = bottom + 6, wob = (bottom - top) * 0.05;
      $(id)[0].setAttribute('d', 'M' + l + ' ' + y + ' Q' + ((l + r) / 2) + ' ' + (y + wob) + ' ' + r + ' ' + (y - wob * 0.4));
    }
  }
}
</script>
