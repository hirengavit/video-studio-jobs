 ],
 update(t,section,$) {
  if (t >= 3.19) return;
  const label=$('#error-book-label')[0], marker=$('#error-book-marker')[0];

  const b=label.getBBox();

  marker.setAttribute('x', b.x-8);
  marker.setAttribute('y', b.y-4);
  marker.setAttribute('width', b.width+16);
  marker.setAttribute('height', b.height+8);
 }
