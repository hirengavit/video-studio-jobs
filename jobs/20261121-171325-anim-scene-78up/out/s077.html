<script type="text/scene">
({
 dur:9.10,
 camera:[[0,{zoom:1}]],
 on:[
  [0,"out","#unfolded-card",{dur:.35}],
  [.30,"pop","#folded-art",{from:.96,spring:"fast"}],
  [.50,"draw","#folded-brackets",{dur:.60}],
  [.54,"fade","#folded-heading",{dur:.27}],
  [1.36,"fade","#fold-min",{dur:.26}],
  [1.80,"type","#fold-min-value",{cps:4.6}],
  [5.30,"fade","#fold-max",{dur:.26}],
  [5.90,"type","#fold-max-value",{cps:4.60}]
 ],
 update(t,section,$) {
  const p=Math.max(0,Math.min(t/.52,1));
  const k=p*p*(3-2*p);
  const rect=(id,key,a,b)=>{ for(const el of $(id)) el.setAttribute(key,String(a+(b-a)*k)); };
  for(const el of $("#unfolded-card")) el.style.filter="grayscale("+Math.min(1,t/.18)+")";
  for(const el of $("#open-limits")) {
    el.style.filter="grayscale("+k+")";
    el.style.opacity=String(1-k*.24);
  }
  for(const [id,dy] of [["#open-limits-heading",-30],["#open-minimum",-70],["#open-maximum",-124]]) {
    for(const el of $(id)) el.setAttribute("transform","translate(0 "+(dy*k)+")");
  }
  rect("#open-limits-heading rect","height",90,58);
  rect("#open-limits-heading text","y",322,307);
  rect("#open-limits-heading text","font-size",52,44);
  for(const [id,rowY,valueY,labelY] of [["#open-minimum",396,463,431],["#open-maximum",571,638,606]]) {
    rect(id+" > rect:first-of-type","height",150,105);
    rect(id+" > text:first-of-type","y",labelY,labelY-13);
    rect(id+" > text:nth-of-type(2)","y",labelY+50,labelY+30);
    rect(id+" > rect:nth-of-type(2)","y",rowY,rowY-10);
    rect(id+" > rect:nth-of-type(2)","height",98,67);
    rect(id+" > text:last-of-type","font-size",60,40);
    rect(id+" > text:last-of-type","y",valueY,valueY-24);
  }
 }
})
</script>
