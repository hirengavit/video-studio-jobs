<script type="text/scene">
{
  on: [
    [0,'out','#roll-focus',{dur:.34}],
    [0,'draw','#nonroll-focus',{dur:.34}],
    [4.40,'fade','#one-highlight',{dur:.18}],

    [7.96,'fade','#nonroll-sum-label',{dur:.36}],
    [11.98,'type','#nonroll-sum-max',{cps:24}]
  ],
  update(t, section, $) {
    const p=Math.max(0,Math.min(1,t/.34));
    const mix=(a,b)=>'rgb('+a.map((x,i)=>Math.round(x+(b[i]-x)*p)).join(',')+')';
    for (const id of ['#roll-min','#roll-max','#roll-formula','#roll-sum-value']) {
      for (const node of $(id)) node.setAttribute('fill',mix([43,38,34],[111,106,99]));
    }
    for (const node of $('#roll-head')) node.setAttribute('fill',mix([255,255,255],[237,209,193]));
  }
}
</script>
