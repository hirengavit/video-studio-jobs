<script type="text/scene">
  {
    update(t, section, $) {
      const p = $('#slide-warning')[0], u = $('#slide-underline')[0];
      const phrase = 'न छिपाए', start = p.textContent.indexOf(phrase);
      let x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity;
      for(let i=start; i<start+phrase.length; i++) {
        const b = p.getExtentOfChar(i);
        x0=Math.min(x0,b.x); y0=Math.min(y0,b.y); x1=Math.max(x1,b.x+b.width); y1=Math.max(y1,b.y+b.height);
      }
      const y=y1+4, h=y1-y0;
      u.setAttribute('d','M'+x0+' '+y+' Q'+((x0+x1)/2)+' '+(y+.05*h)+' '+x1+' '+(y-.02*h));
      u.setAttribute('stroke-width',String(Math.max(4,h*.08)));
      const phase=Math.min(1,Math.max(0,(t-5.46)/.54));
      $('#paper-edges')[0].setAttribute('opacity',String(Math.sin(Math.PI*phase)*.9));
      for (const id of ['logo-zone','postage-zone','barcode-zone','address-block']) {
        for (const part of $("[id$='-" + id + "']")) {
          if (part.closest('[id$="-diagram"]')) part.style.opacity = '0';
        }
      }
      for (const part of $("[id$='-window']")) {
        if (part.closest('[id$="-diagram"]')) part.setAttribute('stroke','#9e1b1b');
      }
    },
    on:[
      [.10,'out','#slide-chip',{dur:.26,scale:false}],
      [0,'draw','#dim-l',{dur:.38}],
      [0,'fade','#lbl-l',{dur:.22}],
      [.66,'type','#val-l-start',{cps:24}],
      [1.16,'fade','#val-l-separator',{dur:.12}],
      [1.62,'type','#val-l-end',{cps:24}],
      [2.16,'type','#val-l-unit',{cps:24}],
      [7.12,'draw','#dim-left',{dur:.39}],
      [8.96,'pop','#val-left',{from:.94,spring:'soft'}]
    ]
  }
</script>
