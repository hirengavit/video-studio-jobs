<script type="text/scene">
({
  camera:[[0,{zoom:1}]],
  on:[
    [.28,'draw','#focus-4',{dur:.25}],
    [2.98,'highlight','#point-4-line-1',{words:'administrative instructions',color:'#fde9a6',opacity:1,dur:.34,pad:4}],
    [3.48,'fade','#keyword-4',{dur:.25}],
    [6.78,'color','#point-1-line-1, #point-2-line-1, #point-2-line-2, #point-4-line-1',{to:'#6f6a63',dur:.30}],
    [6.78,'pulse','#circle-head-panel',{amount:.018}],
    [7.26,'out','#panel-heading-opening',{dur:.22,scale:1}],
    [7.49,'fade','#panel-heading-compact',{dur:.21}],
    [7.52,'pop','#rule-inset',{from:.98,spring:[22,1]}],
    [7.61,'reveal','#rule-quote',{from:'left',dur:.32}],
    [7.83,'fade','#definition-source',{dur:.24}],
    [8.60,'highlight','#definition-line-2',{words:'Chief Postmaster General',color:'#fde9a6',opacity:1,dur:2.08,pad:3}]
  ],
update(t, section, $) {
  for (const [id, phrase, pad] of [["point-1-line-1","administrative instructions",4],["point-2-line-1","agreement",4],["point-3-line-1","Circle Head",4]]) {
    const text = $("#"+id)[0], mark = $("#carry-"+id)[0];
    const start = text.textContent.indexOf(phrase);
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (let i = start; i < start + phrase.length; i++) {
      const box = text.getExtentOfChar(i);
      x0 = Math.min(x0, box.x); y0 = Math.min(y0, box.y);
      x1 = Math.max(x1, box.x + box.width); y1 = Math.max(y1, box.y + box.height);
    }
    if (Number.isFinite(x0) && x1 > x0) {
      mark.setAttribute("x", x0-pad); mark.setAttribute("y", y0-pad/2);
      mark.setAttribute("width", (x1-x0+2*pad).toFixed(2)); mark.setAttribute("height", y1-y0+pad);
    }
  }
}
})
</script>
