<script type="text/scene">
{
 shots:[[0,'#fees'],[7.60,'#facilities']],
 update(t, section, $) {
  const label = $('#delivery-note')[0], mark = $('#delivery-note-mark')[0];
  if (!label || !mark || t >= 7.60) return;
  const phrase = 'delivery के समय';
  let x = Infinity, y = Infinity, right = -Infinity, bottom = -Infinity;
  for (let i = 0; i < phrase.length; i++) {
    const b = label.getExtentOfChar(i);
    x = Math.min(x,b.x); y = Math.min(y,b.y);
    right = Math.max(right,b.x+b.width); bottom = Math.max(bottom,b.y+b.height);
  }
  mark.setAttribute('x',x-6); mark.setAttribute('y',y-3);
  mark.setAttribute('width',right-x+12); mark.setAttribute('height',bottom-y+6);
 },
 on:[
  [0.36,'pop','#pod-fee',{spring:'soft',from:0.88}],
  [3.72,'pop','#insured-free',{spring:'soft',from:0.9}],
  [4.46,'fade','#attempts',{dur:0.26}],

 ]
