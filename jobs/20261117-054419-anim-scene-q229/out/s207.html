</svg><script type="text/scene">
{
 update(t,section,$){
    const ramp=(start,dur=.23)=>Math.max(0,Math.min(1,(t-start)/dur));
    const blend=(a,b,p)=>'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*p)).join(',')+')';
    const rgb=(hex)=>[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));
    const ink=rgb('#2b2622'), amber=rgb('#8a5d00');
    for(const [rows,start] of [['#row1,#row2,#row3',10.40],['#row7',2.34],['#row8',6.48]]) {
      for(const el of $(rows)) el.setAttribute('opacity',.6+.4*ramp(start));
    }
    // Give the two independently pulsing values room once their row lights up,
    // without shifting the inherited composition on the opening cut.
    for(const el of $('#rule8-inherited'))el.setAttribute('opacity',t<6.48?1:0);
    for(const el of $('#rule8-live'))el.setAttribute('opacity',t<6.48?0:1);
    if(t>=2.60){
      for(const el of $('#no-match,#legend-text'))el.style.fill=blend(amber,ink,ramp(2.60,.3));
    }
    {
      for(const el of $('.map-row text[font-size="44"]')){
        if(el.id.endsWith('-no-match')||el.id==='no-match')continue;
        const animated=['rule96-7','rule22-8','rule96-8'].some(id=>el.id===id||el.id.endsWith('-'+id));
        if(t<10.40 && animated) continue;
        el.style.fill=blend(animated?amber:rgb(el.getAttribute('fill')||'#9e1b1b'),ink,ramp(10.40,.36));
      }
    }
 },
 on:[
    [.50,'pulse','#no-match-pulse',{amount:.45}],
    [.50,'color','#no-match',{to:'#8a5d00',dur:.30}],
    [.50,'color','#legend-text',{to:'#8a5d00',dur:.30}],
    [2.34,'color','#band-4',{to:'#fbf7ee',dur:.23}],
    [2.34,'color','#band-5',{to:'#ffffff',dur:.23}],
    [2.34,'color','#band-6',{to:'#fbf7ee',dur:.23}],
    [2.34,'color','#band-7',{to:'#fde9a6',dur:.23}],
    [4.82,'pulse','#rule96-7-pulse',{amount:.45}],
    [4.82,'color','#rule96-7',{to:'#8a5d00',dur:.25}],
    [6.48,'color','#band-8',{to:'#fde9a6',dur:.23}],
    [8.86,'pulse','#rule22-8-pulse',{amount:.45}],
    [8.86,'color','#rule22-8',{to:'#8a5d00',dur:.25}],
    [9.94,'pulse','#rule96-8-pulse',{amount:.45}],
    [9.94,'color','#rule96-8',{to:'#8a5d00',dur:.25}]
 ]
}
</script></section>
