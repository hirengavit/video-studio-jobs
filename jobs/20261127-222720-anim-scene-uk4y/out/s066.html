<script type="text/scene">
({
 "camera":[[0,{"zoom":1}]],
 "shots":[[0,"#mbu"],[7.65,"#celc"]],
 "on":[
  [0,"pop","#c-photo",{"from":0.95,"spring":"soft"}],
  [0.36,"pop","#c-fp",{"from":0.95,"spring":"soft"}],
  [1.53,"pop","#c-iris",{"from":0.95,"spring":"soft"}],
  [2.97,"color",".mbu-chip-paper",{"to":"#fde9a6","dur":0.32}],
  [4.30,"pop","#same-card",{"from":0.95,"spring":"soft"}],
  [4.50,"fade","#same-line",{"dur":0.15}],
  [6.40,"highlight","#same-line-hi",{"words":"वही","color":"#f2b705","opacity":0.38,"dur":0.32,"pad":6}],
  [7.65,"pop","#celc-big",{"from":0.92,"spring":"soft"}]
 ],
 update(t, section, $) {
  const el = $("#mbu-en")[0], mark = $("#mbu-mark")[0];
  const i = el.textContent.indexOf("MBU");
  if (i < 0) return;
  let x = Infinity, y = Infinity, right = -Infinity, bottom = -Infinity;
  for (let k = i; k < i + 3; k++) {
   const p = el.getExtentOfChar(k);
   x = Math.min(x, p.x); y = Math.min(y, p.y);
   right = Math.max(right, p.x + p.width); bottom = Math.max(bottom, p.y + p.height);
  }
  mark.setAttribute("x", x - 5); mark.setAttribute("y", y - 2.5);
  mark.setAttribute("width", (right - x + 10).toFixed(2)); mark.setAttribute("height", bottom - y + 5);
 }
})
</script>
