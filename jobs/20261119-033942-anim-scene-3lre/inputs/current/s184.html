<script type="text/scene">
{on:[
[0,'color','#part-bg-1',{to:'#fde9a6',dur:0.38}],
[0,'color','#part-label-1, #inland',{to:'#2b2622',dur:0.38}],
[0,'color','#part-bg-2, #part-bg-3, #part-bg-4',{to:'#e3ded7',dur:0.4}],
[0,'color','#part-label-2, #part-label-3, #part-label-4, #detail-2, #detail-3, #detail-4',{to:'#6f6a63',dur:0.4}],
[1.14,'pop','#sections-count',{from:0.94}],
[1.14,'pop','.guide-tab',{from:0.86,stagger:0.08}],
[3.08,'words','#control-en',{dist:14}],
[3.6,'fade','#control-hi',{dur:0.25}],
[5.92,'pulse','#guide-tab-1',{amount:0.065}],
[5.92,'underline','#control-en',{color:'#9e1b1b',width:4,gap:4,dur:0.4}],
[8.16,'fade','#guide-ref',{dur:0.36}]
],
update(t, section, $) {
 const p = S.clamp(t / 0.86, 0, 1);
 const k = p * p * (3 - 2 * p);
 for (let i = 0; i < 3; i++) {
  const from = 511 + 151 * i, to = 835 + 49 * i;
  const g = $('#part-' + (i + 2))[0];
  if (g) g.setAttribute('transform','translate(0 ' + (from + (to - from) * k) + ') scale(1 ' + (1 - k * 0.86) + ') translate(0 ' + (-from) + ')');
  for (const sel of ['#part-label-', '#detail-']) {
   const line = $(sel + (i + 2))[0];
   if (line) line.setAttribute('opacity',Math.max(0,1 - 2.4 * k));
  }
 }
}}
</script></section>
