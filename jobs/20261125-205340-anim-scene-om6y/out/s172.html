 <script type="text/scene">
 ({
  camera:[[0,{zoom:1}]],
  on:[
   [0,"highlight","#missing-first",{words:"booking के 15 दिन बाद",color:"#f2b705",opacity:.34,pad:7,dur:.001}],
   [.48,"fade","#missing-second-focus",{dur:.21}],
   [2.20,"out","#missing-second-focus",{dur:.20,scale:false}],
   [2.20,"out","#missing-focus",{dur:.20,scale:false}],
   [2.20,"fade","#damage-focus",{dur:.23}]
  ],
  update(t,section,$){
   const mark=$("#deadline-row-1 [data-vs-mark]")[0], line=$("#missing-first")[0];
   if(!mark || !line)return;
   if(t<=.001){
    let left=Infinity,right=-Infinity;
    for(let i=0;i<"booking के 15 दिन बाद".length;i++){
     const b=line.getExtentOfChar(i);
     left=Math.min(left,b.x);right=Math.max(right,b.x+b.width);
    }
    if(Number.isFinite(left)) mark.setAttribute("width",(right-left+14).toFixed(2));
   }
   mark.style.opacity=String(1-Math.min(1,Math.max(0,(t-.20)/.18)));
  }
 })
 </script>
