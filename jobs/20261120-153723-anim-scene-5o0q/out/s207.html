<script type="text/scene">
{
  camera: [[0,{zoom:1}]],
  shots: [[0,'#p3'],[5.36,'#p4']],
  update(t, section, get) {
    get('#badge-dot-3')[0].setAttribute('fill',t < 5.36 ? '#9e1b1b' : '#2e7d4f');
    get('#badge-dot-4')[0].setAttribute('fill',t < 5.36 ? '#6f6a63' : '#9e1b1b');
    get('#recap-shell')[0].setAttribute('height', t < 5.36 ? '700' : '670');
    if (t < 5.36) {
      const cap = v => Math.max(0, Math.min(1, v));
      for (const [id, cue, d] of [['#good-packing',.68,.24], ['#barred-item',2.20,.24], ['#not-sendable',3.22,.27]]) {
        get(id)[0].setAttribute('opacity', cap((t - cue) / d));
      }
      const b = get('#not-sendable')[0].getBBox();
      get('#ban-cross-placement')[0].setAttribute('transform','translate(' + (b.x + b.width + 24) + ' 0)');
    }
  },
  on: [
   [0.68,'color','[data-p3-copy]',{to:'#6f6a63',dur:.31}],
   [0.68,'fade','#prohibited-packing',{dur:.29}],
   [4.08,'draw','#ban-cross',{dur:.32}],
   [5.36,'fade','#badge-three-done',{dur:.18}],
   [6.52,'fade','#p4-row1',{dur:.24}],
   [7.02,'fade','#seal-hi',{dur:.24}],
   [7.66,'fade','#tamper-pill',{dur:.27}],
   [8.94,'draw','#p4-tick-1',{dur:.25}]
  ]
}
</script>
