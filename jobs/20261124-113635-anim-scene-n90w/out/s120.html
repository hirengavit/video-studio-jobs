    note.setAttribute("transform","translate(1741.5 641) scale("+(1+.06*pulse)+") translate(-1741.5 -641)");
   }
   $("#tariff-frame")[0]?.setAttribute("height",690-10*progress(6.01,.30));
   $("#slab-band-7")[0]?.setAttribute("opacity",1-progress(0,.30));
   $("#slab-band-1")[0]?.setAttribute("opacity",progress(4.32,.28));
  }
 })
