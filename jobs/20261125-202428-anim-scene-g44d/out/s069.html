 <script type="text/scene">
 ({

  [7.00,"draw","#signature",{dur:1,ease:"linear"}]
 ],
 update(t,section,$){
   if(t<5.90) return;
   const line=$("#signature")[0], pen=$("#signing-pen")[0];
   if(!line || !pen || !line.getTotalLength) return;
   const p=line.getPointAtLength(line.getTotalLength()*Math.max(0,Math.min(1,t-7)));
   pen.setAttribute("transform","translate("+p.x+" "+p.y+")");
 }
 })
