<script type="text/scene">
({
  dur:11.12,
  on:[
    [.04,"out","#right-half-keyword",{dur:.28,scale:1}],
    [.04,"out","#old-adhesive, #old-franking, #disc-stamp, #disc-franking",{dur:.40,scale:1}],
    [.04,"out","#three-badge",{dur:.40,scale:1}],
    [2.74,"pulse","#print-meter-band",{amount:.055}],
    [2.74,"fade","#corner-cue",{dur:.25}],
    [5.52,"fade","#guide-cue",{dur:.30}]
  ],
  update(t, section, $) {
    const smooth=q=>{q=Math.max(0,Math.min(q,1)); return q*q*(3-2*q)};
    const k=smooth(t)* (1-smooth((t-10.52)/.58));
    const cam=$("#card-camera")[0];
    if(cam) cam.setAttribute("transform","translate("+(-389*k)+" "+(-89*k)+") scale("+(1+.35*k)+")");
    const dim=smooth((t-.04)/.5);
    for(const id of ["right-half-legend","address-emphasis","disc-address","disc-directions","directions-emphasis"]) for(const el of $("#"+id)) el.setAttribute("opacity",1-.77*dim);
    const label=$("#post-card-title")[0];
    const p=smooth((t-4.72)/.65);
    if(label) {label.setAttribute("y",309+292*p); label.setAttribute("opacity",1-.37*p);}
    const d=$("#dots-clip-rect")[0];
    if(d)d.setAttribute("width",249*smooth((t-5.52)/.58));
  }
})
</script>
