<script type="text/scene">
{
 shots:[[0,'#mail-time'],[1.78,'#hours'],[6.55,'#mark']],
 update(t, section, $) {
  if (t >= 1.78) return;
  const text = $('#handover-label')[0], line = $('#held-handover-underline')[0];
  if (!text || !line) return;
  const b = text.getBBox();
  if (!b.width) return;
  const y = b.y + b.height + 6, wob = b.height * 0.05;
  line.setAttribute('d', 'M'+b.x+' '+y+' Q'+(b.x+b.width*0.5)+' '+(y+wob)+' '+(b.x+b.width)+' '+(y-wob*0.4));
 },
 on:[
  [2.28,'fade','#hours-hi',{dur:.24}],
  [3.90,'fade','#dispatch-card',{dur:.24}],
  [4.40,'fade','#dispatch-arrangement',{dur:.24}],
  [5.00,'fade','#follow-rules',{dur:.26}],
  [6.55,'fade','#mark-heading',{dur:.22}],
  [8.01,'fade','#mark-address-side',{dur:.25}],
  [9.29,'reveal','#mark-band',{from:'left',dur:.43}]
 ]
}
