 <script type="text/scene">
 {
  on:[
    [0.34,'fade','#circleHi',{dur:0.25}],
    [1.36,'fade','#territoryCard',{dur:0.22}],
    [1.36,'pop','#gujaratRow',{from:0.97,spring:'fast'}],
    [1.62,'fade','#gujaratHi',{dur:0.24}],
    [2.34,'fade','#territoryRow',{dur:0.24}],
    [5.82,'fade','#territoryHi',{dur:0.26}],
    [7.02,'slide','#hq',{from:'down',dist:42,spring:'fast'}],
    [7.04,'draw','#pin',{dur:0.33}],
    [8.20,'stamp','#ahmedabad',{from:1.03,rot:-2,spring:'fast'}],
    [9.34,'fade','#ahmedabadHi',{dur:0.21}]
  ],
  update(t, section, $) {
    const reveal = (textId, clipId, beats, lengths) => {
      const line = $(textId)[0], clip = $(clipId)[0];
      const i = beats.filter(beat => t >= beat).length - 1;
      if (!line || !clip) return;
      let width = 0;
      if (i >= 0) {
        const previous = i === 0 ? 0 : line.getSubStringLength(0, lengths[i - 1]) + 3;
        const target = line.getSubStringLength(0, lengths[i]) + 3;
        const p = Math.max(0, Math.min(1, (t - beats[i]) / 0.12));
        width = previous + (target - previous) * (1 - (1 - p) ** 3);
      }
      clip.setAttribute('width', width);
    };
    reveal('#territory-line1', '#line1-clip-width', [3.48, 4.62, 4.92, 5.30], [5, 9, 15, 22]);
    reveal('#territory-line2', '#line2-clip-width', [5.82, 6.24, 6.76, 6.92], [3, 9, 13, 17]);
  }
 }
 </script>
