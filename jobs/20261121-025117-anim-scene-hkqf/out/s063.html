<script type="text/scene">
{
 camera:[[0,{zoom:1}]],
 on:[
  [.62,'words','#step-return',{gap:.36,dist:7}],
  [3.66,'fade','#step-office',{dur:.25}],
  [5.80,'fade','#return-tray',{dur:.25}],
  [5.80,'pop','#tray-key'],
  [7.04,'pop','#tray-plate'],
  [7.85,'pop','#tray-bag'],
  [8.85,'fade','#step-return-tick',{dur:.24}],
  [8.85,'draw','#step-return-check',{dur:.28}]
 ],
 update(t, section, $) {
  const q=S.clamp((t-5.25)/.53,0,1);
  const p=q*q*(3-2*q);
  $('#step-5').forEach(n=>n.setAttribute('transform',`translate(0 ${-20*p})`));
  $('#step-6').forEach(n=>n.setAttribute('transform',`translate(0 ${-40*p})`));
  $('#step2-links').forEach(n=>n.setAttribute('d',`M224 501V${578-20*p}M224 ${701-20*p}V${778-40*p}`));
  $('#shackle-open').forEach(n=>n.style.opacity='0');
  $('#shackle-closed').forEach(n=>n.style.opacity='1');
 }
}
</script>
