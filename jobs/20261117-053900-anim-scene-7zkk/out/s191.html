<script type="text/scene">
{
update(t,section,$) {
  const smooth = x => { const u=Math.min(1,Math.max(0,x)); return u*u*(3-2*u); };
  const p=smooth((t-.06)/.44);
  $('#parcel-track')[0]?.setAttribute('transform','translate('+(-60-240*p)+' 0)');
  const bottom=760+41*smooth((t-3.28)/.26)+99*smooth((t-6.02)/.30);
  const low=bottom-25;
  $('#declaration-bg')[0]?.setAttribute('d',`M1025 260H1755Q1780 260 1780 285V${low}Q1780 ${bottom} 1755 ${bottom}H1025Q1000 ${bottom} 1000 ${low}V285Q1000 260 1025 260Z`);
  const stock=$('#parcel-stock')[0]?.querySelector('g[id$="-tag"],g[id="tag"]');
  stock?.setAttribute('visibility','hidden');
},
on:[
[.12,"out","#window",{dur:.34,scale:1}],
[.05,"pop","#declaration",{from:.95,spring:"fast"}],
[.50,"fade","#declaration-hi",{dur:.24}],
[1.62,"stamp","#required",{from:1.12,rot:-3,spring:"fast"}],
[3.28,"fade","#letter-item",{dur:.23}],
[3.98,"draw","#letter-cross",{dur:.29}],
[6.02,"fade","#goods",{dur:.24}],
[6.42,"draw","#goods-tick",{dur:.30}],
[9.68,"fade","#form-note",{dur:.25}]
]}
</script>
