<script type="text/scene">
{
  shots:[[0,'#examples'],[4.95,'#sum']],
  on:[
    [0,'pop','#example-postage-4',{from:.85,spring:'fast'}],
    [0.90,'pulse','#example-postage-4',{amount:.08}],
    [7.55,'pop','#sum-base-amount',{from:.87,spring:'fast'}]
  ],
  update(t,section,$){
    for(const [target,mark,word,gap] of [
      ['#example-slab','#held-slab-underline','slab',1],
      ['#example-distance-4','#held-distance-underline','2000 km से ऊपर',2]
    ]){
      const el=$(target)[0],line=$(mark)[0];
      if(!el||!line)continue;
      const at=el.textContent.indexOf(word);
      let l=Infinity,top=Infinity,r=-Infinity,b=-Infinity;
      for(let i=at;i<at+word.length;i++){
        const q=el.getExtentOfChar(i);l=Math.min(l,q.x);top=Math.min(top,q.y);
        r=Math.max(r,q.x+q.width);b=Math.max(b,q.y+q.height);
      }
      if(!Number.isFinite(l))continue;
      const y=b+gap,w=(b-top)*.05;
      line.setAttribute('d','M'+l+' '+y+' Q'+((l+r)*.5)+' '+(y+w)+' '+r+' '+(y-w*.4));
    }
  }
}
</script>
