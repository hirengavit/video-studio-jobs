 <script type="text/scene">
 ({
  camera:[[0,{zoom:1}]],
  on:[
   [0,"highlight","#demurrage-line-3",{words:"जहाँ नियम तय करे",color:"#fde9a6",opacity:1,dur:.001,pad:5}],
   [0,"color","#retention-line-1,#retention-line-2,#retention-line-3,#demurrage-line-1,#demurrage-line-2,#demurrage-line-3",{to:"#6f6a63",dur:.4}],
   [1.48,"reveal","#retention-clarifiers",{dur:.28}],
   [1.48,"fade","#retention-note",{dur:.23}],
   [3.82,"underline","#retention-note",{words:"ज़रूरी नहीं",dur:.34,color:"#8a5d00",width:5,gap:5}],
   [5.54,"fade","#demurrage-note",{dur:.23}],
   [8.14,"underline","#demurrage-note",{words:"अनगिनत दिन नहीं",dur:.36,color:"#8a5d00",width:5,gap:5}]
  ],
  update(t,section,$){
   const mark=$("#demurrage-meaning [data-vs-mark]")[0], line=$("#demurrage-line-3")[0];
   if(mark&&line){
    if(t<=.001){mark.setAttribute("width",String(line.getBBox().width+10));}
    const u=Math.max(0,Math.min(1,t/.4));
    mark.style.opacity=1-u;
   }
  }
 })
 </script>
</section>
