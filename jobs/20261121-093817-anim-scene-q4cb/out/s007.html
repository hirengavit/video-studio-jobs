<script type="text/scene">
{
  shots: [[0,'#letter'],[1.84,'#ilc']],
  on:[
    [0,'pop','#prepaid-completion',{spring:'fast'}],
    [1.84,'type','#ilc-name',{cps:24}],
    [2.34,'fade','#ilc-name-hi',{dur:.23}],
    [2.86,'reveal','#ilc-open',{from:'top',dur:.64}],
    [4.76,'pop','#sheet-label',{spring:'fast'}],
    [6.72,'reveal','#ilc-fold-lines',{from:'left',dur:.52}],
    [6.72,'fade','#fold-label',{dur:.27}],
    [8.24,'fade','#gum-bands',{dur:.26}],
    [8.24,'fade','#gum-label',{dur:.26}]
  ],
  update(t,section,$) {
    for(const name of ['letter','ilc','postcard']) {
      const active=name===(t<1.84?'letter':'ilc');
      $('#icon-'+name).forEach(el=>el.setAttribute('opacity',active?'1':'.40'));
      $('#fill-'+name).forEach(el=>el.setAttribute('fill',active?'#f3ead6':'#fff'));
    }
    const q=$('#letter-quote')[0];
    if(t>=1.84||!q)return;
    const full=q.getComputedTextLength(), left=960-full/2;
    for(const [id,start,count] of [['#marker-current',0,7],['#marker-personal',12,23]]){
      const b=$(id)[0];if(!b||!full)continue;
      b.setAttribute('x',left+(start?q.getSubStringLength(0,start):0)-10);
      b.setAttribute('width',q.getSubStringLength(start,count)+20);
    }
  }
}
</script>
