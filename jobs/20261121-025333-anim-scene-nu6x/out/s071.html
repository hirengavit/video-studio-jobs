</svg>
<script type="text/scene">
{
 camera: [[0,{zoom:1}]],
 on: [
  [1.34,'fade','#without-late-fee',{dur:.22}],
  [1.34,'draw','#allowed-tick',{dur:.29}],
  [3.30,'fade','#acceptance-places',{dur:.24}],
  [3.30,'fade','#press-sorting-office',{dur:.24}],
  [6.40,'fade','#rms-office',{dur:.25}],
  [7.90,'fade','#night-post-office',{dur:.25}]
 ],
 update(t,section,$) {
  const row = $('#letters-row')[0];
  const q = Math.min(1,Math.max(0,(t-3)/.32));
  row.setAttribute('opacity', 1-.5*q);
  for (const n of row.querySelectorAll('text')) {
    const goal = [111,106,99];
    const src = n.id === 'paid-before' ? [138,93,0] : n.id === 'fee-plus' ? goal : [43,38,34];
    n.setAttribute('fill','rgb('+src.map((x,i)=>Math.round(x+(goal[i]-x)*q)).join(',')+')');
  }
 }
}
</script>
</section>
