<script type="text/scene">
{
 camera:[[0,{zoom:1}]],
 shots:[[0,'#p6d']],
 on:[
  [0,'fade','#registration',{dur:.24}],
  [1.60,'fade','#insurance',{dur:.23}],
  [3.04,'fade','#cod',{dur:.23}],
  [4.10,'fade','#cert-posting',{dur:.23}],
  [4.60,'fade','#services-hi',{dur:.23}],
  [5.50,'fade','#closing-pill',{dur:.24}],
  [7.86,'pop','#closing-cutoff',{from:.96,spring:'soft'}],
  [8.72,'draw','#p6d-tick-3',{dur:.24}]
 ],
 update(t, section, $) {
   const p = Math.max(0, Math.min(1, (t - 7.86) / .8));
   const q = p * p * (3 - 2 * p);
   $('#hand-m')[0]?.setAttribute('transform', 'rotate(' + (-180*q) + ' 130 130)');
   $('#hand-h')[0]?.setAttribute('transform', 'rotate(' + (150-15*q) + ' 130 130)');
 }
}
</script>
