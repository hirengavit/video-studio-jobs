 <script type="text/scene">
 ({
  camera:[[0,{zoom:1}]],
  on:[
   [2.56,"fade","#delivery-chip",{dur:.20}],
   [4.80,"fade","#collection-chip",{dur:.20}],
   [7.34,"fade","#sender-chip",{dur:.20}],
   [9.00,"color","#delivery-recue",{to:"#f2b705",dur:.25}],
   [12.20,"pop","#delay-complaint",{from:.96,spring:"snap"}]
  ],
  update(t,section,$) {
   const current=t<2.56 ? 0 : t<4.80 ? 2 : t<7.34 ? 3 : 4;
   const u=Math.max(0,Math.min(1,t/.30));
   for(const n of [2,3,4]) for(const g of $('#step-'+n)) {
    const node=g.querySelector("circle");
    if(node) node.setAttribute("fill",n===4 && t<.30? "rgb("+[242,183,5].map(v=>Math.round(v+(255-v)*u)).join(",")+")" : n===current ? "#f2b705" : "#ffffff");
   }
  }
 })
 </script>
