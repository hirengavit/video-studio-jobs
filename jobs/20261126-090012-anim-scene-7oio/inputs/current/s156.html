 <script type="text/scene">
 ({
  camera:[[0,{zoom:1}]],
  shots:[[0,"#table"]],
  on:[
   [.46,"fade","#printed-rate",{dur:.29}],
   [2.32,"reveal","#exact-500-band",{from:"left",dur:.42}],
   [7.40,"draw","#threshold-cross",{dur:.43}]
  ],
  update(t,section,$) {
   const suffix=$("#threshold-verdict")[0];
   const p=Math.max(0,Math.min(1,(t-6.20)/.28));
   suffix.style.opacity=String(p*p*(3-2*p));
   const box=$("#threshold-line")[0].getBBox();
   $("#threshold-cross")[0].setAttribute("transform","translate("+(box.x+box.width+28)+" 0)");
  }
 })
 </script>
