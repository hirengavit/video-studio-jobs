<script type="text/scene">
{
  shots:[[0,'#ex']],
  on:[
    [1.98,'pop','#working-td-answer',{from:0.92,spring:'soft'}],
    [2.86,'fade','#discount-note',{dur:0.28}],
    [2.86,'words','#note-no-extra',{gap:0.47,dist:12,spring:'soft'}],
    [6.82,'words','#note-advance',{gap:0.33,dist:12,spring:'soft'}],
    [8.48,'highlight','#note-advance',{words:'अलग से',color:'#f2b705',opacity:0.43,pad:7,dur:0.35}]
  ],
  update(t,sec,$){
    for(const [id,limit] of [['#working-ntd',384],['#working-td',384],['#td-answer-amount',224]]){
      const f=$(id)[0];
      if(!f)continue;
      f.removeAttribute('textLength');
      if(f.getComputedTextLength()>limit){
        f.setAttribute('textLength',String(limit));
        f.setAttribute('lengthAdjust','spacingAndGlyphs');
      }
    }
  }
}
</script>
