<script type="text/scene">
({
  camera:[[0,{zoom:1}]],
  on:[
    [2.31,"reveal","#matching",{dur:.42}],
    [4.82,"pop","#matching-person",{from:.93}],
    [5.50,"draw","#matching-link",{dur:.43}],
    [5.50,"fade","#matching-word",{dur:.27}],
    [8.47,"fade","#identity-rule",{dur:.25}],
    [11.59,"underline","#identity-not-equal",{words:"≠",color:"#9e1b1b",width:4,gap:0,dur:.36}]
  ],
  update(t,section,$){
    const raw=Math.max(0,Math.min(1,(t-.20)/.58)), s=raw*raw*(3-2*raw);
    const interp=(a,b)=>a+(b-a)*s;
    const list=$("#name-list")[0];
    list.setAttribute("transform","translate("+(-56*s)+" 0)");
    list.querySelector(":scope > rect").setAttribute("width",interp(1520,880));
    list.querySelector(":scope > path").setAttribute("d","M254 473h"+interp(1412,776));
    list.querySelector(":scope > text").setAttribute("x",interp(254,242));
    for(let i=1;i<=4;i++){
      const row=$("#name-row-"+i)[0], rect=row.querySelector("rect"), label=$("#name-text-"+i)[0], strike=$("#name-strike-"+i)[0];
      rect.setAttribute("x",interp(254,228));
      rect.setAttribute("width",interp(1412,823));
      const top=[0,495,590,754,852][i], ht=[0,87,148,87,87][i];
      rect.setAttribute("y",interp(495+(i-1)*115,top));
      rect.setAttribute("height",interp(90,ht));
      const sy=[0,-3,8,27,10][i]*s;
      $("#name-cross-"+i)[0].setAttribute("transform","translate("+(-585*s)+" "+sy+")");
      label.setAttribute("x",interp(300,244));
      label.setAttribute("y",interp(557+(i-1)*115,[0,553,662,811,910][i]));
      label.setAttribute("fill",s===0?"#2b2622":"#56545a");
      strike.setAttribute("transform","translate("+(-56*s)+" "+([0,-4,-5,24,8][i]*s)+")");
      if(s>0 && (i===1||i===3||i===4))
        strike.setAttribute("d","M293 "+[0,548,663,778,893][i]+"h"+([0,558,1207,271,710][i]*interp(1,.923)));
    }
    const l=$("#name-text-2")[0], line=$("#name-strike-2")[0], compact=$("#row2-compact")[0];
    const fadeOut=Math.max(0,1-Math.max(0,raw-.13)/.19);
    const fadeIn=Math.min(1,Math.max(0,(raw-.32)/.20));
    l.style.opacity=String(.82*fadeOut);
    line.style.opacity=String(fadeOut);
    l.style.display=raw>=.32?"none":"";
    line.style.display=raw>=.32?"none":"";
    compact.style.display=raw>=.32?"":"none";
    compact.style.opacity=String(fadeIn);
  }
})
</script>
