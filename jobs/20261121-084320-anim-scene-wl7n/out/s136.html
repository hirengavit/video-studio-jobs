<script type="text/scene">
{
  on: [
    [2.76,'fade','#label-letter',{dur:.22}],
    [3.66,'fade','#label-postcard',{dur:.22}],
    [5.60,'fade','#label-ilc',{dur:.22}],
    [7.58,'slide','#second-class',{from:'right',dist:118,spring:'fast'}],
    [8.80,'type','#second-class-en',{cps:24}],
    [9.35,'fade','#second-class-hi',{dur:.28}],
  ],
  update(t, section, $) {
    for (const [name,start] of [['letter',2.76],['postcard',3.66],['ilc',5.60]]) {
      const q = Math.max(0,Math.min(1,(t-start)/.24));
      $('#icon-'+name).forEach(el => el.setAttribute('opacity', .40 + .60*q));
      $('#fill-'+name).forEach(el => el.setAttribute('fill', t>=start?'#f3ead6':'#fff'));
    }
  },
}
</script>
</section>
