<script type="text/scene">
({
 on:[
  [.42,"pop","#permission",{from:.90,spring:"fast"}],
  [1.81,"fade","#caution-band",{dur:.18}],
  [1.84,"fade","#legacy-book",{dur:.25}],
  [2.30,"type","#historical-method",{cps:25}],
  [5.04,"fade","#not-equivalent",{dur:.16}],
  [5.04,"type","#dangerous-permission",{cps:41}],
  [7.52,"draw","#not-equivalent-mark",{dur:.34}]
 ],
 update(t,section,$){
  // Keep the outgoing scene's full slate chip at the cut; make room before the new chip lands.
  const u=Math.max(0,Math.min(1,(t-.06)/.35));
  const p=u*u*(3-2*u);
  const chip=$('#bans-chip')[0], label=$('#bans-label')[0], cross=$('#bans-cross')[0];
  chip.setAttribute('y',608+4*p);
  chip.setAttribute('height',167-83*p);
  chip.setAttribute('rx',29-6*p);
  label.setAttribute('y',719-46*p);
  label.setAttribute('font-size',86-32*p);
  cross.setAttribute('transform','translate(1050 '+(693-39*p)+') scale('+(1-.36*p)+') translate(-1050 -693)');
  $('#regulations')[0].setAttribute('transform','translate(0 '+(-64*p)+')');
  if(t>=7.52){
    const b=$('#dangerous-permission')[0].getBBox();
    if(b.width>0) $('#not-equivalent-mark')[0].setAttribute('d','M804 906H'+(b.x+b.width));
  }
 }
})
</script>
