   </g>

 </svg>
 <script type="text/scene">
 ({
   dur:9.44,
   update(t, section, $) {
     const p=Math.max(0,Math.min(1,(t-1.35)/.72)), e=p*p*(3-2*p);
     for(const a of $('#news-class')) a.setAttribute('transform','translate(0 '+(70*e)+')');
     for(const a of $('#sorting-treatment')) a.setAttribute('transform','translate(0 '+(64*e)+')');
     for(const a of $('#wrong-class-bg')) {
       a.setAttribute('fill', t>=8 ? '#eae8e6' : '#fff');
       a.setAttribute('stroke', t>=8 ? '#4b4f58' : '#2b2622');
     }
   },
   on:[
     [0,'reveal','#registered-highlight',{from:'left',dur:.42}],
     [1.25,'out','#airlift-plane, #no-free-airlift, #news-air-surcharge',{dur:.30}],
     [2.50,'fade','#registration-note',{dur:.34}],
     [5.48,'fade','#not-first-class',{dur:.29}],
     [8.00,'strike','#wrong-class',{color:'#4b4f58',width:6,dur:.30,dim:.72}],
     [8.00,'fade','#not-related',{dur:.34}]
   ]
 })
 </script>
