<script type="text/scene">
{
  shots:[[0,'#excl-2'],[1.04,'#fm']],
  on:[
    [0,'highlight','#excl-text-6',{words:'force majeure',color:'#f2b705',opacity:0.43,pad:8,dur:0.34}],
    [2.54,'words','#fm-def-1',{gap:0.39,dist:12,spring:'soft'}],
    [5.22,'words','#fm-def-2',{gap:0.49,dist:12,spring:'soft'}],
    [6.28,'highlight','#fm-def-2',{words:'लागू शर्तों',color:'#f2b705',opacity:0.40,pad:7,dur:0.34}],
    [6.92,'words','#fm-def-3',{gap:0.30,dist:12,spring:'soft'}],
    [7.80,'fade','#fm-delay',{dur:0.29}]
  ],
  update(t,sec,$){
    if(t>=1.04)return;
    const el=$('#excl-text-4')[0],r=$('#held-exclusion-mark')[0],phrase='पता अधूरा, गलत';
    if(!el||!r)return;
    const a=el.textContent.indexOf(phrase);
    let x=Infinity,y=Infinity,right=-Infinity,b=-Infinity;
    for(let i=a;i<a+phrase.length;i++){
      const q=el.getExtentOfChar(i);x=Math.min(x,q.x);y=Math.min(y,q.y);
      right=Math.max(right,q.x+q.width);b=Math.max(b,q.y+q.height);
    }
    if(Number.isFinite(x)){
      r.setAttribute('x',x-8);r.setAttribute('y',y-4);
      r.setAttribute('width',right-x+16);r.setAttribute('height',b-y+8);
    }
  }
}
</script>
