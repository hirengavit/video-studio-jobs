<script type="text/scene">
({camera:[[0,{zoom:1}]],on:[
[0,"pulse","#n5",{amount:0.08}],
[1.90,"color","#step-5",{to:"#2b2622",dur:0.4}],
[5.20,"underline","#step-5",{words:"police verification",color:"#c78e00",width:3.4,dur:0.35,gap:-6}],
[8.48,"color","#step-5-conclusion",{to:"#2b2622",dur:0.4}],
[9.11,"highlight","#step-5-conclusion",{color:"#fde9a6",opacity:1,dur:0.36,pad:4}]
],
 update(t, section, $) {
  const el=$('#step-2')[0], mark=$('#appointment-hold')[0], word='appointment';
  if(!el||!mark) return;
  const i=el.textContent.indexOf(word);
  if(i<0) return;
  let left=Infinity, top=Infinity, right=-Infinity, bottom=-Infinity;
  for(let j=i;j<i+word.length;j++){
   const e=el.getExtentOfChar(j);
   left=Math.min(left,e.x); top=Math.min(top,e.y); right=Math.max(right,e.x+e.width); bottom=Math.max(bottom,e.y+e.height);
  }
  if(Number.isFinite(left)) {
   mark.setAttribute('x',left-4); mark.setAttribute('y',top-2);
   mark.setAttribute('width',(right-left+8).toFixed(2)); mark.setAttribute('height',bottom-top+4);
  }
 }
})
</script>
</section>
