<script type="text/scene">
({
 shots:[[0,"#sizes"],[6.44,"#flaps"]],
 on:[
  [.06,"draw","#fold-max-outline",{dur:.74}],
  [4.72,"fade","#remember-fold-max",{dur:.32}],
  [7.98,"pulse","#flaps #flap-left, #flaps #flap-right, #flaps #flap-top",{amount:.055,stagger:.2}]
 ],
 update(t,section,$) {
  if(t>=6.44)return;
  const q=Math.min(1,Math.max(0,t/.9));
  const k=q*q*(3-2*q);
  for(const item of $("#sizes"))
    item.setAttribute("transform","translate("+(-315*k)+" "+(-182*k)+") scale("+(1+.20*k)+")");
 }
})
</script>
