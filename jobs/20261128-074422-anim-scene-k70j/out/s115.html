  <script type="text/scene">
  {
    camera: [[0,{zoom:1,x:0,y:0}],[2.12,{zoom:1.04,x:0,y:4},"smooth"],[7.08,{zoom:1.04,x:0,y:4}],[10.39,{zoom:1,x:0,y:0},"smooth"]],
    on: [
      [0,"color","#pledgee-en1",{to:"#6f6a63",dur:0.22}],
      [7.08,"color","#pledgee-en2",{to:"#6f6a63",dur:0.23}]
    ],
    update(t,section,$) {
      const en2=$('#pledgee-en2')[0], en3=$('#pledgee-en3')[0];
      const m2=$('#phrase-mark-2')[0], m3=$('#phrase-mark-3')[0], u=$('#cooperative-underline')[0];
      const range=(el,phrase)=>{
        const start=el.textContent.indexOf(phrase);
        return [el.getStartPositionOfChar(start).x,el.getSubStringLength(start,phrase.length)];
      };
      const sweep=(el,mark,phrase,start)=>{
        const [x,w]=range(el,phrase);
        mark.setAttribute('x',x-7);
        mark.setAttribute('width',(w+14)*Math.min(1,Math.max(0,(t-start+.05)/.33)));
      };
      m2.setAttribute('width',0);
      m3.setAttribute('width',0);
      u.setAttribute('opacity',0);
      if(t<5.20) {
        const cue=t<2.12?['RBI',0]:t<3.52?['Scheduled Bank',2.12]:['Cooperative Society',3.52];
        sweep(en2,m2,cue[0],cue[1]);
      } else if(t<7.08) {
        const [x,w]=range(en2,'Cooperative Bank');
        const k=Math.min(1,Math.max(.01,(t-5.20)/.35));
        u.setAttribute('d','M'+x+' 518 Q'+(x+w*k/2)+' 522 '+(x+w*k)+' 518');
        u.setAttribute('opacity',1);
      } else if(t<10.39) {
        sweep(en3,m3,'Public / private corporation',7.08);
      } else {
        sweep(en3,m3,'Government company',10.39);
      }
    }
  }
  </script>
</section>
