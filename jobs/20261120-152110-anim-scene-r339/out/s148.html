<section class="vs-scene" id="s148" data-in="cut" data-section="PART 8 · LETTER BOX OR COUNTER" data-series="POST OFFICE RULES">
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-label="Hand an oversized ordinary article in at the Post Office window">
  <rect width="1920" height="1080" fill="#fbf7ee"/>
  <g id="reverse-case">
    <text class="hi" x="120" y="230" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-size="52" font-weight="790" fill="#9e1b1b">उल्टा case</text>
    <ellipse cx="270" cy="805" rx="109" ry="13" fill="#ead9a8" opacity=".48"/>
    <use id="pillar-box" href="piece:letter-box-icon" transform="translate(160 400)"/>
    <g id="slot-cue" opacity="0"><rect x="217" y="512" width="106" height="23" rx="6" fill="none" stroke="#f2b705" stroke-width="6"/></g>
    <g id="ordinary">
      <rect x="480" y="200" width="620" height="140" rx="22" fill="#9e1b1b"/>
      <rect x="490" y="210" width="600" height="120" rx="16" fill="none" stroke="#fff" stroke-opacity=".74" stroke-width="7" stroke-linecap="round" stroke-dasharray="0 19"/>
      <text x="790" y="259" text-anchor="middle" font-family="Inter,sans-serif" font-size="56" font-weight="800" fill="#fff">ORDINARY ARTICLE</text>
      <text id="ordinary-hi" class="hi" x="790" y="308" text-anchor="middle" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-size="36" font-weight="700" fill="#fde9a6">साधारण article</text>
    </g>
    <g id="too-large">
      <path id="width-bracket" d="M419 809v19m0-9h442m0-10v19" fill="none" stroke="#6f6a63" stroke-width="4" stroke-linecap="round"/>
      <g id="large-label"><text class="hi" x="640" y="874" text-anchor="middle" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-size="44" font-weight="780" fill="#4b4f58">बहुत बड़ा</text></g>
    </g>
    <g id="counter"><use href="piece:counter-window" transform="translate(1120 300)"/></g>
    <g id="article"><g id="article-scale"><use href="piece:envelope-article" transform="translate(440 517)"/></g></g>
  </g>
</svg>
<script type="text/scene">
{
  on: [
    [1.96, 'stamp', '#ordinary', {from: 1.2, rot: -3}],
    [2.46, 'fade', '#ordinary-hi', {dur: .22}],
    [5.08, 'pop', '#article', {from: .90}],
    [5.56, 'fade', '#too-large', {dur: .24}],
    [6.30, 'pop', '#counter', {from: .95}],
    [8.16, 'place', '#article', {on: '#counter', x: 1460}],
    [8.16, 'out', '#width-bracket', {dur:.30,scale:1}]
  ],
  update(t, section, $) {
    const cap = v => Math.max(0, Math.min(1, v));
    const slotPulse = Math.sin(Math.PI * cap((t - 4.40) / 0.60));
    const [slot] = $('#slot-cue');
    slot.setAttribute('opacity', slotPulse);
    slot.setAttribute('transform', 'translate(270 523.5) scale(' + (1 + .15 * slotPulse) + ') translate(-270 -523.5)');
    const u = cap((t - 8.16) / .40);
    const e = u * u * (3 - 2 * u);
    const dx = t < 8.16 ? 0 : -820 * (1 - e);
    const dy = t < 8.16 ? 0 : 129 * (1 - e);
    $('#article-scale')[0].setAttribute('transform','translate(' + dx + ' ' + dy + ') translate(640 802) scale(' + (1.70 - .70 * e) + ') translate(-640 -802)');
    $('#large-label')[0].setAttribute('transform','translate(' + (820 * e) + ' ' + (-94 * e) + ')');
  }
}
</script>
</section>
