</g>
</svg>
<script type="text/scene">
({
 camera:[[0,{zoom:1}]],
 update(t,section,$) {
  const node=$('#scale-weight')[0];
  if (!node) return;
  const f=Math.max(0,Math.min(1,(t-7.22)/.58));
  const g=Math.round((300+4700*f)/50)*50;
  node.textContent=t<4.4?'':t<7.22?'300 g':f>=1?'5 kg':g<1000?g+' g':(g/1000).toFixed(1)+' kg';
 },
 on:[
 [2.16,"fade","#booking-weight",{dur:.30}],
 [4.40,"fade","#weight-min",{dur:.30}],
 [7.22,"fade","#weight-max",{dur:.30}]
 ]
})
</script>
