  <script type="text/scene">
  {
    shots:[[0,"#table"],[0.40,"#hfc"],[8.32,"#ledger"]],
    on:[
      [3.20,"strike","#only-work",{color:"#505e6c",width:7,dur:.36,dim:.76}],
      [3.20,"draw","#cross-a",{dur:.22}],[3.32,"draw","#cross-b",{dur:.21}],
      [5.30,"pop","#approval-chip",{spring:"snap"}],[5.30,"draw","#approval-tick",{dur:.27}],
      [6.20,"pop","#notification-chip",{spring:"snap"}],[6.20,"draw","#notification-tick",{dur:.27}],
      [7.20,"fade","#need-both",{dur:.31}],
      [10.54,"fade","#officer-en",{dur:.32}],[11.04,"fade","#officer-hi",{dur:.073}],
      [12.36,"fade","#entry-highlight",{dur:.4}]
    ],
    update(t,section,$) {
      const spans=[
        ["#housing-company-marker","#pledgee-en5","Housing finance company",true],
        ["#nhb-approval-mark","#pledgee-hi5","NHB approved",false],
        ["#central-notified-mark","#pledgee-hi5","notified",false]
      ];
      if(t>=0.40)return;
      for(const [id,selector,word,box] of spans){
        const el=$(selector)[0],mark=$(id)[0],i=el.textContent.indexOf(word);
        const x=el.getStartPositionOfChar(i).x,w=el.getSubStringLength(i,word.length);
        if(box){mark.setAttribute("x",x-7);mark.setAttribute("width",w+14);}
        else mark.setAttribute("d","M"+x+" 976 Q"+(x+w/2)+" 979 "+(x+w)+" 975");
      }
    }
  }
  </script>
