<section class="vs-scene" id="s093" data-in="cut" data-duration="9.30" data-section="PART 5 · COD FEE" data-series="PRODUCTS" lang="hi">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" aria-label="Add 100 rupees to 135 rupees for the correct 235 rupee COD fee; avoid taking 1% of the whole amount">
  <rect width="1920" height="1080" fill="#fbf7ee"/>
  <g id="example-shared">
  <g id="fee-rules">
    <rect x="120" y="220" width="580" height="680" rx="28" fill="#9e1b1b" filter="url(#vs-shadow)"/>
    <rect x="120" y="220" width="580" height="680" rx="28" fill="none" stroke="#fbf7ee" stroke-width="13" stroke-dasharray="0 26" stroke-linecap="round"/>
    <text x="180" y="345" font-family="Inter,sans-serif" font-size="64" font-weight="800" fill="#fff">Base COD fee</text>
    <path d="M180 390H640" stroke="#b8403a" stroke-width="3"/>
    <rect id="first-slab-bg" x="174" y="432" width="472" height="130" rx="20" fill="#fde9a6"/>
    <text id="first-slab-rule" x="205" y="516" font-family="Georgia,'Noto Sans Devanagari',serif" font-size="53" font-weight="700" fill="#67231a">≤ 6,500: 1.6%</text>
    <rect x="174" y="600" width="472" height="196" rx="20" fill="#7d1414"/>
    <text id="second-slab-rule" x="205" y="675" font-family="Inter,'Noto Sans Devanagari',sans-serif" font-size="43" font-weight="700" textLength="406" lengthAdjust="spacingAndGlyphs" fill="#fff">&gt; 6,500: ₹100 + 1%</text>
    <text class="hi" x="205" y="747" font-family="'Noto Sans Devanagari',Inter,sans-serif" font-size="42" font-weight="700" fill="#fff">(ऊपर वाली रकम)</text>
    <path id="second-slab-underline" d="M205 693Q281 695 359 692" stroke="#f2d267" stroke-width="6" stroke-linecap="round"/>
      <rect id="second-slab-focus" x="174" y="600" width="472" height="196" rx="20" fill="none" stroke="#f2d267" stroke-width="7"/>
  </g>
  <g id="ex3">
    <rect x="760" y="220" width="1040" height="680" rx="28" fill="#fff" stroke="#ead9a8" stroke-width="3" filter="url(#vs-shadow)"/>
    <text x="820" y="313" class="hi" font-size="44" font-weight="700" fill="#6f6a63">सिर्फ base COD fee</text>
    <text id="example-three-heading" x="820" y="388" class="hi" font-size="64" font-weight="800" fill="#2b2622"><tspan>तीसरा ·</tspan><tspan id="example-three-amount" x="1037" y="388" style="font-family:Inter,sans-serif">₹20,000</tspan></text>
    <g id="second-slab-chip">
      <rect x="1296" y="274" width="432" height="66" rx="23" fill="#fde9a6"/>
      <text x="1512" y="321" text-anchor="middle" class="hi" font-size="44" font-weight="800" fill="#67231a">दूसरा slab · 3 steps</text>
    </g>
    <text id="step-one" x="820" y="450" class="hi" font-size="52" font-weight="810" fill="#9e1b1b">1 · 6,500 से ऊपर कितना?</text>
    <text id="step-one-working" x="820" y="519" xml:space="preserve" style="font-family:Georgia,Times,serif;font-size:60px" font-weight="760" fill="#2b2622"><tspan id="excess-subtraction">20,000 − 6,500</tspan><tspan id="excess-result"> = 13,500</tspan></text>
    <g id="step-two">
      <rect id="fee-highlight" x="1052" y="566" width="155" height="74" rx="19" fill="#fde9a6"/>
      <text id="step-two-working" x="820" y="619" xml:space="preserve" style="font-family:Georgia,Times,serif;font-size:60px" font-weight="760" fill="#2b2622"><tspan id="step-two-number" fill="#9e1b1b">2 ·</tspan><tspan id="excess-one-percent"> 1%</tspan><tspan id="step-two-equals"> = </tspan><tspan id="fee-part">₹135</tspan></text>
    </g>
  
    <g id="step-three">
      <text xml:space="preserve" style="font-family:Georgia,Times,serif;font-size:60px" x="820" y="711" font-weight="760" fill="#2b2622"><tspan id="step-three-number" fill="#9e1b1b">3 ·</tspan><tspan id="step-three-equation" x="922">₹100 + ₹135</tspan></text>
    </g>
    <g id="fee-result">
      <rect x="1330" y="679" width="375" height="95" rx="35" fill="#e3f1e8" stroke="#2e7d4f" stroke-width="3"/>
      <text x="1517.5" y="745" text-anchor="middle" font-family="Inter,sans-serif" font-size="65" font-weight="850" fill="#17634a">₹235</text>
    </g>
  </g>
  </g>
  <g id="trap">
    <rect id="trap-banner" x="300" y="212" width="1320" height="142" rx="29" fill="#4b4f58"/>
    <text id="trap-headline" x="960" y="307" text-anchor="middle" class="hi" font-family="'Noto Sans Devanagari',Inter,sans-serif" font-size="73" font-weight="830" fill="#fff">यहीं trap है</text>
    <g id="wrong-card">
      <rect x="300" y="420" width="1320" height="360" rx="31" fill="#eeedf0" stroke="#98949c" stroke-width="3"/>
      <text id="wrong-equation" x="960" y="576" text-anchor="middle" style="font-family:Georgia,Times,serif;font-size:90px" fill="#4b4f58">₹100 + 1% × 20,000</text>
    </g>
  </g>
</svg>
<script type="text/scene">
({
 camera:[[0,{zoom:1}]],
 shots:[[0,"#example-shared"],[4.98,"#trap"]],
 on:[
  [2.98,"pop","#fee-result",{from:.94,spring:"soft"}],
  [6.10,"fade","#wrong-card",{dur:.25}],
  [6.30,"type","#wrong-equation",{cps:13}]
 ],
 update(t,section,$) {
   if(t>=4.98) return;
   const number=$("#step-three-number")[0], equation=$("#step-three-equation")[0];
   if(number) number.textContent="3 ·".slice(0,Math.max(0,Math.floor(t*18)));
   if(equation) equation.textContent="₹100 + ₹135".slice(0,Math.max(0,Math.floor((t-.17)*13)));
   const fee=$("#fee-part")[0], bg=$("#fee-highlight")[0];
   if(fee && bg) {
     const b=fee.getBBox();
     if(b.width) {
       bg.setAttribute("x",String(b.x-12));
       bg.setAttribute("width",String(b.width+24));
     }
   }
 }
})
</script>
</section>
