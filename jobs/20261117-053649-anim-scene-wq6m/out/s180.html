<script type="text/scene">
{shots:[[0,"#class-shot"],[1.92,"#address-shot"],[10.24,"#special-shot"]],
camera:[[0,{zoom:1}],[1.92,{zoom:1}],[9.60,{zoom:1.045}],[10.23,{zoom:1.045}],[10.24,{zoom:1}]],
update(t,section,$) {
  if(t>=1.92)return;
    const parcel = $('#wrong-parcel')[0];
    if (parcel && !parcel.hasAttribute('data-slate')) {
      const fills = {'#c9a978':'#777c86','#e8d0a3':'#a6aab2','#b9976d':'#656b76'};
      const strokes = {'#2b2622':'#4b4f58','#947755':'#4b4f58','#8f744f':'#4b4f58','#f3ead6':'#e3e6ea'};
      parcel.querySelectorAll('[fill],[stroke]').forEach(el => {
        if (fills[el.getAttribute('fill')]) el.setAttribute('fill',fills[el.getAttribute('fill')]);
        if (strokes[el.getAttribute('stroke')]) el.setAttribute('stroke',strokes[el.getAttribute('stroke')]);
      });
      parcel.setAttribute('data-slate','');
    }
  const u=$('#detention-hi')[0].getBBox(), uy=u.y+u.height+8, uw=u.height*.05;
  $('#held-underline')[0].setAttribute('d',`M${u.x} ${uy} Q${u.x+u.width*.5} ${uy+uw} ${u.x+u.width} ${uy-uw*.4}`);
  const v=$('#seizure-text')[0].getBBox(), vy=v.y+v.height*.55, vw=v.height*.06;
  $('#held-seizure-strike')[0].setAttribute('d',`M${v.x-6} ${vy} Q${v.x+v.width/2} ${vy+vw} ${v.x+v.width+6} ${vy-vw*.5}`);
},
on:[
 [.12,"fade","#sender",{dur:.24}],[1.30,"strike","#sender-text",{color:"#4b4f58",width:7,dur:.24}],
 [1.92,"type","#qms-title",{cps:21}],
 [5.70,"type","#town-on-envelope",{cps:26}],[6.28,"fade","#town-on-envelope-hi",{dur:.23}],
 [6.70,"fade","#destination-pin-piece",{dur:.24}],[6.70,"reveal","#full-pin",{from:"left",dur:.41}],
 [8.68,"pop","#six",{from:.88,spring:"fast"}],
 [8.68,"pulse","#pin-digit-1",{amount:.11}],
 [8.76,"pulse","#pin-digit-2",{amount:.11}],
 [8.84,"pulse","#pin-digit-3",{amount:.11}],
 [8.92,"pulse","#pin-digit-4",{amount:.11}],
 [9.00,"pulse","#pin-digit-5",{amount:.11}],
 [9.08,"pulse","#pin-digit-6",{amount:.11}],

 [11.61,"fade","#special-notice",{dur:.23}]
]}
</script>
