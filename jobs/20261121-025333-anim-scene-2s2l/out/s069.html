<script type="text/scene">
{
 on:[
  [.88,'fade','#authorised',{dur:.34}],
  [3.00,'highlight','#hours',{words:'तय घंटों में',color:'#fde9a6',opacity:.65,dur:.46,pad:7}],
  [6.50,'pop','#rms',{from:.96,spring:'soft'}],
  [6.56,'draw','#rms-building',{dur:.48}],
  [8.60,'pop','#selected',{from:.96,spring:'soft'}],
  [10.70,'pop','#van',{from:.96,spring:'soft'}],
  [10.70,'draw','#van-icon',{dur:.64}],
  [10.70,'fade','#van-title',{dur:.26}],
  [12.28,'fade','#van-boxes',{dur:.30}]
 ],
 update(t,section,$) {
  const a=S.clamp((t-6.30)/.60,0,1);
  const e=1-(1-a)**3;
  const cx=S.lerp(960,169,e), cy=S.lerp(626,251,e), z=S.lerp(1.12,.43,e);
  $('#main-clock')[0].setAttribute('transform',`translate(${cx-130*z} ${cy-130*z}) scale(${z})`);
  const k=S.clamp((t-2.20)/.27,0,1), h=k*k*(3-2*k);
  for(const q of $('#hour-hand')) q.setAttribute('transform',`rotate(${30*h} 130 130)`);
  for(const q of $('#minute-hand')) q.setAttribute('transform',`rotate(${30*h} 130 130)`);
 }
}
</script>
