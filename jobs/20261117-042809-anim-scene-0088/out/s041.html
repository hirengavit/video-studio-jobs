<script type="text/scene">
  {
    update(t, section, $) {
      for (const id of ['logo-zone','postage-zone','barcode-zone','address-block']) {
        for (const part of $("[id$='-" + id + "']")) {
          if (part.closest('[id$="-diagram"]')) part.style.opacity = '0';
        }
      }
      for (const part of $("[id$='-window']")) {
        if (part.closest('[id$="-diagram"]')) part.setAttribute('stroke','#9e1b1b');
      }
    },
    on:[
      [.60,'fade','[id$="-diagram"] [id$="-barcode"]',{dur:.24}],
      [.60,'reveal','#barcode-highlight',{from:'left',dur:.32}],
      [.60,'fade','#barcode-note',{dur:.22}],
      [3.20,'pop','#slide-chip',{from:.94,spring:'soft'}],
      [4.98,'underline','#slide-warning',{words:'न छिपाए',color:'#9e1b1b',gap:4,dur:.27}],
      [6.86,'draw','#dim-w, #leader-w',{dur:.42}],
      [7.32,'fade','#lbl-w',{dur:.18}],
      [7.32,'type','#val-w-start',{cps:12}],
      [7.76,'fade','#val-w-separator',{dur:.14}],
      [8.18,'type','#val-w-end',{cps:13}],
      [8.50,'type','#val-w-unit',{cps:19}]
    ]
  }
</script>
</section>
