    <g id="line-1"><rect id="mark-citizen" rx="4" fill="#fde9a6"/><rect id="mark-authorised" rx="4" fill="#fde9a6"/><text id="line-1-copy" x="260" y="400" fill="#2b2622" font-family="Georgia, 'Times New Roman', serif" font-size="44">Citizen-centric services authorised by the Central Government</text></g>

      <text id="keyword-3" x="1400" y="883" text-anchor="middle" fill="#2b2622" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-size="40" font-weight="650">public / private साझेदारी</text>

<script type="text/scene">
({
  camera:[[0,{zoom:1}]],
  on:[
    [1.20,"reveal","#line-2",{from:"left",dur:.58}],
    [2.38,"highlight","#line-2-copy",{words:"State or Local Governments",color:"#fde9a6",opacity:1,dur:.34,pad:4}],
    [3.72,"fade","#keyword-2",{dur:.24}],
    [5.06,"reveal","#line-3",{from:"left",dur:.58}],
    [6.30,"highlight","#line-3-copy",{words:"public or private",color:"#fde9a6",opacity:1,dur:.34,pad:4}],
    [7.34,"fade","#keyword-3",{dur:.24}]
  ],
  update(t, section, $) {
    const el = $("#line-1-copy")[0];
    if (!el) return;
    for (const [phrase, selector] of [["Citizen-centric","#mark-citizen"],["authorised","#mark-authorised"]]) {
      const mark = $(selector)[0], start = el.textContent.indexOf(phrase);
      if (!mark || start < 0) continue;
      let left = Infinity, top = Infinity, right = -Infinity, bottom = -Infinity;
      for (let i = start; i < start + phrase.length; i++) {
        const c = el.getExtentOfChar(i);
        left = Math.min(left,c.x); top = Math.min(top,c.y);
        right = Math.max(right,c.x+c.width); bottom = Math.max(bottom,c.y+c.height);
      }
      if (Number.isFinite(left)) {
        mark.setAttribute("x",left-4); mark.setAttribute("y",top-2);
        mark.setAttribute("width",(right-left+8).toFixed(2)); mark.setAttribute("height",bottom-top+4);
      }
    }
  }
})
</script>
</section>
