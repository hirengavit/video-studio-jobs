  <script type="text/scene">
  {
    update(t, section, $) {
      const f = t < 1.60 ? Math.min(1,Math.max(0,(t-.32)/1.28)) : t < 6.08 ? 1 : Math.min(1,Math.max(0,(7-t)/.92));
      const eased = f*f*(3-2*f);
      for (const el of $("#wide-envelope")) {
        el.setAttribute("display", eased >= .999 ? "none" : "inline");
        el.setAttribute("opacity", String(1-eased));
      }
      for (const el of $("#stamp-detail")) {
        el.setAttribute("display", eased <= .001 ? "none" : "inline");
        el.setAttribute("opacity", String(eased));
        const z = .90 + .10*eased;
        el.setAttribute("transform", "translate(960 530) scale("+z+") translate(-960 -530)");
      }
    },
    on:[
      [0,"fade","#stamp-box",{dur:.27}],
      [2.06,"fade","#width-dimension",{dur:.24}],
      [6.08,"out","#width-dimension",{dur:.28}],
      [6.94,"pulse","#top-dimension",{amount:.035}],
      [6.94,"pulse","#measure-one",{amount:.030}],
      [6.94,"fade","#gap-reminder",{dur:.24}]
    ]
  }
  </script>
