  <script type="text/scene">
  {
    update(t, section, $) {
      const v = Math.min(1, Math.max(0, (t - .08) / .70));
      const e = v * v * (3 - 2 * v);
      const s = 1 + .18 * e, dx = -93 * e, dy = -148 * e, right = 55 * e;
      for (const diagram of $("#layer-diagram")) diagram.setAttribute("transform", "translate(" + dx + " " + dy + ") scale(" + s + ")");
      for (const label of $("#wax-label,#inner-cover,#outer-label")) label.setAttribute("transform", "translate(" + right + " 0)");
      const wx = 987 * s + dx, wy = 494 * s + dy, ox = 1035 * s + dx, oy = 798 * s + dy;
      for (const leader of $("#wax-leader")) leader.setAttribute("d", "M" + wx + " " + wy + "H" + (1080 + right) + "L" + (1128 + right) + " 494");
      for (const dot of $("#wax-dot")) { dot.setAttribute("cx", wx); dot.setAttribute("cy", wy); }
      for (const leader of $("#outer-leader")) leader.setAttribute("d", "M" + ox + " " + oy + "H" + (1082 + right) + "L" + (1129 + right) + " 842");
      for (const dot of $("#outer-dot")) { dot.setAttribute("cx", ox); dot.setAttribute("cy", oy); }
    },
    on:[
      [0,"reveal","#paper-fold",{from:"down",dur:.60}],
      [.86,"fade","#outer-cover",{dur:.25}],
      [4.82,"place","#adhesive-stamp",{on:"#stamp-placement-point",x:921}],
      [4.82,"fade","#adhesive-stamp",{dur:.15}],
      [6.30,"stamp","#ink-mark",{from:1.11,rot:-7,spring:"fast"}],
      [6.30,"fade","#paper-caption",{dur:.24}]
    ]
  }
