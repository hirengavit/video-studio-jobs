<section class="vs-scene" id="s093" data-in="cut" data-section="REGISTERED NEWSPAPER LICENCE" data-series="POSTAL RULES">

    <g id="reg-card">
      <rect id="reg-bg" x="100" y="209" width="738" height="357" rx="30" fill="#fff" stroke="#ead9a8" stroke-width="3"/>
      <path d="M134 229h670" stroke="#9e1b1b" stroke-width="8" stroke-linecap="round"/>
      <text id="reg-name" x="469" y="358" font-size="65" font-weight="780" text-anchor="middle" fill="#9e1b1b">Postal registration</text>
      <text x="469" y="421" font-family="'Noto Sans Devanagari',Inter,sans-serif" font-size="32" style="line-height:1.3" font-weight="560" text-anchor="middle" fill="#6f6a63">डाक पंजीकरण</text>

    <g fill="none" stroke="#6f6a63" stroke-width="13">

    <g id="lic-card">
      <rect id="lic-bg" x="1082" y="209" width="738" height="357" rx="30" fill="#fff" stroke="#ead9a8" stroke-width="3"/>
      <path d="M1116 229h670" stroke="#9e1b1b" stroke-width="8" stroke-linecap="round"/>
      <text id="lic-name" x="1451" y="358" font-size="73" font-weight="780" text-anchor="middle" fill="#9e1b1b">Licence</text>
      <text x="1451" y="421" font-family="'Noto Sans Devanagari',Inter,sans-serif" font-size="32" style="line-height:1.3" font-weight="560" text-anchor="middle" fill="#6f6a63">लाइसेंस</text>

    <g id="ended">
      <rect x="1371" y="451" width="160" height="56" rx="28" fill="#4b4f58"/>

    <g id="scope">
      <rect x="100" y="740" width="1720" height="217" rx="27" fill="#fff" stroke="#ead9a8" stroke-width="3"/>
      <use href="piece:newspaper-bundle" transform="translate(180 764) scale(.77)"/>
      <text x="494" y="830" class="hi" font-size="64" font-weight="740" fill="#9e1b1b">सिर्फ़ उस eligible newspaper</text>
      <text id="scope-posting" x="494" y="909" font-family="Inter,sans-serif" font-size="40" font-weight="800" fill="#2b2622">+ approved posting</text>
    </g>
  </svg>
  <script type="text/scene">
  {
    update(t, section, $) {
      for (const [id, start] of [["#reg-card", .86], ["#lic-card", 1.88]]) {
        const u = Math.max(0, Math.min(1, (t-start)/.30));
        for (const el of $(id)) el.setAttribute("opacity", 1-.4*u*u*(3-2*u));
      }
    },
    on: [
    [1.88,"fade","#ended",{dur:.24}],
    [2.95,"fade","#renew",{dur:.25}],
    [6.74,"fade","#scope",{dur:.27}],
    [10.70,"fade","#scope-posting",{dur:.20}],
    [10.70,"highlight","#scope-posting",{color:"#fde9a6",opacity:.9,dur:.32,pad:11}]
  ] }
  </script>
</section>
