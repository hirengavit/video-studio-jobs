<section class="vs-scene" id="s047" data-in="cut" data-section="PART 3 · TIMES AND HOUR PLATE" data-series="LETTER BOXES" lang="hi">

  </g>
  <g id="rule-stamp">
    <rect x="120" y="381" width="590" height="560" rx="30" fill="#9e1b1b" filter="url(#vs-shadow)"/>
    <rect x="120" y="381" width="590" height="560" rx="30" fill="none" stroke="#fbf7ee" stroke-width="14" stroke-dasharray="0 26" stroke-linecap="round"/>
    <rect x="146" y="407" width="538" height="508" rx="20" fill="none" stroke="#b8403a" stroke-width="3"/>
    <text class="hi" x="415" y="487" text-anchor="middle" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-size="44" font-weight="810" fill="#fde9a6">RULE · नियम</text>
    <text id="rule-number" x="415" y="729" text-anchor="middle" font-family="Inter, sans-serif" font-size="210" font-weight="840" fill="#fff">116</text>
    <path d="M186 791H644" stroke="#b8403a" stroke-width="3"/>
    <text x="415" y="855" text-anchor="middle" font-family="Inter, sans-serif" font-size="45" font-weight="790" fill="#fff">Letter-box attendant</text>
  </g>
  <g id="clock-slots">
    <g id="clock-slot-1">
      <rect x="781" y="381" width="330" height="460" rx="26" fill="#fff" stroke="#ead9a8" stroke-width="3"/>
      <circle cx="946" cy="543" r="116" fill="#fbf7ee" stroke="#ddcba6" stroke-width="4" stroke-dasharray="7 9"/>
      <g id="clock-1"><use href="piece:clock-face" transform="translate(818.6 415.6) scale(.98)"/></g>
      <g id="clock-label-1">
        <text x="946" y="698" text-anchor="middle" font-family="Inter, sans-serif" font-size="48" font-weight="820" fill="#9e1b1b">Clearance</text>
        <text x="946" y="748" text-anchor="middle" class="hi" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-size="40" font-weight="740" fill="#2b2622">box कब खाली</text>
      </g>
    </g>
    <g id="clock-slot-2">
      <rect x="1129" y="381" width="330" height="460" rx="26" fill="#fff" stroke="#ead9a8" stroke-width="3"/>
      <circle cx="1294" cy="543" r="116" fill="#fbf7ee" stroke="#ddcba6" stroke-width="4" stroke-dasharray="7 9"/>
      <g id="clock-2"><use href="piece:clock-face" transform="translate(1166.6 415.6) scale(.98)"/></g>
      <g id="clock-label-2">
        <text x="1294" y="698" text-anchor="middle" font-family="Inter, sans-serif" font-size="48" font-weight="820" fill="#9e1b1b">Dispatch</text>
        <text x="1294" y="747" text-anchor="middle" class="hi" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-size="40" font-weight="740" fill="#2b2622"><tspan x="1294">office से</tspan> <tspan x="1294" dy="52">कब जाती</tspan></text>
      </g>
    </g>
    <g id="clock-slot-3">
      <rect x="1477" y="381" width="330" height="460" rx="26" fill="#fff" stroke="#ead9a8" stroke-width="3"/>
      <circle cx="1642" cy="543" r="116" fill="#fbf7ee" stroke="#ddcba6" stroke-width="4" stroke-dasharray="7 9"/>
      <g id="clock-3"><use href="piece:clock-face" transform="translate(1514.6 415.6) scale(.98)"/></g>
      <g id="clock-label-3">
        <text x="1642" y="698" text-anchor="middle" font-family="Inter, sans-serif" font-size="48" font-weight="820" fill="#9e1b1b">Delivery</text>
      </g>
    </g>
  </g>
  <g id="three-times">
    <rect x="1074" y="934" width="440" height="90" rx="45" fill="#f3ead6" stroke="#ead9a8" stroke-width="2"/>
    <text class="hi" x="1294" y="995" text-anchor="middle" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-size="54" font-weight="810" fill="#2b2622">तीन समय</text>
  </g>
</svg>
<script type="text/scene">
{
  update(t, section, $) {
    const cues = [[0, -60, 0], [4.90, -30, 0], [8.44, 15, 180]];
    for (let i = 0; i < cues.length; i++) {
      const [start, h, m] = cues[i];
      const p = Math.max(0, Math.min(1, (t - start) / .37));
      const settle = (1 - p) * (1 - p);
      const g = $('#clock-' + (i + 1))[0];
      if (!g) continue;
      for (const [part, angle, length] of [['hour', h - 10 * settle, 39], ['minute', m - 23 * settle, 56]]) {
        const hand = g.querySelector('[id$="-' + part + '-hand"], [id="' + part + '-hand"]');
        if (!hand) continue;
        const r = angle * Math.PI / 180;
        hand.setAttribute('d', 'M130 130L' + (130 + length * Math.sin(r)).toFixed(3) + ' ' + (130 - length * Math.cos(r)).toFixed(3));
      }
    }
  },
  on: [
    [0.00,'draw','#clock-1',{dur:.37}],
    [2.92,'fade','#clock-label-1',{dur:.24}],
    [4.90,'draw','#clock-2',{dur:.37}],
    [7.08,'fade','#clock-label-2',{dur:.24}],
    [8.44,'draw','#clock-3',{dur:.37}],
    [10.90,'fade','#clock-label-3',{dur:.24}]
  ]
}
</script>
</section>
