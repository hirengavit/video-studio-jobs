<script type="text/scene">
({
 camera:[[0,{zoom:1.1,x:14,y:-20}],[.20,{zoom:1.1,x:14,y:-20}],[1.20,{zoom:1,x:0,y:0},'inOut']],
 on:[
  [.76,'stamp','#pm-only',{from:1.08,rot:-4,spring:[28,1]}],
  [4.36,'draw','#guj-free-underline',{dur:.50}]
 ],
 update(t,section,$) {
  const old=$("#guj-hi-wide")[0], wrapped=$("#guj-hi-wrap")[0], hi=$("#guj-hi-lead")[0];
  const ease=v=>{const u=Math.max(0,Math.min(1,v));return u*u*(3-2*u);};
  hi.setAttribute("y",899-14*ease((t-.20)/.32));
  old.style.display=t>=.41?"none":"";
  old.setAttribute("opacity",1-ease((t-.21)/.20));
  wrapped.style.display=t<.42?"none":"";
  wrapped.setAttribute("opacity",ease((t-.42)/.24));
  const el=$("#cond2b")[0], r=$("#carry-30-days")[0], phrase="30 दिन";
  const i=el.textContent.indexOf(phrase);
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(let j=i;j<i+phrase.length;j++){
   const e=el.getExtentOfChar(j);
   x0=Math.min(x0,e.x); y0=Math.min(y0,e.y);
   x1=Math.max(x1,e.x+e.width); y1=Math.max(y1,e.y+e.height);
  }
  if(Number.isFinite(x0)){
   r.setAttribute("x",x0-4); r.setAttribute("y",y0-2);
   r.setAttribute("width",(x1-x0+8).toFixed(2)); r.setAttribute("height",y1-y0+4);
  }
 }
})
</script>
