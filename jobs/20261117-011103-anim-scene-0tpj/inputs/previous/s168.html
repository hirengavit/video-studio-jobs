<script type="text/scene">
{
  shots:[[0,'#old-new-shot'],[5.75,'#myth-shot']],
  update(t,section,$){
    const line=$('#registered-charge')[0], mark=$('#old-parcel-strike')[0], word='registered parcel', start=line.textContent.indexOf(word);
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    for(let i=start;i<start+word.length;i++){const b=line.getExtentOfChar(i);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height)}
    const y=y0+(y1-y0)*.55, w=(y1-y0)*.06;
    mark.setAttribute('d','M'+(x0-6)+' '+y+' Q'+((x0+x1)/2)+' '+(y+w)+' '+(x1+6)+' '+(y-w*.5));
  },
  on:[
    [1.48,'strike','#registered-charge',{words:'charge',color:'#4b4f58',width:6,dur:.34}],
    [4.28,'stamp','#today-no',{from:1.10,rot:-4,spring:'soft'}],
    [7.89,'type','#registered-written',{cps:23}],
    [9.21,'type','#insured-written',{cps:24}],
    [9.99,'type','#speed-written',{cps:24}]
  ]
}
</script>
