<section class="vs-scene" id="s016" data-in="cut" data-section="PART 1 · WHAT GOES IN THE LETTER BOX" data-series="LETTER BOXES">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" aria-label="Two different postal facilities, then the notice on the letter box.">
  <rect width="1920" height="1080" fill="#fbf7ee"/>
  <g id="compare">
    <text id="compare-title" class="hi" x="960" y="250" text-anchor="middle" font-size="70" font-weight="820" fill="#2b2622">दो नामों का फ़र्क</text>
    <g id="letter-card">

      <g id="outgoing-icon">
        <use href="piece:letter-box-pillar" transform="translate(464 435) scale(.66)"/>

      <text id="outgoing" class="hi" x="530" y="767" text-anchor="middle" font-size="53" font-weight="780" fill="#2b2622">बाहर जाने वाली डाक</text>
      <text id="collection" class="hi" x="530" y="825" text-anchor="middle" font-size="45" font-weight="660" fill="#6f6a63">collection के लिए</text>

        <path d="M1431 917l26 26m0-26-26 26" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/>

  <g id="notice">

    <rect id="plate-border" x="446" y="520" width="148" height="130" rx="13" fill="none" stroke="#f2b705" stroke-width="7"/>

      <rect x="816" y="390" width="900" height="262" rx="27" fill="#fff" stroke="#ead9a8" stroke-width="3" filter="url(#vs-shadow)"/>

<script type="text/scene">
{
  camera: [[0,{zoom:1}], [10.19,{zoom:1}], [11.33,{zoom:1.12,x:35,y:0},'easeInOut']],
  on: [
    [1.22,'pulse','#vs'],
    [3.24,'fade','#wrong-option',{dur:.24}],
    [3.24,'words','#option-label',{gap:.28}],
    [6.40,'draw','#option-strike',{dur:.25}],
    [6.66,'stamp','#option-cross'],
    [7.79,'fade','#notice-label',{dur:.29}],
    [10.19,'pulse','#plate-border']
  ],
  update(t, section, $) {
    $('#compare').forEach(n => n.setAttribute('display',t<7.63?'inline':'none'));
    $('#notice').forEach(n => n.setAttribute('display',t<7.63?'none':'inline'));
  }
}
</script>
</section>
