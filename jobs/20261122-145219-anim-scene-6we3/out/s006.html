<script type="text/scene">
{
  shots: [[0, '#opener'], [2.60, '#letter']],
  on: [
    [0.00,'type','#opener-term',{cps:22}],
    [.68,'draw','#opener-underline',{dur:.52}],
    [2.70,'fade','#marker-current',{dur:.18}],
    [3.10,'fade','#marker-personal',{dur:.23}],
    [3.70,'fade','#letter-gist',{dur:.29}],
    [3.70,'fade','#letter-gloss',{dur:.29}],
    [9.60,'fade','#chip-secure',{dur:.24}],
    [11.78,'fade','#chip-postage',{dur:.26}],
  ],
  update(t, section, $) {
    $('#fill-letter').forEach(el => el.setAttribute('fill', '#f3ead6'));
    for (const id of ['#icon-ilc','#icon-postcard']) $(id).forEach(el => el.setAttribute('opacity', '.40'));
    const q = $('#letter-quote')[0];
    if (t < 2.60 || !q) return;
    const full = q.getComputedTextLength();
    const left = 960 - full / 2;
    for (const [id, start, count] of [['#marker-current',0,7],['#marker-personal',12,23]]) {
      const band = $(id)[0];
      if (!band || !full) continue;
      const lead = start ? q.getSubStringLength(0, start) : 0;
      band.setAttribute('x', left + lead - 10);
      band.setAttribute('width', q.getSubStringLength(start, count) + 20);
    }
  }
}
</script>
</section>
