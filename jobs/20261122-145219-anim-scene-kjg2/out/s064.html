 <script type="text/scene">
 {
  camera:[[0,{zoom:1}]],
  update(t,section,$) {
   const q=$('#qr-illustration')[0]?.querySelector('[id$="quiet-zone"]');
   if(q) q.setAttribute('visibility','hidden');
   const p=Math.max(0,Math.min(1,(t-5.45)/.42));
   const k=p*p*(3-2*p);
   for(const el of $('#lift-board')) el.setAttribute('transform','translate(0 '+(-38*k)+')');
   for(const el of $('#qr-label')) el.setAttribute('transform','translate(0 '+(-34*k)+')');
   for(const el of $('#code-value-slot-4')) el.setAttribute('opacity',String(1-Math.max(0,Math.min(1,(t-1.3)/.22))));
  },
  on:[
    [1.30,'fade','#scan-tall-pill',{dur:.22}],
    [1.30,'type','#scan-length',{cps:17}],
    [3.56,'type','#scan-width',{cps:20}],
    [5.80,'pop','#clear-visibility',{from:.93,spring:'fast'}],
    [7.72,'out','#row4-focus',{dur:.18,scale:1}],
    [7.72,'pop','#check-1',{from:.94,spring:'fast'}],
    [8.90,'pop','#check-2',{from:.94,spring:'fast'}],
    [11.38,'pop','#check-3',{from:.94,spring:'fast'}]
  ]
 }
 </script>
