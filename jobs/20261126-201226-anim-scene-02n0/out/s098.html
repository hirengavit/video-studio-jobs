<script type="text/scene">
{
  on:[
    [0.10,'slide','#exam-row-5',{from:'left',dist:42,spring:'soft'}],
    [1.64,'fade','#pod',{dur:0.24}],
    [2.40,'pop','#not-equal',{spring:'soft',from:0.90}]
  ],
  update(t,section,$){
    const row=$('#exam-row-4')[0];
    if(row)row.setAttribute('opacity',String(1-0.28*Math.max(0,Math.min(1,(t-0.10)/0.35))));
    for(const [id,phrase] of [[1,'13 alphanumeric'],[2,'चुने offices'],[3,'अपवाद'],[4,'पहले']]){
      const el=$('#exam-row-'+id+'-text')[0];
      const mark=$(id===4?'#carry-first-underline':'#carry-mark-'+id)[0];
      if(!el||!mark)continue;
      const start=el.textContent.indexOf(phrase);
      let x=Infinity,y=Infinity,right=-Infinity,bottom=-Infinity;
      for(let i=start;i<start+phrase.length;i++){
        const q=el.getExtentOfChar(i);x=Math.min(x,q.x);y=Math.min(y,q.y);
        right=Math.max(right,q.x+q.width);bottom=Math.max(bottom,q.y+q.height);
      }
      if(!Number.isFinite(x))continue;
      if(id===4){
        const line=bottom+6,wob=(bottom-y)*0.05;
        mark.setAttribute('d','M'+x+' '+line+' Q'+((x+right)*.5)+' '+(line+wob)+' '+right+' '+(line-wob*.4));
      }else{
        mark.setAttribute('x',x-8);mark.setAttribute('y',y-4);
        mark.setAttribute('width',right-x+16);mark.setAttribute('height',bottom-y+8);
      }
    }
  }
}
</script>
