<script type="text/scene">
{
  on:[
    [0.29,'move','#example-highlight-track',{by:[0,140],spring:'fast'}],
    [2.43,'underline','#example-distance-4',{color:'#f2b705',width:5,gap:2,dur:0.38}]
  ],
  update(t,section,$){
    const el=$('#example-slab')[0],line=$('#held-slab-underline')[0];
    if(!el||!line)return;
    const at=el.textContent.indexOf('slab');
    let l=Infinity,top=Infinity,r=-Infinity,b=-Infinity;
    for(let i=at;i<at+4;i++){
      const q=el.getExtentOfChar(i);l=Math.min(l,q.x);top=Math.min(top,q.y);
      r=Math.max(r,q.x+q.width);b=Math.max(b,q.y+q.height);
    }
    if(!Number.isFinite(l))return;
    const y=b+1,w=(b-top)*.05;
    line.setAttribute('d','M'+l+' '+y+' Q'+((l+r)*.5)+' '+(y+w)+' '+r+' '+(y-w*.4));
  }
}
</script>
