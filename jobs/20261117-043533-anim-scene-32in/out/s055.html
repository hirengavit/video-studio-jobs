<script type="text/scene">
{shots:[[0,"#reg"],[5.4,"#liquids"]],
update(t,section,$){
 const p=Math.max(0,Math.min(1,(t-9.29)/.5));
 const e=$("#other")[0], m=$("#other-tone")[0];
 if(!e||!m) return;
 if(!p){e.removeAttribute("filter");e.setAttribute("opacity","1");return;}
 const luma=[.2126,.7152,.0722], tint=[111/255,106/255,99/255];
 const v=tint.flatMap((c,i)=>luma.map((v,j)=>(i===j?1-p:0)+p*.42*v).concat(0,p*.58*c));
 m.setAttribute("values",v.concat(0,0,0,1,0).join(" "));
 e.setAttribute("filter","url(#other-muted)");
 e.setAttribute("opacity",String(1-.65*p));
},
on:[
[0,"slide","#purpose-3",{from:"right",dist:34,spring:"fast"}],
[2.30,"slide","#purpose-4",{from:"right",dist:34,spring:"fast"}],
[5.50,"fade","#different",{dur:.17}],[5.50,"type","#wrap-warning",{cps:18}],[7.60,"draw","#wrap-cross",{dur:.23}],
[9.29,"pulse","#bottle",{amount:.08}],[9.29,"fade","#term",{dur:.20}],
[9.79,"fade","#term-hi",{dur:.19}],[13.17,"fade","#melt",{dur:.20}]
]}
</script></section>
