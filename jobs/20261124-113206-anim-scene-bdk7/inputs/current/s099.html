<script type="text/scene">
({
 camera:[[0,{zoom:1}]],
 update(t,section,$){
  const book=$('#wrapper-example #book')[0];
  if(book) book.setAttribute('transform','translate(100 0)');
  const opts=$('#packing-options')[0];
  if(opts){
   const u=Math.max(0,Math.min(1,(t-7.48)/.38));
   opts.style.filter='grayscale('+u+')';
   opts.style.opacity=String(1-.60*u);
  }
 },
 on:[
 [0.64,"fade","#inspection-chip-1",{dur:.28}],
 [2.08,"fade","#inspection-chip-2",{dur:.28}],
 [4.00,"fade","#inspection-chip-3",{dur:.28}],
 [6.30,"fade","#inspection-chip-4",{dur:.28}],
 [7.48,"pop","#tight-packet",{spring:"soft",from:.93}],
 [10.40,"fade","#tied-verdict",{dur:.29}]
 ]
})
</script>
