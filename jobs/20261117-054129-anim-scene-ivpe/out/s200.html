    shots:[[0,'#regulation-shot'],[4.90,'#comparison']],

      $('#refund-rule')[0]?.setAttribute('y',860-36*e);

        const b=label.getBBox();
        if(b.width>0) holder.setAttribute('transform','translate('+(b.x+b.width+24-1025)+' 0)');
      }
    },
    on:[
      [2.90,'type','#refund-amount',{cps:18}],
      [3.72,'fade','#refund-dash',{dur:.20}],
      [0,'place','#queued-envelope',{on:'#counter-tray'}],
      [8.30,'pop','#in-transmission',{from:.96,spring:'soft'}],
      [10.12,'fade','#recall',{dur:.24}]
    ]
  }
