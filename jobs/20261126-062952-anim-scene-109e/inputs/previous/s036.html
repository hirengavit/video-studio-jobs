 <script type="text/scene">
 ({
  camera:[[0,{zoom:1}]],
  update(t, section, $){
   const flow=$('#cod-flow')[0];
   const level=Math.max(0,Math.min(1,(t-1.26)/.40));
   if(flow){
    if(level>0){
     const filter=$('#flow-grey')[0];
     if(filter) flow.setAttribute('filter','url(#'+filter.id+')');
     $('#flow-saturation')[0]?.setAttribute('values',(1-level).toFixed(4));
    }else flow.removeAttribute('filter');
   }
  },
  on:[
   [1.26,'slide','#cod-rules',{from:'down',dist:85,spring:'soft'}],
   [2.78,'fade','#separate-period',{dur:.26}],
   [5.58,'draw','#no-separate-period',{dur:.36}],
   [6.98,'fade','#automatic-extension',{dur:.26}],
   [10.14,'draw','#no-automatic-extension',{dur:.36}]
  ]
 })
 </script>
