<script type="text/scene">
({
 camera:[[0,{zoom:1}]],
 on:[
  [0,"fade","#exam-row-4",{dur:.30}],
  [3.98,"fade","#exam-row-5",{dur:.28}],
  [6.24,"fade","#prohibited",{dur:.26}],
  [6.24,"color","#row5-bg",{to:"#fde9a6",dur:.30}]
 ],
 update(t,section,$) {
  const x=Math.max(0,Math.min(1,t/.48));
  const q=x*x*(3-2*x);
  const rgb=(a,b)=>'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*q)).join(',')+')';
  for(let i=1;i<=4;i++){
    const row=$("#exam-row-"+i)[0];
    if(!row)continue;
    row.setAttribute("transform","translate(0 "+(-12*(i-1)*q)+")");
    row.firstElementChild.setAttribute("height",100-6*q);
    if(i===4)continue;
    for(const el of row.querySelectorAll("text")){
      const h=el.dataset.startFill||(el.dataset.startFill=el.getAttribute("fill"));
      const v=[1,3,5].map(j=>parseInt(h.slice(j,j+2),16));
      el.setAttribute("fill",rgb(v,[111,106,99]));
    }
    for(const el of row.querySelectorAll("g rect"))el.setAttribute("opacity",1-q);
  }
 }
})
</script>
