<script type="text/scene">

  on:[
    [1.70,'pop','#booking-help',{from:.92,spring:'fast'}],
    [3.00,'pop','#booking-not-replaced',{from:.92,spring:'fast'}],
    [5.88,'pop','#air-stamp-1,#air-stamp-2,#air-stamp-3',{stagger:.15,from:.87,spring:'soft'}],
    [5.88,'fade','#high-value',{dur:.35}],
    [9.12,'type','#airmail-label',{cps:17}],
    [10.42,'fade','#mail-counter-label',{dur:.24}]

})
