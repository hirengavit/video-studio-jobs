<script type="text/scene">
{on:[
[0.20,"pop","#td-chip",{from:0.93,spring:"soft"}],
[2.84,"pop","#right",{from:0.97,spring:"soft"}],
[4.02,"fade","#mis-early",{dur:0.25}],
[6.18,"words","#mis-principal",{gap:0.14,from:"down",dist:10}],
[8.40,"slide","#remember",{from:"down",dist:32,spring:"soft"}],
[8.46,"fade","#remember-hi",{dur:0.25}],
[9.80,"fade","#option",{dur:0.26}],
[9.80,"words","#option-text",{gap:0.21,from:"down",dist:10}]
],
update(t, section, $) {
  const book = $("#td-icon")[0];
  const label = $("#td-book-caption")[0];
  const k = Math.max(0, Math.min(1, (t - 0.22) / 0.44));
  const ease = k * k * (3 - 2 * k);
  book.setAttribute("transform", "translate(" + (740 - 30 * ease) + " 396) scale(" + (0.45 + 0.15 * ease) + ")");
  label.setAttribute("font-size", 25.5556 + 3.4444 * ease);
  if (ease > 0) {
    label.setAttribute("textLength", 128);
    label.setAttribute("lengthAdjust", "spacingAndGlyphs");
  } else {
    label.removeAttribute("textLength");
    label.removeAttribute("lengthAdjust");
  }
}}
</script>
