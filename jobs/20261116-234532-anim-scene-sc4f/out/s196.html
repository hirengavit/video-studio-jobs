  <script type="text/scene">
  {
    shots:[[0,'#route-shot'],[5.25,'#regulation-shot']],
    update(t, section, $) {
      const p=$('#property-label')[0], mark=$('#property-highlight')[0], word='property', from=p.textContent.indexOf(word);
      let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
      for (let i=from;i<from+word.length;i++) {
        const b=p.getExtentOfChar(i);
        x0=Math.min(x0,b.x); y0=Math.min(y0,b.y);
        x1=Math.max(x1,b.x+b.width); y1=Math.max(y1,b.y+b.height);
      }
      mark.setAttribute('x',String(x0-6)); mark.setAttribute('y',String(y0-3));
      mark.setAttribute('width',String(Math.round((x1-x0+12)*100)/100));
      mark.setAttribute('height',String(y1-y0+6));
    },
    on:[
      [1.46,'pop','#seizure',{from:.93,spring:'soft'}],
      [3.96,'underline','#seizure-label',{words:'ज़ब्त',color:'#4b4f58',gap:3,width:5,dur:.24}],
      [6.47,'stamp','#secnum',{from:1.13,rot:-3,spring:'soft'}]
    ]
  }
  </script>
