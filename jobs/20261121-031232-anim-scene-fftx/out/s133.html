<script type="text/scene">
{
 camera:[[0,{zoom:1}]],
 shots:[[0,'#p3'],[6.68,'#p4']],
 on:[
  [0,'fade','#return-all-three',{dur:.22}],
  [1.36,'draw','#p3-row-4-tick',{dur:.29}],
  [2.20,'fade','#p3-rule-5',{dur:.26}],
  [3.30,'fade','#defect-label',{dur:.23}],
  [5.14,'fade','#postmaster-report',{dur:.23}],
  [5.14,'draw','#p3-row-5-tick',{dur:.28}],
  [6.72,'stamp','#p4-number',{from:1.14}],
  [7.10,'fade','#p4-title, #p4-record',{dur:.30}]
 ],
 update(t,section,$) {
  for (const [id,hx,hy,mx,my] of [
    ['#timing-clearance',96,110,130,72],
    ['#timing-dispatch',140,92,130,188],
    ['#timing-arrival',168,125,72,130]
  ]) {
    const clock = $(id)[0];
    const hour = clock?.querySelector('#hour-hand,[id$="-hour-hand"]');
    const minute = clock?.querySelector('#minute-hand,[id$="-minute-hand"]');
    hour?.setAttribute('d','M130 130L'+hx+' '+hy);
    minute?.setAttribute('d','M130 130L'+mx+' '+my);
  }
  $('#p3')[0].setAttribute('visibility',t<6.68?'visible':'hidden');
  $('#p4')[0].setAttribute('visibility',t>=6.68?'visible':'hidden');
  const f=Math.max(0,Math.min(1,(t-2.20)/.3)), e=f*f*(3-2*f);
  $('#p3-row-5')[0].setAttribute('visibility',t>=2.20?'visible':'hidden');
  $('#p3-rule-5')[0].setAttribute('visibility',t>=2.20?'visible':'hidden');
  $('#p3-shadow')[0].setAttribute('height',700+45*e);
  $('#p3-card')[0].setAttribute('height',700+45*e);
 }
}
</script>
</section>
