<script type="text/scene">
{
 on:[
   [1.12,'fade','#shared',{dur:0.27}],
   [1.87,'pop','#equal',{from:0.97,spring:'fast'}],
   [4.74,'swap','#equal',{to:'#usual',dur:0.35}],
   [6.33,'pop','#no-rule',{from:0.96,spring:'fast'}],
   [6.78,'underline','#no-rule-label',{words:'नहीं',color:'#f2b705',width:7,gap:5,dur:0.24}],
   [7.22,'color','#term-card',{to:'#6f6a63',dur:0.4}],
   [9.28,'pop','#another',{from:0.96,spring:'fast'}],
   [11.06,'pop','#union',{from:0.96,spring:'fast'}],
   [11.66,'fade','#union-hi',{dur:0.26}]
 ],
 update(t, section, $) {
   // Reflow the same diagram at full opacity. Interpolate borders, not the text scale.
   const u = Math.max(0, Math.min(1, (t - 7.22) / 0.6));
   const k = 1 - (1 - u) ** 3;
   const lerp = (start, end) => start + (end - start) * k;
   const attr = (id, values) => {
     const [element] = $(id);
     if (element) for (const [name, value] of Object.entries(values)) element.setAttribute(name, String(value));
   };
   attr('#circle-outline', { x: lerp(1110, 940), y: lerp(474, 360), width: lerp(570, 800), height: lerp(286, 420) });
   const labelX = lerp(1158, 962), labelY = lerp(552, 420);
   const stateTop = lerp(474, 448);
   attr('#circle-label', { x: labelX, y: labelY });
   const distance = labelY - stateTop;
   const bridge = Math.max(0, Math.min(1, (distance + 12) / 9, (52 - distance) / 9));
   attr('#circle-label-clearance', { x: labelX - 8, y: labelY - 48, opacity: bridge });
   attr('#state-outline', { x: lerp(1110, 958), y: lerp(474, 448), width: lerp(570, 302), height: lerp(286, 312), 'stroke-width': lerp(14, 5) });
   // Align the existing right-anchored state label while maintaining the seam and preserving its size.
   attr('#state-label', { x: lerp(1600, 1160), y: lerp(729, 620) });
   attr('#shared', { 'stroke-opacity': 1 - k });
 }
}
</script>
