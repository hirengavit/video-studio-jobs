<script type="text/scene">
{
 shots:[[0,'#list2'],[2.96,'#pay']],
 on:[
  [0.76,'fade','#dg-exception',{dur:.28}],
  [4.06,'pop','#pay-tile-1',{from:.94,spring:'soft'}],
  [4.92,'pop','#pay-tile-2',{from:.94,spring:'soft'}],
  [5.88,'pop','#pay-tile-3',{from:.94,spring:'soft'}],
  [8.44,'pop','#pay-tile-4',{from:.94,spring:'soft'}],
 ],
 update(t, section, $) {
  const title = $('#postage-prepaid')[0], underline = $('#postage-underline')[0];
  if (title && underline) {
   const word = 'पहले', startIndex = title.textContent.indexOf(word);
   let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
   for (let i = startIndex; i < startIndex + word.length; i++) {
    const b = title.getExtentOfChar(i);
    x0 = Math.min(x0, b.x); x1 = Math.max(x1, b.x + b.width);
    y0 = Math.min(y0, b.y); y1 = Math.max(y1, b.y + b.height);
   }
   if (x1 > x0) {
    const y = y1 + 6, wobble = (y1 - y0) * 0.05;
    underline.setAttribute('d', 'M' + x0 + ' ' + y + ' Q' + ((x0+x1)/2) + ' ' + (y+wobble) + ' ' + x1 + ' ' + (y-wobble*0.4));
   }
  }
  const start = $('#postage-exception')[0], ending = $('#dg-exception')[0];
  if (start && ending) {
   const length = start.getComputedTextLength();
   if (length > 0) ending.setAttribute('x', 310 + length + 24);
  }
 }
}
</script>
