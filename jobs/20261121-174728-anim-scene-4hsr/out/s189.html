<script type="text/scene">
{
  dur:10.97,
  shots:[[0,"#und"],[5.05,"#sum9"]],
  on:[
    [.35,"fade","#not-every",{dur:.28}],
    [3.50,"underline","#caveat",{words:"नहीं",color:"#2b2622",width:6,gap:9,dur:.34}],
    [6.39,"pop","#stamp-letter",{from:.94,spring:"fast"}],
    [8.73,"pop","#stamp-ilc",{from:.94,spring:"fast"}]
  ],
  update(t, section, $) {
    const smooth=(a,b)=>{const u=Math.max(0,Math.min(1,(t-a)/(b-a)));return u*u*(3-2*u);};
    const q=smooth(0,.48), drag=smooth(0,.34), fade=smooth(.24,.66);
    for(const plate of $('#und-plate')) plate.setAttribute('height',String(791-138*q));
    for(const rule of $('#und-rule')) rule.setAttribute('transform','translate(0 '+(-108*q)+')');
    for(const tag of $('#destroy-tag')) tag.setAttribute('transform','translate('+(492*drag)+' 0)');
    const mix=(a,b)=>'rgb('+a.map((v,i)=>Math.round(v+fade*(b[i]-v))).join(',')+')';
    for(const bg of $('#destroy-bg')) bg.style.fill=mix([75,79,88],[235,232,226]);
    for(const el of $('#destroy-text')) el.style.fill=mix([255,255,255],[111,106,99]);
    for(const el of $('#und-rule-text')) el.style.fill=mix([43,38,34],[111,106,99]);
    for(const el of $('#und-rule-bg')) el.style.fill=mix([243,234,214],[235,232,226]);
    const label = $('#und-rule-text')[0], marker = $('#und-hl')[0];
    if(marker) marker.style.opacity=String(1-fade);
    if (!label || !marker) return;
    const w=label.getComputedTextLength();
    if (w) {
      marker.setAttribute('x',599.5-w/2-8);
      marker.setAttribute('width',label.getSubStringLength(0,11)+16);
    }
  }
}
</script>
