<rect width="1920" height="1080" fill="#fbf7ee"/>

  </g>
  <g id="status-unpaid">
    <rect x="986" y="234" width="367" height="92" rx="46" fill="#f3ead6"/>
    <text x="1169.5" y="295" text-anchor="middle" font-family="Inter,sans-serif" font-size="55" font-weight="800" fill="#2b2622">Unpaid</text>
  </g>
  <g id="und-postcard" transform="translate(298 364) scale(.76)">
    <use href="piece:service-postcard"/>
    <text x="317" y="63" font-family="Inter,sans-serif" font-size="22" font-weight="820" fill="#2b2622">POST CARD</text>
    <text x="512" y="104" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" font-weight="800" fill="#fff">50 p</text>

  <g id="und-ilc" transform="translate(1138 382) scale(.77)">
    <use href="piece:letter-card-folded"/>
    <text x="330" y="66" text-anchor="middle" font-family="Inter,sans-serif" font-size="22" font-weight="820" fill="#2b2622">LETTER CARD</text>

  <text x="526" y="706" text-anchor="middle" font-family="Inter,sans-serif" font-size="52" font-weight="770" fill="#2b2622">Postcard</text>
  <text x="1380" y="706" text-anchor="middle" font-family="Inter,sans-serif" font-size="52" font-weight="770" fill="#2b2622">Letter Card</text>

  </g>

</svg>
<script type="text/scene">
{
  on: [
    [.80,'pop','#status-unpaid',{spring:'soft'}],
    [3.34,'draw','#strike-cards',{dur:.38}],
    [3.34,'fade','#destroy-tag',{dur:.32}],
    [6.04,'fade','#und-rule',{dur:.28}],
    [6.38,'fade','#und-hl',{dur:.27}],
  ],
  update(t, section, $) {
    const label = $('#und-rule-text')[0], marker = $('#und-hl')[0];
    if (!label || !marker) return;
    const w=label.getComputedTextLength();
    if (w) {
      marker.setAttribute('x',599.5-w/2-8);
      marker.setAttribute('width',label.getSubStringLength(0,11)+16);
    }
  }
}
</script>
</section>
