<script type="text/scene">
({
  update(t,section,$){
    const line=$('#closure-rule')[0], mark=$('#closure-highlight')[0], word='लगातार', start=line.textContent.indexOf(word);
    if(start<0) return;
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    for(let i=start;i<start+word.length;i++){const b=line.getExtentOfChar(i);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height)}
    mark.setAttribute('x',String(x0-6));mark.setAttribute('y',String(y0-3));mark.setAttribute('width',String(x1-x0+12));mark.setAttribute('height',String(y1-y0+6));mark.setAttribute('opacity','1');
  },
  on:[
    [1.24,'out','#unpaid-disposition',{dur:.19}],
    [1.45,'fade','#sender-question',{dur:.20}],
    [4.20,'fade','#sender-no',{dur:.12}],
    [4.20,'draw','#sender-cross',{dur:.25}],
    [5.53,'pop','#book-post',{from:.93}],
    [6.57,'type','#book-regulation',{cps:12}],
    [8.80,'fade','#book-inspection',{dur:.24}]
  ]
})
</script>
