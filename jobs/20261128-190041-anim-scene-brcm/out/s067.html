<script type="text/scene">
{ on: [
  [0,"color","#rule-one",{to:"#6f6a63",dur:0.4}],
  [0,"color","#rule-one-extension",{to:"#6f6a63",dur:0.4}],
  [0,"color","#rule-one-only",{to:"#6f6a63",dur:0.4}],
  [0,"color","#rule-one-twice",{to:"#6f6a63",dur:0.4}],
  [0,"color","#rule-two-a",{to:"#6f6a63",dur:0.4}],
  [0,"color","#rule-two-b",{to:"#6f6a63",dur:0.4}],
  [0.15,"words","#rule-three",{gap:0.27,dist:5,spring:"soft"}],
  [1.70,"highlight","#rule-three",{words:"खाता खोलते समय",color:"#f2b705",opacity:0.27,dur:0.39,pad:5}],
  [4.38,"color","#rule-three",{to:"#6f6a63",dur:0.4}],
  [4.38,"words","#rule-four-a",{gap:0.57,dist:5,spring:"soft"}],
  [6.53,"words","#rule-four-b",{gap:0.235,dist:5,spring:"soft"}],
  [8.27,"highlight","#rule-four-b",{words:"कभी भी वापस",color:"#f2b705",opacity:0.27,dur:0.39,pad:5}]
  ],
  update(t, section, $) {
    // These three ink marks were already fully drawn at the cut from s066.
    // Use the same glyph extents and padding as the engine's highlight/underline.
    const box = (el, phrase) => {
      const start = el.textContent.indexOf(phrase);
      const glyphs = Array.from({ length: phrase.length }, (_, i) => el.getExtentOfChar(start + i));
      const x = Math.min(...glyphs.map(g => g.x)), y = Math.min(...glyphs.map(g => g.y));
      return { x, y, width: Math.max(...glyphs.map(g => g.x + g.width)) - x,
        height: Math.max(...glyphs.map(g => g.y + g.height)) - y };
    };
    const band = (mark, b, pad) => {
      for (const [k, v] of Object.entries({ x: b.x - pad, y: b.y - pad / 2,
        width: b.width + 2 * pad, height: b.height + pad })) mark.setAttribute(k, v);
    };
    band($("#rule-one-band-held")[0], $("#rule-one-twice")[0].getBBox(), 7);
    const second = $("#rule-two-b")[0];
    band($("#rule-two-band-held")[0], box(second, "maturity date"), 5);
    const b = box(second, "लागू थी"), y = b.y + b.height + 3, wob = b.height * 0.05;
    $("#rule-two-underline-held")[0].setAttribute("d", `M${b.x} ${y} Q${b.x + b.width / 2} ${y + wob} ${b.x + b.width} ${y - wob * 0.4}`);
  }
}
</script>
</section>
