 <script type="text/scene">
 ({
  camera:[[0,{zoom:1}]],
  on:[
   [0,"fade","#weight-example-2",{dur:.24}],[1.64,"fade","#example-price-2",{dur:.23}],
   [2.90,"fade","#weight-example-3",{dur:.24}],[5.14,"fade","#example-price-3",{dur:.23}],
   [7.68,"fade","#weight-example-4",{dur:.24}],[9.82,"fade","#example-price-4",{dur:.23}]
  ],
  update(t,section,$){
   const ramp=(at,dur)=>Math.max(0,Math.min(1,(t-at)/dur));
   const s=ramp(0,.27);
   for(const id of ["tariff-trap","booking-min","rejected-299","accepted-300","twenty-after-tax","one-slab-note","sum-trap","middle-slabs"]){
    const el=$("#"+id)[0];if(el){el.style.filter="grayscale("+s+")";el.style.opacity=1-(id==="sum-trap"?.12:.28)*s;}
   }
   for(const [id,dx,dy,scale] of [["tariff-trap",322,39,.8],["booking-min",322,54,.8],["rejected-299",322,54,.8],["accepted-300",322,38,.8],["one-slab-note",330,280,.8],["sum-trap",330,273,.8],["middle-slabs",-45,0,1]]){
    const e=$("#"+id)[0];if(e)e.setAttribute("transform","translate("+dx*s+" "+dy*s+") scale("+(1-(1-scale)*s)+")");
   }
   const a=ramp(2.90,.25), b=ramp(7.68,.25);
   for(const [n,v] of [[2,a],[3,b]]){const e=$("#weight-example-"+n)[0];if(e){e.style.filter="grayscale("+v+")";e.style.opacity=1-.27*v;}}
   for(const [n,value] of [[1,1-s],[2,s*(1-a)],[3,a*(1-b)],[4,b]]){
    const el=$("#slab-band-"+n)[0];if(el)el.setAttribute("opacity",String(value));
   }
  }
 })
 </script>
