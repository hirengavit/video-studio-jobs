<script type="text/scene">
  {
    update(t,section,$) {
      const plate = $('#office-label')[0], strike = $('#office-strike')[0];
      const b = plate.getBBox(), y = b.y + b.height * .55, wob = b.height * .06;

      for (const hand of $('[id$="-clock-17"] [id$="-minute-hand"]')) hand.setAttribute('d','M130 130V62');
      for (const hand of $('[id$="-clock-1630"] [id$="-hour-hand"]')) hand.setAttribute('d','M130 130L163.94 163.94');
      for (const hand of $('[id$="-clock-1630"] [id$="-minute-hand"]')) hand.setAttribute('d','M130 130V198');
    },
    on:[
      [0,'move','#office',{by:[-178,0],spring:'soft'}],
      [0,'out','#office',{dur:.47,scale:false}],
      [.60,'out','#count-back',{dur:.16,scale:false}],

      [8.96,'pop','#dispatch',{from:.94,spring:'soft'}]

</script>
