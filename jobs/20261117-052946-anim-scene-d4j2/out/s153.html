<script type="text/scene">
({
  update(t, section, $) {
    for (const [id,at] of [['#tile-3',0],['#tile-4',8.38]]) {
      const tile = $(id)[0];
      const u = Math.max(0,Math.min(1,(t-at)/.28));
      if (!tile) continue;
      const a=[111,106,99], b=[234,217,168];
      tile.setAttribute('stroke','rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*u)).join(',')+')');
      tile.setAttribute('stroke-opacity',.6+.4*u);
      if(u>0.5) tile.removeAttribute('stroke-dasharray');
      else tile.setAttribute('stroke-dasharray','12 9');
    }
  },
  on:[
    [0,'pop','#kiosk-hero',{from:.91,spring:'fast'}],
    [.48,'fade','#kiosk-hi',{dur:.24}],
    [2.78,'fade','#designated-kiosk',{dur:.34}],
    [5.86,'pop','#regional-head',{from:.9,spring:'fast'}],
    [8.38,'pop','#web-hero',{from:.91,spring:'fast'}],
    [10.32,'fade','#mobile-option',{dur:.32}],
    [11.76,'fade','#permitted-items',{dur:.34}]
  ]
})
</script>
