<script type="text/scene">
({
 camera:[[0,{zoom:1}]],
 on:[
  [1.14,"fade","#packet-enter",{dur:.19}],
  [1.14,"fall","#example-packet",{by:151,bounce:.15}],
  [3.82,"count","#weight-readout",{from:0,to:600,suffix:" g",dur:.8}],
  [5.46,"fade","#packet-label",{dur:.25}],
  [8.34,"reveal","#days",{from:"left",dur:.48}],
  [10.00,"fade","#free-days",{dur:.25}]
 ],
 update(t,section,$){
  $("#weight-readout")[0].setAttribute("opacity",t>=3.82?1:0);
  for(let n=1;n<=7;n++){
   const el=$("#tile-"+n)[0];
   if(el) el.setAttribute("fill",t>=10+(n-1)*.05?"#dcefe3":"#fff");
  }
 }
})
</script>
