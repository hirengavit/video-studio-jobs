<script type="text/scene">
{shots:[[0,"#charge"],[6.72,"#calc"]],
 update(t, section, $) {
   const box=$('[id$="-stamp-picture"] [id$="-value-box"]')[0];
   const stamp=$('#stamp')[0], amount=$('#stamp-amount')[0];
   if (!box || !stamp || !amount) return;
   const b=box.getBBox(), matrix=box.getCTM(), local=stamp.getCTM();
   if (!matrix || !local || !b.width || !b.height) return;
   const point=section.querySelector('svg').createSVGPoint();
   point.x=b.x+b.width/2; point.y=b.y+b.height/2;
   const p=point.matrixTransform(matrix).matrixTransform(local.inverse());
   amount.setAttribute('transform','translate('+p.x+' '+p.y+')');
 },
 on:[
 [.46,"stamp","#double",{from:1.05,rot:-2}],[1.00,"fade","#double-hi",{dur:.24}],
 [3.08,"fade","#paid-note",{dur:.23}],[5.38,"underline","#paid-counts",{words:"गिना",color:"#8a5d00",gap:4,width:4,dur:.29}],
 [7.60,"fade","#l1",{dur:.23}],[8.56,"pop","#v1",{from:.84,spring:"fast"}],
 [9.78,"fade","#l2",{dur:.23}],[10.12,"pop","#v2",{from:.84,spring:"fast"}],
 [10.20,"pop","#stamp",{from:.88,spring:"fast"}]
]}
</script>
