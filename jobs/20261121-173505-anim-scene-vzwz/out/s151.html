  <script type="text/scene">
  ({
    dur: 12.04,
    update(t, section, $) {
      const guide = $("#air-guide")[0];
      if(!guide) return;
      const f = Math.max(0,Math.min(1,(t-4.34)/.68));
      const len=guide.getTotalLength(), at=f*len;
      const p=guide.getPointAtLength(at),
        a=guide.getPointAtLength(Math.max(0,at-.8)),
        b=guide.getPointAtLength(Math.min(len,at+.8));
      for(const el of $("#air-draw-window")) el.setAttribute("width",Math.max(0,p.x-563+3));
      const ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
      for(const el of $("#plane-ride")) el.setAttribute("transform","translate("+p.x+" "+p.y+") rotate("+ang+")");
    },
    on: [
      [0.50,"fade","#term-hi",{dur:0.3}],
      [2.38,"pop","#mountains",{from:0.94,spring:"fast"}],
      [3.16,"fade","#hard-label",{dur:0.27}],
      [4.34,"draw","#air-arc",{dur:0.68,ease:"linear"}],
      [4.34,"fade","#air-start",{dur:0.23}],
      [4.34,"fade","#plane",{dur:.12}],
      [4.93,"fade","#air-end",{dur:0.25}],
      [6.14,"pop","#lower-fee",{from:0.91,spring:"fast"}],
      [7.50,"color","#road-start",{to:"#2b2622",prop:"stroke",dur:0.30}],
      [7.50,"color","#road-end",{to:"#2b2622",prop:"stroke",dur:0.30}],
