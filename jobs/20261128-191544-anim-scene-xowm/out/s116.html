  <script type="text/scene">
  {
    on: [
      [0,"color","#pledgee-en3",{to:"#6f6a63",dur:0.27}],
      [1.63,"color","#pledgee-en4",{to:"#6f6a63",dur:0.28}],
      [3.70,"color","#nhb-approved",{to:"#8a5d00",dur:0.3}],
      [6.88,"color","#central-government-notified",{to:"#8a5d00",dur:0.3}]
    ],
    update(t,section,$) {
      const get = id => $(id)[0];
      const ease = x => {const u=Math.min(1,Math.max(0,x));return u*u*(3-2*u);};
      const span = (el,word) => {
        const i=el.textContent.indexOf(word);
        return [el.getStartPositionOfChar(i).x,el.getSubStringLength(i,word.length)];
      };
      const mark = (id,word,selector,k,alpha=1) => {
        const [x,w]=span(get(selector),word),el=get(id);
        el.setAttribute('x',x-7);el.setAttribute('width',(w+14)*k);el.setAttribute('opacity',.34*alpha);
      };
      mark('#phrase-mark-3','Government company','#pledgee-en3',1,1-ease(t/.26));
      mark('#local-authority-marker','Local authority','#pledgee-en4',ease(t/.38),1-ease((t-1.63)/.28));
      mark('#housing-company-marker','Housing finance company','#pledgee-en5',ease((t-1.63)/.46));
      const underline = (id,text,word,cue) => {
        const el=get(id),[x,w]=span(get(text),word),u=ease((t-cue)/.43);
        el.setAttribute('d',u>0?'M'+x+' 976 Q'+(x+w*u/2)+' 979 '+(x+w*u)+' 975':'');
      };
      underline('#nhb-approval-mark','#pledgee-hi5','NHB approved',3.70);
      underline('#central-notified-mark','#pledgee-hi5','notified',8.32);
    }
  }
  </script>
