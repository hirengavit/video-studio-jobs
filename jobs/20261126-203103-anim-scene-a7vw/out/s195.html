<script type="text/scene">
{
  on:[
    [0.68,'highlight','#en-4',{color:'#f2b705',opacity:0.43,pad:7,dur:0.37}],
    [4.64,'highlight','#value-4',{color:'#f2b705',opacity:0.34,pad:8,dur:0.46}],
    [8.18,'slide','#sender-strip',{from:'left',dist:155,spring:'soft'}],
    [8.98,'words','#sender-lead',{gap:0.22,dist:10}],
    [10.64,'fade','#sender-value',{dur:0.13}],
    [10.64,'highlight','#sender-value',{color:'#f2b705',opacity:0.43,pad:6,dur:0.28}],
    [11.30,'words','#sender-writes',{gap:0.22,dist:10}]
  ],
  update(t,section,$){
    for(const [id,pad,phrase] of [['hi-1',7,'तय booking centres'],['value-1',8,null],['effective-date',7,null],['en-2',7,null],['value-2',8,null],['en-3',7,null]]){
      const el=$('#'+id)[0],r=$('#carry-'+id)[0];
      if(!el||!r)continue;
      let {x,y,width,height}=el.getBBox();
      if(phrase){
        const start=el.textContent.indexOf(phrase);
        let l=Infinity,top=Infinity,right=-Infinity,bottom=-Infinity;
        for(let i=start;i<start+phrase.length;i++){
          const q=el.getExtentOfChar(i);l=Math.min(l,q.x);top=Math.min(top,q.y);
          right=Math.max(right,q.x+q.width);bottom=Math.max(bottom,q.y+q.height);
        }
        if(Number.isFinite(l)){x=l;y=top;width=right-l;height=bottom-top;}
      }
      r.setAttribute('x',x-pad);r.setAttribute('y',y-pad*.5);
      r.setAttribute('width',width+pad*2);r.setAttribute('height',height+pad);
    }
    const value=$('#value-3')[0], line=$('#carry-value-3')[0];
    if(value&&line){
      const phrase='असली value';
      let l=Infinity,r=-Infinity,b=-Infinity;
      for(let i=0;i<phrase.length;i++){
        const q=value.getExtentOfChar(i);
        l=Math.min(l,q.x);r=Math.max(r,q.x+q.width);b=Math.max(b,q.y+q.height);
      }
      if(Number.isFinite(l))line.setAttribute('d','M'+l+' '+(b+4)+' Q'+((l+r)/2)+' '+(b+6)+' '+r+' '+(b+4));
    }
  }
}
</script>
