 <script type="text/scene">
 ({
   camera:[[0,{zoom:1}]],
   shots:[[0,"#twolines"],[3.54,"#map1"]],
   on:[
     [1.94,"pop","#paid-service",{spring:"soft",from:.95}],
     [3.54,"fade","#map1",{dur:.01}],
     [5.54,"fade","#map-row1",{dur:.29}],
     [9.10,"fade","#map-row2",{dur:.29}]
   ],
   update(t,section,$) {
     const ramp=(start,dur)=>Math.max(0,Math.min(1,(t-start)/dur));
     const name=$('#map-name')[0], packing=$('#map-packing')[0], eight=$('#eight')[0];
     if(name) name.style.opacity=ramp(11.42,.20);
     if(packing) packing.style.opacity=ramp(12.24,.20);
     if(eight) {
       const f=Math.sin(Math.PI*ramp(4.42,.47));
       eight.setAttribute('fill',f>.1?'#b26404':'#9e1b1b');
       eight.setAttribute('stroke','#d18d34');
       eight.setAttribute('stroke-width',3*f);
       eight.setAttribute('paint-order','stroke fill');
     }
   }
 })
 </script>
