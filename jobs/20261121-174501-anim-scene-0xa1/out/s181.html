  <script type="text/scene">
  ({
    dur:13.19,
    on:[
      [.04,"fade","#postcard-focus",{dur:.38}],
      [.04,"color","#example-heading-3 rect",{to:"#fde9a6",dur:.38}],
      [2.58,"fade","#postcard-example",{dur:.35}],
      [4.20,"type","#pc-paid",{cps:17}],
      [5.54,"type","#pc-letter",{cps:19}],
      [7.68,"type","#pc-shortfall",{cps:16}],
      [10.98,"type","#pc-double",{cps:22}],
      [11.60,"pop","#postcard-total",{from:.94,spring:"fast"}]
    ],
    update(t, section, $) {
      const smooth=(t,a,b)=>{const p=Math.max(0,Math.min(1,(t-a)/(b-a)));return p*p*(3-2*p);};
      const k=smooth(t,.04,.50), r=smooth(t,12,12.32);
      const dim=(id,d)=>{for(const e of $('#'+id)){e.style.opacity=String(1-.35*d);e.style.filter='grayscale('+(.85*d)+')';}};
      for(const id of ['example-1','example-letter-envelope','example-letter-cross','letter-work']) dim(id,1);
      for(const id of ['example-2','letter-card-focus','card-insert-example','card-work']) dim(id,k);
      dim('letter-total',1-r);
      dim('card-total',k*(1-r));
      const mix=(a,b)=>'rgb('+a.map((v,i)=>Math.round(v+r*(b[i]-v))).join(',')+')';
      for(const id of ['letter-total','card-total','postcard-total']) for(const pill of $('#'+id)) {
        pill.querySelector('text').style.fill=mix([35,90,57],[46,125,79]);
        pill.querySelector('rect').style.stroke=mix([184,213,190],[46,125,79]);
      }
    }
  })
  </script>
