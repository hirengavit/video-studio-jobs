<script type="text/scene">
{
  shots: [[0, '#comparison'], [6.66, '#exam']],
  on: [
    [0.80, 'fade', '#not-proof', {dur: 0.25}],
    [2.06, 'pop', '#unproven-1', {from: 0.95, spring: 'soft'}],
    [3.28, 'pop', '#unproven-2', {from: 0.95, spring: 'soft'}],
    [4.40, 'pop', '#unproven-3', {from: 0.95, spring: 'soft'}],
    [8.28, 'slide', '#exam-row-1', {from: 'left', dist: 42, spring: 'soft'}],
    [9.22, 'highlight', '#exam-row-1-text', {words: '13 alphanumeric', color: '#f2b705', opacity: 0.38, dur: 0.42, pad: 8}],
  ],
  update(t, section, $) {
    if (t >= 6.66) return;
    const el = $('#sms-fact')[0], mark = $('#status-mark')[0], s = el.textContent.indexOf('status');
    let x = Infinity, y = Infinity, right = -Infinity, bottom = -Infinity;
    for (let i = s; i < s + 6; i++) {
      const b = el.getExtentOfChar(i);
      x = Math.min(x, b.x); y = Math.min(y, b.y); right = Math.max(right, b.x + b.width); bottom = Math.max(bottom, b.y + b.height);
    }
    mark.setAttribute('x', x - 8); mark.setAttribute('y', y - 4);
    mark.setAttribute('width', right - x + 16); mark.setAttribute('height', bottom - y + 8);
  }
}
</script>
