 <script type="text/scene">
 ({
  camera:[[0,{zoom:1}]],
  on:[
   [0,"pop","#phone",{from:.92,spring:"soft"}],
   [0,"fade","#ways-phone-label",{dur:.24}],
   [2.48,"pop","#letter",{from:.92,spring:"soft"}],
   [6.20,"fade","#keep-divider-records",{dur:.30}],
   [6.20,"pop","#keep-records",{from:.95,spring:"soft"}],
   [12.60,"fade","#keep-divider-cover",{dur:.30}],
   [12.60,"pop","#keep-cover",{from:.96,spring:"soft"}]
  ],
  update(t,section,$){
   const ease=(at)=>{const x=Math.max(0,Math.min(1,(t-at)/.30));return x*x*(3-2*x)};
   const width=560+540*ease(6.20)+540*ease(12.60);
   $("#keep-card")[0].setAttribute("width",String(width));
   $("#keep-panel-bound")[0].setAttribute("width",String(width-6));
   $("#letter-caption-pair")[0].style.opacity=String(Math.max(0,Math.min(1,(t-2.48)/.24)));
   $("#ways")[0].style.display=t<4.42?"":"none";
   $("#keep")[0].style.display=t<4.42?"none":"";
  }
 })
 </script>
