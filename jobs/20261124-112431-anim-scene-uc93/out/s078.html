<script type="text/scene">
({
 on:[[6.50,"fade","#law-qualifier",{dur:.28}]],
 update(t,section,$) {
  const ramp=(start,dur=.25)=>Math.min(1,Math.max(0,(t-start)/dur));
  const u=ramp(1.90,.50), k=u*u*(3-2*u);
  for(const [id,key,a,b] of [
   ["group-one-card","height",390,100],["group-one-number","y",268,248],["group-one-number","height",91,64],["group-one-index","y",331,297],["students-books","y",326,297],
   ["group-two-card","y",640,350],["group-two-card","height",150,290],["group-two-number","y",669,479],["group-two-index","y",732,542]
  ]){const el=$("#"+id)[0];if(el)el.setAttribute(key,a+(b-a)*k);}
  for(const id of ["student-group-row-1","students-books"]){
   const el=$("#"+id)[0]; if(el){el.style.filter="grayscale("+k+")";el.style.opacity=1-.32*k;}
  }
  for(const id of ["syllabus-qualifier","prescribed-by","boards-chip","universities-chip","gov-bodies-chip","government-footer"]){
   const el=$("#"+id)[0];if(el) el.style.opacity=1-ramp(1.90,.18);
  }
  const tile=$("#group-two-card")[0], badge=$("#group-two-number")[0], num=$("#group-two-index")[0];
  if(tile)tile.setAttribute("fill",t<2.16?"#fbf7ee":"#ffffff");
  if(badge)badge.setAttribute("fill",t<2.16?"#f3ead6":"#9e1b1b");
  if(num)num.setAttribute("fill",t<2.16?"#6f6a63":"#ffffff");
  const label=$("#law-text")[0], band=$("#law-band")[0];
  if(label&&band)band.setAttribute("width",label.getComputedTextLength()+48);
  for(const [id,start] of [["social-word",2.94],["cultural-word",3.68],["religious-word",4.40],["literature-word",5.28]]){
   const el=$("#"+id)[0]; if(el)el.style.opacity=ramp(start,.21);
  }
 }
})
</script>
