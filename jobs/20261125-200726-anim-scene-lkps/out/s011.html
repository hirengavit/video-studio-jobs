    <text id="definition-one" style="font-family:Georgia,Times,serif;font-size:60px" x="200" y="392">Cash on delivery (COD) is a value-added postal service</text>
    <text id="definition-two" style="font-family:Georgia,Times,serif;font-size:60px" x="200" y="473">in which the Post Office</text>
    <text id="definition-three" style="font-family:Georgia,Times,serif;font-size:60px" x="200" y="554">collects a specified amount from the addressee</text>
    <text id="definition-four" style="font-family:Georgia,Times,serif;font-size:60px" x="200" y="635">when delivering an item and remits the amount to the sender.</text>
   </g>
