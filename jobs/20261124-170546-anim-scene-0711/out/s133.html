 <script type="text/scene">

  camera:[[0,{zoom:1}]],
  on:[
   [0,'fade','#insurance-speed',{dur:.25}],
   [2.85,'fade','#registration-tile',{dur:.28}]
  ],
  update(t,section,$){
   // Keep the settled s132 geometry through the insurance phrase, then make room for the fee.
   const v=Math.max(0,Math.min(1,(t-2.18)/.67)), q=v*v*(3-2*v);
   const val=(a,b)=>a+(b-a)*q;
   for(const [id,props] of Object.entries({
    "reg-line":{y:[341,329],height:[136,95],lines:[[396,361,42,36],[449,410,51,46]]},
    "speed-line":{y:[492,432],height:[157,125],lines:[[545,466,42,38],[592,506,38,34],[633,545,38,34]]},
    "delivery-line":{y:[660,565],height:[119,100],lines:[[709,602,40,38],[756,649,40,40]]}
   })){
    const g=$("#"+id)[0], box=g.querySelector("rect");
    box.setAttribute("y",val(...props.y));box.setAttribute("height",val(...props.height));
    [...g.querySelectorAll("text")].forEach((e,i)=>{const [a,b,c,d]=props.lines[i];e.setAttribute("y",val(a,b));e.setAttribute("font-size",val(c,d));});
   }
   for(const id of ["insurance-line","insurance-speed"]) $("#"+id)[0].setAttribute("y",val(823,735));
   const src=$("#general-source")[0], sy=val(843,904);
   src.querySelector("path").setAttribute("d","M151 "+sy+"H649");
   const lines=src.querySelectorAll("text");
   lines[0].setAttribute("y",val(882,938));
   lines[1].setAttribute("y",val(962,975));
   for(const [id,start] of [['#rupees',6.73],['#tax',8.33]]){
    const el=$(id)[0]; if(el) el.style.opacity=Math.min(1,Math.max(0,(t-start)/.20));
   }
  }
 })
