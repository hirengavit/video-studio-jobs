 <script type="text/scene">
 ({
  camera:[[0,{zoom:1}]],
  on:[[3.19,"fade","#tariff-exam",{dur:.18}]],
  update(t,section,$){
    const tax=$("#tax-emphasis")[0];
    const p=Math.max(0,Math.min(1,(t-1.38)/.60));
    if(tax)tax.style.opacity=t>=5.17?1:(t>=1.38&&t<1.98?Math.sin(Math.PI*p):0);
    $("#tariff-exam-gate")[0]?.setAttribute("visibility",t<3.19?"hidden":"visible");
    const trap=$("#tariff-trap")[0];
    if(trap)trap.style.display=t>=3.19?"none":"";
    const clamp=x=>Math.max(0,Math.min(1,x));
    const focus=Math.min(clamp((t-5.17)/.22),clamp((7.46-t)/.16));
    const k=1+focus/20;
    $("#tariff-tax-strip")[0]?.setAttribute("transform","translate(487 261) scale("+k+") translate(-487 -261)");
    $("#slab-band-4")[0]?.setAttribute("opacity",String(1-clamp((t-1.30)/.18)));
    $("#slab-band-1")[0]?.setAttribute("opacity",t>=8.13&&t<9.75?"1":"0");
    $("#slab-band-7")[0]?.setAttribute("opacity",t>=9.75?"1":"0");
  }
 })
 </script>
