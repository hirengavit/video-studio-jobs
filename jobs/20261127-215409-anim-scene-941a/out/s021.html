<script type="text/scene">
{camera:[[0,{zoom:1}]],shots:[[0,"#reg105"],[4.74,"#reg104"]],on:[
[0.66,"highlight","#definition-line-3",{words:"or an officer",color:"#fde9a6",opacity:1,dur:0.33,pad:3}],
[2.36,"highlight","#definition-line-4",{words:"exercising those powers",color:"#fde9a6",opacity:1,dur:0.33,pad:3}],
[2.68,"underline","#definition-line-5",{words:"in the Circle.",color:"#c78e00",width:3.4,dur:0.35,gap:-6}],
[5.22,"type","#epayment",{cps:23}],
[5.56,"fade","#reg104-divider",{dur:0.25}],
[5.72,"fade","#epayment-hi",{dur:0.27}],
[6.20,"stamp","#reg104-postmark",{from:1.23,rot:-6}]
],
update(t, section, $) {
  if (t >= 4.74) return;
  for (const [id, phrase, pad] of [["point-1-line-1","administrative instructions",4],["point-2-line-1","agreement",4],["point-3-line-1","Circle Head",4],["point-4-line-1","administrative instructions",4],["definition-line-2","Chief Postmaster General",3]]) {
    const text = $("#"+id)[0], mark = $("#carry-"+id)[0];
    const start = text.textContent.indexOf(phrase);
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (let i = start; i < start + phrase.length; i++) {
      const box = text.getExtentOfChar(i);
      x0 = Math.min(x0, box.x); y0 = Math.min(y0, box.y);
      x1 = Math.max(x1, box.x + box.width); y1 = Math.max(y1, box.y + box.height);
    }
    if (Number.isFinite(x0) && x1 > x0) {
      mark.setAttribute("x", x0-pad); mark.setAttribute("y", y0-pad/2);
      mark.setAttribute("width", x1-x0+2*pad); mark.setAttribute("height", y1-y0+pad);
    }
  }
}}
</script>
