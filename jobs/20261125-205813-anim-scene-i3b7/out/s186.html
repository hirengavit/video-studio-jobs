<script type="text/scene">
({
 camera:[[0,{zoom:1}]],
 on:[
  [.16,"fade","#fraud-money-return",{dur:.22}],
  [3.43,"fade","#counter-no-refund",{dur:.25}],
  [8.06,"draw","#counter-no-refund-cross",{dur:.20}]
 ],
 update(t,section,$) {
   const u=Math.max(0,Math.min(1,t/.24)), a=u*u*(3-2*u);
   const box=$("#article-return-base")[0], first=$("#article-return-first")[0], dot=$("#article-return-separator")[0];
   if(box){box.setAttribute("y",900-9*a);box.setAttribute("height",90+26*a);}
   if(first)first.setAttribute("y",964-28*a);
   if(dot)dot.style.opacity=String(Math.max(0,Math.min(1,(t-.16)/.22)));
 }
})
</script>
