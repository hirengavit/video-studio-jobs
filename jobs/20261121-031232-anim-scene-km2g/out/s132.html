<section class="vs-scene" id="s132" data-in="cut" data-section="KEY POINTS" data-series="LETTER BOXES" lang="hi">

  <text id="key-heading" x="140" y="216" class="hi" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-size="61" font-weight="820" fill="#9e1b1b">सबसे ज़रूरी बातें</text>

      <path id="p3-first-rule" d="M726 447h1008" stroke="#eee4d3" stroke-width="3" stroke-linecap="round"/>
      <path d="M726 610h1008m-1008 175h1008" stroke="#eee4d3" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="p3-stamp">
      <rect x="140" y="271" width="460" height="700" rx="29" fill="#e4bc96"/>
      <rect x="140" y="260" width="460" height="700" rx="29" fill="#9e1b1b"/>
      <rect x="158" y="278" width="424" height="664" rx="19" fill="none" stroke="#fde9a6" stroke-opacity=".82" stroke-width="9" stroke-linecap="round" stroke-dasharray="0 22"/>
      <circle cx="370" cy="493" r="120" fill="#821515" stroke="#d9786e" stroke-width="2.5"/>
      <text id="p3-number" x="370" y="562" text-anchor="middle" font-family="Inter,sans-serif" font-size="185" font-weight="820" fill="#fff">3</text>
      <path d="M213 646h314" stroke="#e5a39a" stroke-width="2"/>
      <text id="p3-title" x="370" y="727" text-anchor="middle" class="hi" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-size="57" font-weight="820" fill="#fff">समय और</text>
      <text id="p3-hour-plate" x="370" y="790" text-anchor="middle" font-family="Inter, sans-serif" font-size="56" font-weight="820" fill="#fff">hour plate</text>
    </g>
    <g id="p3-row-1">
      <g id="timing-clearance">
        <use href="piece:clock-face" transform="translate(736 279) scale(.32)"/>
        <text x="831" y="336" font-family="Inter,sans-serif" font-size="44" font-weight="800" fill="#2b2622">Clearance</text>
      </g>
      <g id="timing-dispatch">
        <use href="piece:clock-face" transform="translate(1085 279) scale(.32)"/>
        <text x="1180" y="336" font-family="Inter,sans-serif" font-size="44" font-weight="800" fill="#2b2622">Dispatch</text>
      </g>
      <g id="timing-arrival">
        <use href="piece:clock-face" transform="translate(1391 279) scale(.32)"/>
        <text x="1486" y="336" class="hi" font-family="'Noto Sans Devanagari',Inter,sans-serif" font-size="48" font-weight="800" fill="#2b2622">आना</text>
      </g>
      <g id="punctual-fact">
        <text x="738" y="401" font-family="Inter,sans-serif" font-size="45" font-weight="760" fill="#2b2622">Clearance:</text>
        <rect x="993" y="352" width="221" height="66" rx="4" fill="#fde9a6" opacity=".75"/>
        <text id="punctual" x="1002" y="401" font-family="Inter,sans-serif" font-size="46" font-weight="810" fill="#2b2622">punctual</text>
      </g>
      <path id="p3-row-1-tick" d="m1678 350 17 17 33-40" fill="none" stroke="#2e7d4f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="p3-row-2">
      <g id="next-hour-plate">
        <use href="piece:hour-plate" transform="translate(740 494) scale(.8)"/>
        <text x="812" y="538" text-anchor="middle" font-family="Inter,sans-serif" font-size="34" font-weight="800" fill="#2b2622">10:00</text>
      </g>
      <text id="next-time" x="915" y="543" class="hi" font-family="'Noto Sans Devanagari',Inter,sans-serif" font-size="51" font-weight="770" fill="#2b2622">अगली clearance का समय</text>
      <path id="p3-row-2-tick" d="m1678 525 17 17 33-40" fill="none" stroke="#2e7d4f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="p3-row-3">
      <g id="custody-key">
        <use href="piece:box-key" transform="translate(714 547) scale(.50)"/>
      </g>
      <g id="custody-plate">
        <use href="piece:hour-plate" transform="translate(740 685) scale(.8)"/>
        <text x="812" y="729" text-anchor="middle" font-family="Inter,sans-serif" font-size="34" font-weight="800" fill="#2b2622">10:00</text>
      </g>
      <g id="custody-copy" fill="#2b2622" font-weight="790">
        <text x="900" y="669" font-family="Inter,sans-serif" font-size="44"><tspan id="custody-word">custody:</tspan> <tspan id="custody-postmaster" x="1104">Postmaster</tspan></text>
        <text id="custody-assistant" x="900" y="737" font-family="Inter,sans-serif" font-size="44">/ responsible Assistant</text>
      </g>
      <g id="round-bag">
        <rect x="1427" y="641" width="234" height="113" rx="24" fill="#fde9a6"/>
        <text x="1544" y="685" text-anchor="middle" class="hi" font-family="'Noto Sans Devanagari',Inter,sans-serif" font-size="44" font-weight="760" fill="#694700"><tspan x="1544">+ round</tspan> <tspan id="bag-plus" x="1544" dy="52" font-weight="780">के लिए bag</tspan></text>
      </g>
      <path id="p3-row-3-tick" d="m1678 700 17 17 33-40" fill="none" stroke="#2e7d4f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="p3-row-4">
      <text id="last-box" x="738" y="843" class="hi" font-family="'Noto Sans Devanagari',Inter,sans-serif" font-size="53" font-weight="820" fill="#2b2622">आखिरी box</text>
      <path id="return-arrow" d="M742 891h58m-15-13 15 13-15 13" fill="none" stroke="#9e1b1b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text id="quick-return" x="826" y="907" class="hi" font-family="'Noto Sans Devanagari',Inter,sans-serif" font-size="47" font-weight="740" fill="#2b2622">बिना देर लौटना</text>
    </g>
  </g>
</svg>
<script type="text/scene">
{
 camera:[[0,{zoom:1}]],
 update(t,section,$) {
  for (const [id, start, dur] of [['custody-postmaster',1.62,.23],['custody-word',4.30,.23],['bag-plus',7.08,.22]]) {
    const el = $('#' + id)[0];
    if (el) el.setAttribute('opacity', Math.max(0, Math.min(1, (t - start) / dur)));
  }
  for (const [id,hx,hy,mx,my] of [
    ['#timing-clearance',96,110,130,72],
    ['#timing-dispatch',140,92,130,188],
    ['#timing-arrival',168,125,72,130]
  ]) {
    const clock = $(id)[0];
    const hour = clock?.querySelector('#hour-hand,[id$="-hour-hand"]');
    const minute = clock?.querySelector('#minute-hand,[id$="-minute-hand"]');
    hour?.setAttribute('d','M130 130L'+hx+' '+hy);
    minute?.setAttribute('d','M130 130L'+mx+' '+my);
  }
 },
 on:[
  [0,'fade','#custody-key',{dur:.22}],
  [.70,'fade','#custody-plate',{dur:.22}],
  [2.72,'fade','#custody-assistant',{dur:.22}],
  [4.30,'draw','#p3-row-3-tick',{dur:.29}],
  [6.14,'fade','#round-bag',{dur:.22}],
  [8.34,'fade','#last-box',{dur:.23}],
  [10.26,'draw','#return-arrow',{dur:.23}],
  [10.98,'fade','#quick-return',{dur:.22}]
 ]
}
</script>
</section>
