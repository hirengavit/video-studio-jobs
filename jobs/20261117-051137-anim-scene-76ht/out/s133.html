<script type="text/scene">
({
 update(t,section,$) {
   const down = Math.max(0,Math.min(1,t/.4));
   const transfer = Math.max(0,Math.min(1,(t-3.92)/.4));
   const weight=[1-transfer,1-down+transfer,1-down];
   for (const [i,id] of ['one','two','three'].entries()) for (const kind of ['condition','action']) {
     const el = $('#branch-'+id+'-'+kind)[0]?.querySelector('rect');
     if (!el) continue;
     const p = kind === 'condition' ? weight[i] : 1-down;
     el.setAttribute('stroke-width', String(3 + 2*p));
   }
 },
 on:[
   [0.00,'color','#branch-two-condition-surface',{to:'#ead9a8',prop:'stroke',dur:.4}],
   [0.00,'color','#branch-three-condition-surface',{to:'#ead9a8',prop:'stroke',dur:.4}],
   [0.00,'color','#branch-one-action-surface',{to:'#ead9a8',prop:'stroke',dur:.4}],
   [0.00,'color','#branch-two-surface',{to:'#ead9a8',prop:'stroke',dur:.4}],
   [0.00,'color','#branch-three-action-surface',{to:'#ead9a8',prop:'stroke',dur:.4}],
   [0.00,'color','#branch-one-condition-surface',{to:'#f2b705',prop:'stroke',dur:.4}],
   [1.98,'draw','#sender-return-underline',{dur:.35}],
   [3.92,'color','#branch-one-condition-surface',{to:'#ead9a8',prop:'stroke',dur:.4}],
   [3.92,'color','#branch-two-condition-surface',{to:'#f2b705',prop:'stroke',dur:.4}],
   [5.02,'color','#sender-return-underline',{to:'#6f6a63',prop:'stroke',dur:.36}],
   [5.02,'draw','#pin-removal-underline',{dur:.36}],
   [6.72,'pulse','#rlo',{amount:.10}]
 ]
})
