 <script type="text/scene">
 ({

   if(bg)bg.setAttribute("fill","rgb("+[227,241,232].map(v=>Math.round(255+(v-255)*g)).join(",")+")");
   for(const [id,at] of [["#sum-length",8.52],["#sum-plus",9.00],["#sum-factor",9.96],["#sum-diameter",10.70]]){
    const el=$(id)[0];if(el)el.style.opacity=ramp(at,.20);
   }
  }
 })
