<script type="text/scene">
{
 camera:[[0,{zoom:1}]],
 on:[

  [6.36,'fade','#minimum-charge',{dur:.23}],
  [7.38,'draw','#p2-row-3-tick',{dur:.28}]
 ],

 }
}
