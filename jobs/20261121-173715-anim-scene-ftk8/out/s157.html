<script type="text/scene">
({
  dur:8.70,
  update(t,section,$) {
    const rate=Math.max(0,Math.min(1,t/.34)), e=rate*rate*(3-2*rate);
    for(const el of $("#quick-processing")) {
      el.setAttribute("transform","translate(0 "+(-22*e)+") translate(806 394) scale("+(1-.15*e)+") translate(-806 -394)");

    for(const el of $("#no-extra-qms")) el.setAttribute("transform","translate(0 "+(-45*e)+")");
  },
  on:[
    [.36,"fade","#destination",{dur:.26}],
    [4.58,"pulse","#conditional-airlift",{amount:.018}],
    [5.10,"fade","#not-automatic",{dur:.24}],
    [7.56,"fade","#not-right-cross",{dur:.18}],
    [7.56,"strike","#not-automatic-text",{words:"हक",color:"#4b4f58",width:5,dur:.25,dim:1}]

})
