  </g>
</g>
</svg>
<script type="text/scene">
{
  update(t, section, $) {
    const clamp = n => Math.max(0,Math.min(1,n));
    const ease = k => k*k*(3-2*k);
    const v = ease(clamp((t-.13)/.79));
    $('#airmail-box')[0]?.setAttribute('transform','translate('+(-120*v)+' 0)');
    $('#quick-mail-box')[0]?.setAttribute('transform','translate('+(-280*v)+' 0)');
    const wrong = $('#wrong-parcel')[0];
    const approach = ease(clamp((t-.80)/.52));
    const enter = ease(clamp((t-1.32)/.29));
    if (wrong) {
      wrong.setAttribute('transform','translate('+(243+277*approach)+' '+(503+6*approach)+') scale('+(1-.58*enter)+')');
      wrong.setAttribute('opacity',t<.80 ? 0 : (1-enter)*clamp((t-.80)/.11));
      const packet=wrong.querySelector('g[id$="-packet"],g[id="packet"]');
      if(packet) packet.querySelectorAll('[fill]').forEach(el=>{
        const colors={'#c9a978':'#6f7178','#e8d0a3':'#a8aab0','#b9976d':'#62646d'};
        const replacement=colors[el.getAttribute('fill')];
        if(replacement) el.setAttribute('fill',replacement);
      });
    }
  },
  on:[
    [3.34,'pop','#detention',{from:.95,spring:'soft'}],
    [3.84,'fade','#detention-hi',{dur:.24}],
    [5.80,'underline','#detention-hi',{color:'#c9962b',width:6,gap:8,dur:.36}],
    [6.72,'fade','#seizure',{dur:.25}],
    [10.22,'strike','#seizure-text',{color:'#4b4f58',width:7,dur:.33}]
  ]
}
</script>
</section>
