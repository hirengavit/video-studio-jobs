<script type="text/scene">
({
 camera:[[0,{zoom:1}]],
 on:[
  [.76,"fade","#paid-days",{dur:.28}],
  [6.46,"draw","#paid-cross",{dur:.33}],
  [6.46,"fade","#fee-exempt",{dur:.25}],
  [9.48,"reveal","#limit-band",{from:"left",dur:.39}]
 ],
 update(t,section,$){
  const w=$("#weight-readout")[0];
  w.textContent=t>=2.78?"500 g":"600 g";
  const u=S.clamp(Math.abs(t-2.78)/.12,0,1);
  w.setAttribute("opacity",u);
  for(let n=1;n<=12;n++){
   const el=$("#tile-"+n)[0];
   if(el)el.setAttribute("fill",n<=7?"#dcefe3":((t>=.76+(n-8)*.05&&t<6.46)?"#ffdf78":"#fff"));
  }
  $("#paid-days")[0].setAttribute("filter",t>=6.46?"grayscale(1)":"none");
 }
})
</script>
