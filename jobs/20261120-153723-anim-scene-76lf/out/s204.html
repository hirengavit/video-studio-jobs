<script type="text/scene">
{
  update(t, section, $) {
    for (const row of [2, 3]) {
      const value = $('#paper-value-' + row)[0];
      const unit = $('#paper-unit-' + row)[0];
      const width = value.getComputedTextLength();
      if (width > 0) unit.setAttribute('x', Number(value.getAttribute('x')) + width + 14);
    }
  },
  on: [
    [0, 'fade', '#paper-label-2', {dur:.25}],
    [1.42, 'pop', '#paper-pill-2', {from:.96}],
    [2.02, 'fade', '#paper-unit-2', {dur:.24}],
    [2.02, 'draw', '#p2-tick-2', {dur:.29}],
    [3.28, 'fade', '#paper-label-3', {dur:.24}],
    [4.80, 'pop', '#paper-pill-3', {from:.96}],
    [6.10, 'fade', '#paper-unit-3', {dur:.25}],
    [7.00, 'draw', '#p2-tick-3', {dur:.30}]
  ]
}
