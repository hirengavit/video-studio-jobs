   [7.54,'fade','#working-difference',{dur:.22}],
   [8.44,'fade','#worked-recovery',{dur:.22}],
   [9.24,'fade','#working-double',{dur:.20}],
   [9.94,'fade','#recovery-result',{dur:.16}],[9.94,'pulse','#recovery-result',{amount:.045,dur:.28}]
  ],update(t,section,$){
   const u=Math.min(1,Math.max(0,t/.75)), q=u*u*(3-2*u);
   const e=id=>$("#"+id)[0];
   const shell=e("breach-example-shell");
   if(shell){shell.setAttribute("y",200-10*q);shell.setAttribute("height",760+40*q);}
   for(const [id,delta,h0,h1] of [["worked-booking",-39,95,73],["worked-found",-74,86,65],["gyan-payment",-107,76,68],["local-parcel",-112,76,68]]){
    const g=e(id);if(g){g.setAttribute("transform","translate(0 "+delta*q+")");const box=g.querySelector("rect");if(box)box.setAttribute("height",h0+(h1-h0)*q);for(const txt of g.querySelectorAll("text"))txt.setAttribute("transform","translate(0 "+((h1-h0)/2*q)+")");}
   }
   for(const [id,delta] of [["gyan-payment-value",-111],["parcel-value-pos",-116]]){const a=e(id);if(a)a.setAttribute("transform","translate(0 "+delta*q+")");}
  }
 })
 </script>
