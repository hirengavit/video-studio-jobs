 <script type="text/scene">
 ({
  camera:[[0,{zoom:1}]],
  on:[
   [.30,"slide","#notice-slide",{from:"down",dist:15,spring:"soft"}],
   [7.50,"fade","#collection-caption",{dur:.24}]
  ],
  update(t,section,$) {
    const put=$("#notice-pulse")[0], label=$("#third-label")[0], line=$("#third-settled-strike")[0];
    if(put) {
      const u=Math.max(0,Math.min(1,(t-7.50)/.50));
      const k=1+.06*Math.sin(Math.PI*u);
      put.setAttribute("transform","translate(1603 933) scale("+k+") translate(-1603 -933)");
    }
    if(label && line) {
      const b=label.getBBox(), y=b.y+b.height*.55, w=b.height*.06;
      if(b.width) {
        line.setAttribute("d","M"+(b.x-6)+" "+y+" Q"+(b.x+b.width/2)+" "+(y+w)+" "+(b.x+b.width+6)+" "+(y-w*.5));
        line.setAttribute("stroke-width",String(Math.max(4,b.height*.09)));
      }
    }
  }
 })
 </script>
