      [4.60,"slide","#postcard-example",{from:"down",dist:52,spring:"soft"}],
      [6.38,"slide","#book-post-example",{from:"down",dist:52,spring:"soft"}],
      [7.56,"pop","#separate-products",{from:.9}],
      [7.67,"highlight","#separate-products-label",{color:"#fde9a6",opacity:.95,pad:6,dur:.45}]
    ],
    update(t,section,$) {
      const f=Math.min(1,Math.max(0,t/1.2));
      const k=f*f*(3-2*f);
      for(const el of $("#term")) el.setAttribute("transform","translate("+(239.5*k)+" "+(-37*k)+") scale("+(1-.25*k)+")");
    }
  })
  </script>
