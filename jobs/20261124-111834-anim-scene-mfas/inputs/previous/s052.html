 </svg>
 <script type="text/scene">
 ({
  on:[
   [1.22,'draw','#weight-blocks',{dur:.55}],
   [3.20,'fade','#part-counted',{dur:.20}],
   [3.94,'fade','#whole-block',{dur:.29}],
   [6.58,'fade','#example-title',{dur:.24}]
  ],
  update(t,section,$){
   const u=Math.max(0,Math.min(1,(t-3.94)/.57));
   const fill=$('#part-counted')[0];
   if(fill) fill.setAttribute('width',20+212*(u*u*(3-2*u)));
   const title=$('#example-title')[0];
   if(title){
    const r=Math.max(0,Math.min(1,(t-6.58)/.81));
    title.textContent=Math.round(125*r)+' g · हवा से';
   }
  }
 })
 </script>
</section>
