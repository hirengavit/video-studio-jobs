  <script type="text/scene">
  {
    update(t, section, $) {
      const ease=x=>{ const u=Math.min(1,Math.max(0,x)); return u*u*(3-2*u); };
      const a=ease((t-.20)/.50)*(1-ease((t-4.28)/.35));
      const ink=[111,106,99].map((base,i)=>Math.round(base+([43,38,34][i]-base)*a));
      for(const el of $('#eq1 text, #eq2, #first-result')) el.setAttribute('fill','rgb('+ink.join(',')+')');
    },
    on: [
      [0,'fade','#length-highlight',{dur:.28}],
      [0,'fade','#length-pass',{dur:.28}],
      [4.28,'pop','#fail-cross',{from:.84}],
      [5.26,'stamp','#fail-verdict',{from:1.10,rot:0}],
      [7.22,'draw','#total-underline',{dur:.35}],
      [7.22,'fade','#total-over',{dur:.30}]
    ]
  }
  </script>
