 <script type="text/scene">
 ({
  camera:[[0,{zoom:1}]],
  on:[
   [0,"highlight","#cdf1",{words:"90 दिन",color:"#fde9a6",opacity:1,pad:5,dur:.001}],
   [.02,"fade","#exam-row3-in",{dur:.20}],
   [.02,"slide","#exam-row3",{from:"left",dist:40,spring:"soft"}],
   [4.94,"fade","#exam-row4-in",{dur:.20}],
   [4.94,"slide","#exam-row4",{from:"left",dist:40,spring:"soft"}],
   [7.04,"fade","#exam-row5-in",{dur:.20}],
   [7.04,"slide","#exam-row5",{from:"left",dist:40,spring:"soft"}]
  ],
  update(t,section,$){
   const u=Math.max(0,Math.min(1,t/.32)), k=u*u*(3-2*u);
   for(const id of ["#exam-row1","#exam-row2"]){
    const row=$(id)[0];
    if(row){row.style.filter="grayscale("+k+")";row.style.opacity=1-.15*k;}
   }
   const mark=$("#exam-row2 [data-vs-mark]")[0], line=$("#cdf1")[0];
   if(mark&&line){
    if(t<=.001){
     const i=line.textContent.indexOf("90 दिन"); let left=Infinity,right=-Infinity;
     for(let j=i;j<i+6;j++){try{const b=line.getExtentOfChar(j);left=Math.min(left,b.x);right=Math.max(right,b.x+b.width);}catch{}}
     if(Number.isFinite(left))mark.setAttribute("width",String(right-left+10));
    }
    mark.style.opacity=1-k;
   }
  }
 })
 </script>
