<section class="vs-scene" id="question-card" data-in="fade" data-in-dur="0.4" data-section="Ancient history">

  {
    on: [
      [0.05, 'fade', '#card', {dur: 0.4}],
      [0.35, 'tracking', '#label', {from: 30, dur: 0.7}],

      [1.8, 'words', '#q2', {gap: 0.11}],
      [3.0, 'fade', '#ring', {dur: 0.3}],
      [3.0, 'draw', '#arc', {dur: 2.6, ease: 'linear'}],
      [5.7, 'out', '#ring'],
      [5.7, 'out', '#arc'],
      [5.8, 'pop', '#answer', {from: 0.85, spring: 'soft'}],
    ],
  }
