    <text id="lead" x="236" y="430" font-family="Georgia, serif" font-style="italic" font-size="44" fill="#6f6a63">“Every Government servant shall at all times—</text>

    <text id="q3" x="296" y="664" font-family="Georgia, serif" font-size="56" fill="#2b2622">(iii) do nothing which is unbecoming</text>
    <text id="q4" x="376" y="740" font-family="Georgia, serif" font-size="56" fill="#2b2622">of a Government servant.”</text>
