<section class="vs-scene" id="myth-fact" data-in="fade" data-in-dur="0.4" data-section="अंग्रेज़ी व्याकरण">

    <text id="myth" x="236" y="390" font-family="Inter, sans-serif" font-size="60" font-weight="800" fill="#2b2622">“Each of the students have a book.”</text>
    <text id="mythhi" x="236" y="458" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-size="38" font-weight="600" fill="#6f6a63">students बहुवचन है, तो verb भी बहुवचन?</text>
    <g id="cross">

      <rect x="160" y="540" width="1600" height="420" rx="28" fill="#f3ead6"/>
      <rect x="236" y="580" width="150" height="62" rx="31" fill="#2e7d4f"/>
      <text x="311" y="623" text-anchor="middle" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-size="34" font-weight="800" fill="#ffffff">तथ्य</text>
    </g>
    <text id="fact1" x="236" y="740" font-family="Inter, sans-serif" font-size="64" font-weight="800" fill="#2b2622">Each of the students has a book.</text>
    <text id="fact2" x="236" y="822" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-size="42" font-weight="700" fill="#2b2622">कर्ता (subject) ‘Each’ है, और वह एकवचन है</text>
    <text id="fact3" x="236" y="892" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-size="38" font-weight="600" fill="#6f6a63">इसलिए verb भी एकवचन: has</text>
