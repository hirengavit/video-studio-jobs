<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
<title>stamp-album</title>
<defs>
<mask id="sal-outer" maskUnits="userSpaceOnUse" x="-10" y="-10" width="100" height="120">
<rect x="-10" y="-10" width="100" height="120" fill="#fff"/>
<rect x="0" y="0" width="80" height="100" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round" stroke-dasharray="0 10"/>
</mask>
<mask id="sal-inner" maskUnits="userSpaceOnUse" x="-10" y="-10" width="100" height="120">
<rect x="-10" y="-10" width="100" height="120" fill="#fff"/>
<rect x="0" y="0" width="80" height="100" fill="none" stroke="#000" stroke-width="11" stroke-linecap="round" stroke-dasharray="0 10"/>
</mask>
<g id="sal-stamp">
<rect x="0" y="0" width="80" height="100" fill="#2b2622" mask="url(#sal-outer)"/>
<rect x="2" y="2" width="76" height="96" fill="#ffffff" mask="url(#sal-inner)"/>
<rect x="11" y="11" width="58" height="78" rx="2" fill="#f3ead6" stroke="#2b2622" stroke-width="1.5"/>
</g>
</defs>
