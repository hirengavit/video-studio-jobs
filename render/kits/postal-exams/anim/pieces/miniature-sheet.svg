<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
<title>miniature-sheet</title>
<defs>
<pattern id="msh-diamond" patternUnits="userSpaceOnUse" x="30" y="30" width="32" height="32">
<path d="M16 9 L23 16 L16 23 L9 16 Z" fill="#ead9a8"/>
</pattern>
<mask id="msh-outer" maskUnits="userSpaceOnUse" x="-20" y="-20" width="240" height="280">
<rect x="-20" y="-20" width="240" height="280" fill="#fff"/>
<rect x="0" y="0" width="200" height="240" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round" stroke-dasharray="0 20"/>
</mask>
<mask id="msh-inner" maskUnits="userSpaceOnUse" x="-20" y="-20" width="240" height="280">
<rect x="-20" y="-20" width="240" height="280" fill="#fff"/>
<rect x="0" y="0" width="200" height="240" fill="none" stroke="#000" stroke-width="17" stroke-linecap="round" stroke-dasharray="0 20"/>
</mask>
<g id="msh-stamp">
<rect x="0" y="0" width="200" height="240" fill="#2b2622" mask="url(#msh-outer)"/>
<rect x="2.5" y="2.5" width="195" height="235" fill="#ffffff" mask="url(#msh-inner)"/>
<rect x="24" y="24" width="152" height="192" rx="2" fill="#f3ead6" stroke="#2b2622" stroke-width="1.5"/>
</g>
</defs>
<rect id="sheet" x="3" y="3" width="894" height="594" rx="4" fill="#ffffff" stroke="#ead9a8" stroke-width="6"/>
<g id="margin-band">
<path fill-rule="evenodd" fill="#f3ead6" d="M28 28 H872 V572 H28 Z M64 64 V536 H836 V64 Z"/>
<path id="band-motif" fill-rule="evenodd" fill="url(#msh-diamond)" d="M30 30 H870 V570 H30 Z M62 62 V538 H838 V62 Z"/>
</g>
<rect id="title" x="120" y="86" width="660" height="66" rx="6" fill="#fbf7ee" stroke="#ead9a8" stroke-width="2"/>
<g id="stamps">
<g id="ms-stamp-1"><use href="#msh-stamp" x="120" y="186"/></g>
<g id="ms-stamp-2"><use href="#msh-stamp" x="350" y="186"/></g>
<g id="ms-stamp-3"><use href="#msh-stamp" x="580" y="186"/></g>
</g>
<circle data-anchor="base" cx="450" cy="600" r="0"/>
<circle data-anchor="top" cx="450" cy="0" r="0"/>
<circle data-anchor="title" cx="450" cy="119" r="0"/>
</svg>
