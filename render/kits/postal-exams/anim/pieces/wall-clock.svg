<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <g id="clock">
    <circle id="face" cx="200" cy="200" r="127" fill="#fbf7ee" stroke="#2b2622" stroke-width="6"/>
    <circle cx="200" cy="200" r="116" fill="none" stroke="#2b2622" stroke-opacity="0.15" stroke-width="2"/>
    <g id="ticks" stroke="#2b2622" stroke-linecap="round">
      <path d="M200,84 L200,104" stroke-width="5"/>
      <path d="M258,99.5 L253,108.2" stroke-width="3"/>
      <path d="M300.5,142 L291.8,147" stroke-width="3"/>
      <path d="M316,200 L296,200" stroke-width="5"/>
      <path d="M300.5,258 L291.8,253" stroke-width="3"/>
      <path d="M258,300.5 L253,291.8" stroke-width="3"/>
      <path d="M200,316 L200,296" stroke-width="5"/>
      <path d="M142,300.5 L147,291.8" stroke-width="3"/>
      <path d="M99.5,258 L108.2,253" stroke-width="3"/>
      <path d="M84,200 L104,200" stroke-width="5"/>
      <path d="M99.5,142 L108.2,147" stroke-width="3"/>
      <path d="M142,99.5 L147,108.2" stroke-width="3"/>
    </g>
    <!-- hands point to 12 at rest; turn them with rotate(deg) about the centre (200, 200) -->
    <g id="hand-hour" style="transform-box:view-box;transform-origin:200px 200px">
      <path d="M200,212 L200,138" stroke="#2b2622" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g id="hand-min" style="transform-box:view-box;transform-origin:200px 200px">
      <path d="M200,216 L200,106" stroke="#2b2622" stroke-width="5" stroke-linecap="round"/>
    </g>
    <circle id="centre-dot" cx="200" cy="200" r="8" fill="#9e1b1b" stroke="#2b2622" stroke-width="3"/>
  </g>
  <circle data-anchor="top" cx="200" cy="70" r="0"/>
  <circle data-anchor="base" cx="200" cy="330" r="0"/>
</svg>
