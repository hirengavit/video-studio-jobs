<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300" width="260" height="300">
  <!-- Ink stopwatch: cream face, postal-red rim and crown button, twelve ticks, one hand.
       The hand points to 12 and turns about the "pivot" anchor (130,180). -->
  <g stroke="#2b2622" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <g id="crown">
      <rect x="120" y="40" width="20" height="28" rx="2" fill="#f3ead6"/>
      <rect x="102" y="20" width="56" height="22" rx="7" fill="#9e1b1b"/>
    </g>
    <g id="rim">
      <circle cx="130" cy="180" r="112.5" fill="#9e1b1b"/>
    </g>
    <g id="face">
      <circle cx="130" cy="180" r="104" fill="#fbf7ee"/>
    </g>
    <g id="ticks" fill="none">
      <path d="M130 86 V98"/>
      <path d="M177 98.6 L171 109"/>
      <path d="M211.4 133 L201 139"/>
      <path d="M224 180 H212"/>
      <path d="M211.4 227 L201 221"/>
      <path d="M177 261.4 L171 251"/>
      <path d="M130 274 V262"/>
      <path d="M83 261.4 L89 251"/>
      <path d="M48.6 227 L59 221"/>
      <path d="M36 180 H48"/>
      <path d="M48.6 133 L59 139"/>
      <path d="M83 98.6 L89 109"/>
    </g>
    <g id="hand">
      <path d="M130 192 V104" fill="none" stroke-width="5"/>
      <circle cx="130" cy="180" r="8" fill="#2b2622"/>
    </g>
  </g>
  <circle data-anchor="pivot" cx="130" cy="180" r="0"/>
  <circle data-anchor="top" cx="130" cy="20" r="0"/>
  <circle data-anchor="base" cx="130" cy="294" r="0"/>
</svg>
