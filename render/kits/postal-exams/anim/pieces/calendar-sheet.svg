<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300" width="260" height="300">
  <g id="sheet" stroke="#2b2622" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect id="body" x="6" y="22" width="248" height="272" rx="10" fill="#ffffff"/>
    <!-- blank postal-red header strip -->
    <path id="header" d="M6,32 Q6,22 16,22 L244,22 Q254,22 254,32 L254,88 L6,88 Z" fill="#9e1b1b"/>
    <!-- tear-off perforation under the header -->
    <path d="M18,98 L242,98" stroke="#6f6a63" stroke-width="2" stroke-dasharray="2 8" fill="none"/>
    <!-- binding rings -->
    <g id="rings" fill="none" stroke-width="4">
      <path d="M78,36 L78,14 Q78,6 86,6 Q94,6 94,14 L94,36"/>
      <path d="M166,36 L166,14 Q166,6 174,6 Q182,6 182,14 L182,36"/>
    </g>
    <circle cx="86" cy="38" r="5" fill="#7d1414" stroke-width="2"/>
    <circle cx="174" cy="38" r="5" fill="#7d1414" stroke-width="2"/>
  </g>
  <!-- blank writing area for the scene's day or date: x 20-240, y 110-280 -->
  <rect id="date-area" x="20" y="110" width="220" height="170" fill="none" stroke="none"/>
  <circle data-anchor="top" cx="130" cy="6" r="0"/>
  <circle data-anchor="base" cx="130" cy="294" r="0"/>
</svg>
