<line x1="228" y1="202" x2="264" y2="240" stroke="#f3ead6" stroke-width="15" stroke-linecap="round"/>
<circle id="lens" cx="180" cy="146" r="64" fill="#fde9a6" fill-opacity="0.55"/>
