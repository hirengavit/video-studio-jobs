<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
<title>magnifier-stamp-icon</title>
<defs>
<mask id="msi-outer" maskUnits="userSpaceOnUse" x="-14" y="-14" width="168" height="168">
<rect x="-14" y="-14" width="168" height="168" fill="#fff"/>
<rect x="0" y="0" width="140" height="140" fill="none" stroke="#000" stroke-width="10" stroke-linecap="round" stroke-dasharray="0 14"/>
</mask>
<mask id="msi-inner" maskUnits="userSpaceOnUse" x="-14" y="-14" width="168" height="168">
<rect x="-14" y="-14" width="168" height="168" fill="#fff"/>
<rect x="0" y="0" width="140" height="140" fill="none" stroke="#000" stroke-width="16" stroke-linecap="round" stroke-dasharray="0 14"/>
</mask>
</defs>
<g id="stamp">
