<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <g id="ledger" stroke="#2b2622" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- postal-red cloth cover showing round the pages -->
    <path id="cover" d="M44,112 Q44,100 56,100 L192,104 L200,110 L208,104 L344,100 Q356,100 356,112 L356,300 Q356,310 346,310 L208,306 L200,312 L192,306 L54,310 Q44,310 44,300 Z" fill="#9e1b1b"/>
