<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Flat ink bank building, drawing 300x300 centred (x 50-350, y 50-350). No logo, no words. -->
  <g fill="none" stroke="#2b2622" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <g id="steps">
      <rect x="50" y="326" width="300" height="24" rx="2" fill="#ead9a8"/>
      <rect x="64" y="306" width="272" height="20" rx="2" fill="#f3ead6"/>
    </g>
    <g id="front">
      <rect x="78" y="156" width="244" height="150" fill="#ead9a8"/>
    </g>
    <g id="columns">
      <g>
        <rect x="100" y="166" width="44" height="12" rx="2" fill="#fbf7ee"/>
        <rect x="106" y="178" width="32" height="116" fill="#fbf7ee"/>
        <rect x="100" y="294" width="44" height="12" rx="2" fill="#fbf7ee"/>
        <path d="M116 190 V282 M128 190 V282"/>
      </g>
      <g>
        <rect x="178" y="166" width="44" height="12" rx="2" fill="#fbf7ee"/>
        <rect x="184" y="178" width="32" height="116" fill="#fbf7ee"/>
        <rect x="178" y="294" width="44" height="12" rx="2" fill="#fbf7ee"/>
        <path d="M194 190 V282 M206 190 V282"/>
      </g>
      <g>
        <rect x="256" y="166" width="44" height="12" rx="2" fill="#fbf7ee"/>
        <rect x="262" y="178" width="32" height="116" fill="#fbf7ee"/>
        <rect x="256" y="294" width="44" height="12" rx="2" fill="#fbf7ee"/>
        <path d="M272 190 V282 M284 190 V282"/>
      </g>
    </g>
    <g id="pediment">
      <rect x="64" y="136" width="272" height="20" rx="2" fill="#7d1414"/>
      <path d="M56 136 L200 54 L344 136 Z" fill="#9e1b1b"/>
    </g>
    <g id="plate">
      <rect x="160" y="98" width="80" height="26" rx="4" fill="#fbf7ee"/>
    </g>
  </g>
  <circle data-anchor="top" cx="200" cy="52" r="0"/>
  <circle data-anchor="base" cx="200" cy="350" r="0"/>
</svg>
