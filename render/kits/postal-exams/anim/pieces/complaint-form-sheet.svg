    <rect id="paper" x="12" y="12" width="336" height="456" rx="10" fill="#ffffff" stroke="#2b2622" stroke-width="3"/>
    <path id="header" d="M12,22 Q12,12 22,12 H338 Q348,12 348,22 V80 H12 Z" fill="#9e1b1b" stroke="#2b2622" stroke-width="3"/>
