      <g id="field-4"><rect x="36" y="284" width="288" height="46" rx="4"/><path d="M50,318 H310" stroke="#ead9a8"/></g>
      <g id="field-5"><rect x="36" y="344" width="288" height="46" rx="4"/><path d="M50,378 H310" stroke="#ead9a8"/></g>
