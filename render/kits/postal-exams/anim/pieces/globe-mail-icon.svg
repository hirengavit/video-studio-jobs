<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Flat ink globe (cream sea, sand land blobs, no real countries) with a small white envelope flying on a dashed arc. -->
  <defs>
    <clipPath id="globe-mail-icon-clip"><circle cx="150" cy="166" r="106"/></clipPath>
  </defs>
  <g id="globe-mail" stroke-linecap="round" stroke-linejoin="round">
    <g id="globe">
      <circle cx="150" cy="166" r="106" fill="#fbf7ee"/>
      <g id="land" clip-path="url(#globe-mail-icon-clip)" fill="#ead9a8" stroke="#2b2622" stroke-width="2.5">
        <path d="M80,100 C104,84 140,92 138,114 C136,132 116,128 110,150 C104,172 82,174 74,154 C66,134 62,112 80,100 Z"/>
        <path d="M172,124 C198,112 234,128 232,156 C230,180 208,174 200,196 C192,218 168,216 164,194 C160,174 152,134 172,124 Z"/>
        <path d="M100,212 C118,204 138,218 132,234 C126,250 104,250 98,236 C94,226 92,216 100,212 Z"/>
        <path d="M194,80 C208,76 222,86 216,96 C210,104 196,100 194,80 Z"/>
      </g>
