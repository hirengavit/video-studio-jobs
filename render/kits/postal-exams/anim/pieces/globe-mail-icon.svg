      <rect x="-30" y="-20" width="60" height="40" rx="3" fill="#ffffff"/>
      <path d="M-30,-18 L0,4 L30,-18" fill="none"/>
    </g>
  </g>
  <circle data-anchor="base" cx="150" cy="273.5" r="0"/>
</svg>
